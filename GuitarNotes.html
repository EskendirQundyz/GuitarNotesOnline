/**
 * @module fretboard-view-find-note
 * @description Маркеры результата в режиме «Найди ноту» на SVG-грифе.
 * @depends note, fretboard-view-svg
 */

function createFindNoteMarkHandlers({
  matchLayer,
  cellCenters,
  hideSelected,
  hideHover,
  styleRainbowDot,
  clearMatches,
  clearGuess,
}) {
  const findNoteMarks = new Map();

  function positionKey(string, fret) {
    return `${string}:${fret}`;
  }

  function styleWhiteDot(dot) {
    dot.setAttribute('fill', 'rgba(255, 255, 255, 0.95)');
    dot.removeAttribute('fill-opacity');
    dot.setAttribute('stroke', 'rgba(0, 0, 0, 0.14)');
    dot.setAttribute('stroke-width', '1');
    dot.setAttribute('class', 'fret-tap fret-tap-selected');
  }

  function fadeOutAndRemove(dot, durationMs, onComplete) {
    const fillStart = parseFloat(dot.getAttribute('fill-opacity') || '1');
    const strokeStart = parseFloat(dot.getAttribute('stroke-opacity') || '1');
    const start = performance.now();

    function frame(now) {
      const progress = Math.min(1, (now - start) / durationMs);
      const remaining = 1 - progress;
      dot.setAttribute('fill-opacity', String(fillStart * remaining));
      dot.setAttribute('stroke-opacity', String(strokeStart * remaining));

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        dot.remove();
        onComplete?.();
      }
    }

    requestAnimationFrame(frame);
  }

  function showFindNoteResult(cx, cy, isCorrect, pitchClass, options = {}) {
    hideSelected();
    hideHover();

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', 10);
    dot.setAttribute('class', 'fret-tap fret-tap-result');
    dot.setAttribute('pointer-events', 'none');

    if (isCorrect) {
      styleRainbowDot(dot, getNoteRainbowColor(pitchClass));
    } else {
      styleWhiteDot(dot);
    }

    matchLayer.appendChild(dot);

    if (options.fadeMs) {
      fadeOutAndRemove(dot, options.fadeMs);
    }
  }

  function appendMarkedDot(cx, cy, key) {
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('data-find-key', key);
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', 10);
    matchLayer.appendChild(dot);
    return dot;
  }

  function markFindNotePosition(string, fret, isCorrect, pitchClass, options = {}) {
    const key = positionKey(string, fret);
    if (findNoteMarks.get(key) === 'correct') return;

    matchLayer.querySelectorAll(`[data-find-key="${key}"]`).forEach((el) => el.remove());

    const cell = cellCenters.find((c) => c.string === string && c.fret === fret);
    if (!cell) return;

    const dot = appendMarkedDot(cell.cx, cell.cy, key);
    if (isCorrect) {
      styleRainbowDot(dot, getNoteRainbowColor(pitchClass));
      findNoteMarks.set(key, 'correct');
    } else {
      styleWhiteDot(dot);
      findNoteMarks.set(key, 'wrong');
      if (options.fadeMs) {
        fadeOutAndRemove(dot, options.fadeMs, () => {
          findNoteMarks.delete(key);
          options.onFadeComplete?.();
        });
      }
    }

    hideSelected();
    hideHover();
  }

  function fadeOutAllFindNoteMarks(durationMs, onComplete) {
    const dots = [...matchLayer.querySelectorAll('[data-find-key]')];

    if (dots.length === 0) {
      findNoteMarks.clear();
      onComplete?.();
      return;
    }

    let pending = dots.length;
    dots.forEach((dot) => {
      const markKey = dot.getAttribute('data-find-key');
      fadeOutAndRemove(dot, durationMs, () => {
        if (markKey) findNoteMarks.delete(markKey);
        pending -= 1;
        if (pending === 0) {
          findNoteMarks.clear();
          onComplete?.();
        }
      });
    });
  }

  function clearFindNoteMarks() {
    findNoteMarks.clear();
    clearMatches();
    clearGuess();
  }

  function isFindNoteMarkCorrect(string, fret) {
    return findNoteMarks.get(positionKey(string, fret)) === 'correct';
  }

  return {
    showFindNoteResult,
    markFindNotePosition,
    fadeOutAllFindNoteMarks,
    clearFindNoteMarks,
    isFindNoteMarkCorrect,
  };
}


// ----- js/fretboard-view-interaction.js -----

/**
 * @module fretboard-view-interaction
 * @description Интерактивные слои грифа: клики, подсветка, find-note marks.
 * @depends fretboard, note, fretboard-view-find-note, fretboard-view-svg
 */

function attachFretboardInteraction({
  container,
  guitar,
  interactive,
  stringCount,
  cellCenters,
  stringVisualGroups,
  matchLayer,
  statsLayer,
  selectedDot,
  hoverDot,
  statsScores,
}) {
  let selection = null;

  function styleRainbowDot(dot, color, opacity = 1) {
    dot.setAttribute('fill', color);
    if (opacity < 1) {
      dot.setAttribute('fill-opacity', String(opacity));
    } else {
      dot.removeAttribute('fill-opacity');
    }
    dot.setAttribute('stroke', 'rgba(255, 255, 255, 0.92)');
    dot.setAttribute('stroke-width', '1.5');
    dot.setAttribute('class', 'fret-tap fret-tap-rainbow');
  }

  function hideSelected() {
    selectedDot.setAttribute('visibility', 'hidden');
  }

  function hideHover() {
    hoverDot.setAttribute('visibility', 'hidden');
  }

  function showSelectedAt(cx, cy, note) {
    selectedDot.setAttribute('cx', cx);
    selectedDot.setAttribute('cy', cy);
    if (note) {
      styleRainbowDot(selectedDot, getNoteRainbowColor(getPitchClass(note)));
    }
    selectedDot.setAttribute('visibility', 'visible');
  }

  function showHoverAt(cx, cy) {
    hoverDot.setAttribute('cx', cx);
    hoverDot.setAttribute('cy', cy);
    hoverDot.setAttribute('fill', 'rgba(255, 255, 255, 0.42)');
    hoverDot.removeAttribute('fill-opacity');
    hoverDot.setAttribute('stroke', 'rgba(255, 255, 255, 0.55)');
    hoverDot.setAttribute('stroke-width', '1');
    hoverDot.setAttribute('class', 'fret-tap fret-tap-hover');
    hoverDot.setAttribute('visibility', 'visible');
  }

  function setSelection(cx, cy, note) {
    selection = { cx, cy, note };
    showSelectedAt(cx, cy, note);
    hideHover();
  }

  function clearMatches() {
    matchLayer.replaceChildren();
  }

  function clearGuess() {
    selection = null;
    hideSelected();
    hideHover();
    selectedDot.removeAttribute('fill-opacity');
    selectedDot.removeAttribute('stroke-opacity');
  }

  const findNoteMarks = createFindNoteMarkHandlers({
    matchLayer,
    cellCenters,
    hideSelected,
    hideHover,
    styleRainbowDot,
    clearMatches,
    clearGuess,
  });

  function appendRainbowDot(cx, cy, color, note = null) {
    const parsed = note ? parseNote(note) : null;
    const octaveLabel = parsed ? getRussianOctaveLabel(parsed.octave) : '';

    if (!octaveLabel) {
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('class', 'fret-tap fret-tap-rainbow');
      dot.setAttribute('cx', cx);
      dot.setAttribute('cy', cy);
      dot.setAttribute('r', 10);
      dot.setAttribute('fill', color);
      dot.setAttribute('stroke', 'rgba(255, 255, 255, 0.92)');
      dot.setAttribute('stroke-width', '1.5');
      matchLayer.appendChild(dot);
      return;
    }

    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.setAttribute('class', 'fret-tap fret-tap-rainbow fret-tap-labeled');
    group.setAttribute('pointer-events', 'none');

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', 10);
    dot.setAttribute('fill', color);
    dot.setAttribute('stroke', 'rgba(255, 255, 255, 0.92)');
    dot.setAttribute('stroke-width', '1.5');
    group.appendChild(dot);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', String(cx));
    text.setAttribute('y', String(cy));
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.setAttribute('font-size', '8.5');
    text.setAttribute('font-weight', '700');
    text.setAttribute('fill', getContrastTextColor(color));
    text.setAttribute('class', 'fret-tap-label');
    text.textContent = octaveLabel;
    group.appendChild(text);

    matchLayer.appendChild(group);
  }

  function highlightPitchClass(pitchClass) {
    clearMatches();
    const color = getNoteRainbowColor(pitchClass);

    for (const { fret, string, cx, cy } of cellCenters) {
      const note = getNoteAtFret(guitar, string, fret);
      if (getPitchClass(note) !== pitchClass) continue;
      appendRainbowDot(cx, cy, color, note);
    }
  }

  function highlightAllNotes() {
    clearMatches();

    for (const { fret, string, cx, cy } of cellCenters) {
      const note = getNoteAtFret(guitar, string, fret);
      appendRainbowDot(cx, cy, getNoteRainbowColor(getPitchClass(note)), note);
    }
  }

  function statsGreenStyle(strength) {
    const t = Math.max(0, Math.min(1, strength));

    const fillR = Math.round(214 + (74 - 214) * t);
    const fillG = Math.round(245 + (222 - 245) * t);
    const fillB = Math.round(228 + (128 - 228) * t);
    const fillAlpha = 0.05 + t * 0.95;

    const strokeR = Math.round(134 + (21 - 134) * t);
    const strokeG = Math.round(196 + (128 - 196) * t);
    const strokeB = Math.round(154 + (61 - 154) * t);
    const strokeAlpha = 0.08 + t * 0.92;

    return {
      fill: `rgba(${fillR}, ${fillG}, ${fillB}, ${fillAlpha})`,
      stroke: `rgba(${strokeR}, ${strokeG}, ${strokeB}, ${strokeAlpha})`,
      tier: t >= 0.72 ? 'strong' : t >= 0.38 ? 'mid' : 'weak',
    };
  }

  function renderStatsHeatmap(scores) {
    statsLayer.replaceChildren();
    if (!scores || scores.size === 0) return;

    for (const { fret, string, cx, cy } of cellCenters) {
      const key = `${string}:${fret}`;
      const entry = scores.get(key);
      if (!entry) continue;

      const strength = entry.heatmapStrength ?? entry.normalized ?? 0;
      const style = statsGreenStyle(strength);
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('class', `stats-note-dot stats-note-dot--${style.tier}`);
      dot.setAttribute('cx', cx);
      dot.setAttribute('cy', cy);
      dot.setAttribute('r', style.tier === 'strong' ? 11 : 10);
      dot.setAttribute('fill', style.fill);
      dot.setAttribute('stroke', style.stroke);
      dot.setAttribute(
        'stroke-width',
        style.tier === 'strong' ? '1.8' : style.tier === 'mid' ? '1.4' : '1.1'
      );
      statsLayer.appendChild(dot);
    }
  }

  function addHitCell(hitLayer, x, y, w, h, fret, string, tapX, tapY) {
    const cell = rect(x, y, w, h, {
      fill: 'transparent',
      class: 'fret-cell',
      'data-fret': fret,
      'data-string': string,
      'pointer-events': interactive ? 'all' : 'none',
    });
    const cx = tapX ?? x + w / 2;
    const cy = tapY ?? y + h / 2;
    cellCenters.push({ fret, string, cx, cy });

    if (!interactive) {
      hitLayer.appendChild(cell);
      return;
    }

    cell.addEventListener('mouseenter', () => {
      const mode = container.dataset.mode || 'fret-note';
      if (
        mode === 'find-note' &&
        container.dataset.findVariant === 'all' &&
        findNoteMarks.isFindNoteMarkCorrect(string, fret)
      ) {
        hideHover();
        return;
      }

      if (selection && selection.cx === cx && selection.cy === cy) {
        hideHover();
        return;
      }
      showHoverAt(cx, cy);
    });
    cell.addEventListener('mouseleave', hideHover);
    cell.addEventListener('click', () => {
      const note = getNoteAtFret(guitar, string, fret);
      const mode = container.dataset.mode || 'fret-note';

      if (mode === 'note-frets') {
        hideSelected();
        hideHover();
      } else if (mode === 'find-note') {
        hideHover();
      } else {
        setSelection(cx, cy, note);
      }

      container.dispatchEvent(
        new CustomEvent('fret-click', {
          detail: { fret, string, note, cx, cy },
        })
      );
    });
    hitLayer.appendChild(cell);
  }

  return {
    addHitCell,
    highlightPitchClass,
    highlightAllNotes,
    showFindNoteResult: findNoteMarks.showFindNoteResult,
    markFindNotePosition: findNoteMarks.markFindNotePosition,
    clearGuess,
    clearFindNoteMarks: findNoteMarks.clearFindNoteMarks,
    fadeOutAllFindNoteMarks: findNoteMarks.fadeOutAllFindNoteMarks,
    renderStatsHeatmap,
    setFindNoteTargetString(stringIndex) {
      const activeIndex =
        typeof stringIndex === 'number' && stringIndex >= 0 && stringIndex < stringCount
          ? stringIndex
          : null;
      stringVisualGroups.forEach((group, index) => {
        group.classList.toggle('find-note-target-string', index === activeIndex);
      });
    },
    getCellDetail(string, fret) {
      const cell = cellCenters.find((c) => c.string === string && c.fret === fret);
      return cell
        ? { fret, string, cx: cell.cx, cy: cell.cy, note: getNoteAtFret(guitar, string, fret) }
        : null;
    },
    clearPitchHighlights: clearMatches,
  };
}


// ----- js/fretboard-view-neck.js -----

/**
 * @module fretboard-view-neck
 * @description SVG-отрисовка грифа: лады, струны, маркеры.
 * @depends fretboard, fretboard-view-layout, fretboard-view-svg
 */

function renderFretboardNeck(guitar) {
  const stringCount = guitar.strings;
  const fretCount = guitar.frets;
  const theme = guitar.theme;

  const {
    paddingLeft,
    labelColumnX,
    paddingRight,
    headstockWidth,
    paddingTop,
    paddingBottom,
    drawableWidth,
    stringSpacing,
    stringInset,
  } = FRETBOARD_LAYOUT;

  const neckHeight = (stringCount - 1) * stringSpacing + stringInset * 2;
  const fretPositions = buildFretPositions(guitar, drawableWidth);
  const totalWidth = paddingLeft + drawableWidth + paddingRight;
  const totalHeight = paddingTop + neckHeight + paddingBottom;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const neckGrad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
  neckGrad.setAttribute('id', 'neckGrad');
  neckGrad.setAttribute('x1', '0%');
  neckGrad.setAttribute('y1', '0%');
  neckGrad.setAttribute('x2', '0%');
  neckGrad.setAttribute('y2', '100%');
  neckGrad.innerHTML = `
    <stop offset="0%" stop-color="${lighten(theme.fretboard, 15)}"/>
    <stop offset="50%" stop-color="${theme.fretboard}"/>
    <stop offset="100%" stop-color="${darken(theme.fretboard, 10)}"/>
  `;
  defs.appendChild(neckGrad);
  svg.appendChild(defs);

  const neckY = paddingTop;
  const neckX = paddingLeft - 8;
  const neckW = drawableWidth + 16;
  const nutW = 6;
  const nutX = paddingLeft - nutW;

  svg.appendChild(
    rect(neckX, neckY - 4, neckW, neckHeight + 8, {
      fill: 'url(#neckGrad)',
      rx: 4,
      stroke: darken(theme.fretboard, 20),
      'stroke-width': 1,
    })
  );

  svg.appendChild(
    rect(nutX, neckY - 2, nutW, neckHeight + 4, {
      fill: theme.nut,
      rx: 1,
      stroke: darken(theme.nut, 15),
      'stroke-width': 0.5,
    })
  );

  for (let f = 1; f <= fretCount; f++) {
    const x = paddingLeft + fretPositions[f];
    svg.appendChild(
      lineEl(x, neckY, x, neckY + neckHeight, {
        stroke: theme.frets,
        'stroke-width': f === 12 ? 2.5 : 1.5,
        'stroke-linecap': 'round',
      })
    );

    const labelX = paddingLeft + (fretPositions[f] + fretPositions[f - 1]) / 2;
    svg.appendChild(
      textEl(labelX, neckY - 12, String(f), {
        fill: theme.markers,
        'font-size': 10,
        'text-anchor': 'middle',
        opacity: 0.7,
      })
    );
  }

  for (const f of STANDARD_MARKER_FRETS.filter((marker) => marker <= fretCount)) {
    const x = paddingLeft + (fretPositions[f] + fretPositions[f - 1]) / 2;
    const centerY = neckY + neckHeight / 2;

    if (f === 12 && fretCount >= 12) {
      addDot(svg, x, centerY - stringSpacing * 0.8, theme);
      addDot(svg, x, centerY + stringSpacing * 0.8, theme);
    } else {
      addDot(svg, x, centerY, theme);
    }
  }

  const labelsLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  labelsLayer.setAttribute('class', 'string-labels');
  labelsLayer.setAttribute('pointer-events', 'none');

  const stringsLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  stringsLayer.setAttribute('class', 'strings-layer');
  stringsLayer.setAttribute('pointer-events', 'none');

  const stringVisualGroups = [];

  for (let s = 0; s < stringCount; s++) {
    const y = stringY(neckY, s, stringSpacing, stringInset);
    const cfg = getStringStyle(guitar, s);
    const stringStart = paddingLeft - nutW - headstockWidth;
    const stringEnd = paddingLeft + drawableWidth;

    const stringGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    stringGroup.setAttribute('class', 'string-visual');
    stringGroup.setAttribute('data-string-index', String(s));

    stringGroup.appendChild(
      lineEl(stringStart, y, stringEnd, y, {
        class: 'string-shadow-line',
        stroke: '#120a06',
        'stroke-width': cfg.width + 1.6,
        'stroke-linecap': 'round',
        opacity: 0.55,
        'pointer-events': 'none',
      })
    );

    if (cfg.type === 'wound') {
      stringGroup.appendChild(
        lineEl(stringStart, y, stringEnd, y, {
          class: 'string-wrap-line',
          stroke: cfg.wrap,
          'stroke-width': cfg.width + 0.9,
          'stroke-linecap': 'round',
          opacity: 0.75,
          'pointer-events': 'none',
        })
      );
    }

    stringGroup.appendChild(
      lineEl(stringStart, y, stringEnd, y, {
        class: 'string-main-line',
        stroke: cfg.color,
        'stroke-width': cfg.width,
        'stroke-linecap': 'round',
        'pointer-events': 'none',
      })
    );

    stringGroup.appendChild(
      lineEl(stringStart, y - 0.8, stringEnd, y - 0.8, {
        class: 'string-shine-line',
        stroke: cfg.highlight,
        'stroke-width': 0.7,
        'stroke-linecap': 'round',
        opacity: cfg.type === 'wound' ? 0.35 : 0.65,
        'pointer-events': 'none',
      })
    );

    stringsLayer.appendChild(stringGroup);
    stringVisualGroups.push(stringGroup);

    labelsLayer.appendChild(
      rect(labelColumnX - 16, y - 9, 32, 18, {
        class: 'string-label-bg',
        fill: '#ffffff',
        stroke: '#b8b8c4',
        'stroke-width': 1,
        rx: 5,
      })
    );
    labelsLayer.appendChild(
      textEl(labelColumnX, y + 1, getVisualStringLabel(guitar, s), {
        class: 'string-label-text',
        fill: '#14141a',
        'font-size': 15,
        'font-weight': '700',
        'text-anchor': 'middle',
        'dominant-baseline': 'middle',
        'pointer-events': 'none',
      })
    );
  }

  svg.appendChild(stringsLayer);
  svg.appendChild(labelsLayer);

  return {
    svg,
    neckY,
    paddingLeft,
    nutW,
    nutX,
    headstockWidth,
    stringSpacing,
    stringInset,
    fretPositions,
    fretCount,
    stringCount,
    stringVisualGroups,
    totalWidth,
    totalHeight,
  };
}


// ----- js/fretboard-view.js -----

/**
 * @module fretboard-view
 * @description SVG-рендер грифа и интерактивные hit-слои.
 * @depends fretboard-view-layout, fretboard-view-neck, fretboard-view-interaction
 */

function renderFretboard(guitar, container, options = {}) {
  const interactive = options.interactive !== false;
  const statsScores = options.statsScores ?? null;

  const neck = renderFretboardNeck(guitar);
  const {
    svg,
    neckY,
    paddingLeft,
    nutW,
    nutX,
    headstockWidth,
    stringSpacing,
    stringInset,
    fretPositions,
    fretCount,
    stringCount,
    stringVisualGroups,
    totalWidth,
    totalHeight,
  } = neck;

  svg.setAttribute('role', 'img');
  svg.setAttribute(
    'aria-label',
    statsScores ? 'Статистика отгадывания нот на грифе' : 'Гриф гитары'
  );

  const hitLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  hitLayer.setAttribute('class', 'hit-layer');

  const tapLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  tapLayer.setAttribute('class', 'tap-layer');
  tapLayer.setAttribute('pointer-events', 'none');

  const selectedDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  selectedDot.setAttribute('class', 'fret-tap fret-tap-selected');
  selectedDot.setAttribute('r', 10);
  selectedDot.setAttribute('visibility', 'hidden');
  tapLayer.appendChild(selectedDot);

  const hoverDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  hoverDot.setAttribute('class', 'fret-tap fret-tap-hover');
  hoverDot.setAttribute('r', 10);
  hoverDot.setAttribute('visibility', 'hidden');
  tapLayer.appendChild(hoverDot);

  const matchLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  matchLayer.setAttribute('class', 'match-layer');
  matchLayer.setAttribute('pointer-events', 'none');
  tapLayer.appendChild(matchLayer);

  const statsLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  statsLayer.setAttribute('class', 'stats-layer');
  statsLayer.setAttribute('pointer-events', 'none');
  tapLayer.appendChild(statsLayer);

  const cellCenters = [];
  const interaction = attachFretboardInteraction({
    container,
    guitar,
    interactive,
    stringCount,
    cellCenters,
    stringVisualGroups,
    matchLayer,
    statsLayer,
    selectedDot,
    hoverDot,
    statsScores,
  });

  for (let f = 1; f <= fretCount; f++) {
    const x1 = paddingLeft + fretPositions[f - 1];
    const x2 = paddingLeft + fretPositions[f];

    for (let s = 0; s < stringCount; s++) {
      interaction.addHitCell(
        hitLayer,
        x1,
        stringY(neckY, s, stringSpacing, stringInset) - stringSpacing / 2,
        x2 - x1,
        stringSpacing,
        f,
        s
      );
    }
  }

  const openStringRightPad = 14;
  for (let s = 0; s < stringCount; s++) {
    const y = stringY(neckY, s, stringSpacing, stringInset);
    const openHitX = paddingLeft - nutW - headstockWidth;
    const openHitW = paddingLeft - openHitX + openStringRightPad;
    const nutCenterX = nutX + nutW / 2;
    interaction.addHitCell(
      hitLayer,
      openHitX,
      y - stringSpacing / 2,
      openHitW,
      stringSpacing,
      0,
      s,
      nutCenterX,
      y
    );
  }

  svg.appendChild(hitLayer);
  svg.appendChild(tapLayer);

  if (statsScores) {
    interaction.renderStatsHeatmap(statsScores);
  }

  container.innerHTML = '';
  container.appendChild(svg);
  if (statsScores) {
    container.classList.add('fretboard-stats-view');
  } else {
    container.classList.remove('fretboard-stats-view');
  }

  container.highlightPitchClass = interaction.highlightPitchClass;
  container.highlightAllNotes = interaction.highlightAllNotes;
  container.showFindNoteResult = interaction.showFindNoteResult;
  container.markFindNotePosition = interaction.markFindNotePosition;
  container.clearGuess = interaction.clearGuess;
  container.clearFindNoteMarks = interaction.clearFindNoteMarks;
  container.fadeOutAllFindNoteMarks = interaction.fadeOutAllFindNoteMarks;
  container.getCellDetail = interaction.getCellDetail;
  container.clearPitchHighlights = interaction.clearPitchHighlights;
  container.setFindNoteTargetString = interaction.setFindNoteTargetString;
  container.updateStatsHeatmap = interaction.renderStatsHeatmap;

  return svg;
}


// ----- js/staff-view.js -----

/**
 * @module staff-view
 * @description Рендер ноты на нотном стане.
 * @depends staff
 */

const STAFF_LEFT = 60;
const STAFF_WIDTH = 180;
const NOTE_RX = 8;
const NOTE_RY = 6;
const LEDGER_HALF_WIDTH = 16;
const PADDING_X = 18;
const PADDING_Y = 18;

function getLedgerYs(noteY, staffTop, staffBottom) {
  const ledgerYs = [];
  if (noteY < staffTop - 1) {
    for (let y = staffTop - LINE_SPACING; y >= noteY - 0.5; y -= LINE_SPACING) {
      ledgerYs.push(y);
    }
  } else if (noteY > staffBottom + 1) {
    for (let y = staffBottom + LINE_SPACING; y <= noteY + 0.5; y += LINE_SPACING) {
      ledgerYs.push(y);
    }
  }
  return ledgerYs;
}

function getViewBounds(noteY, ledgerYs, staffBottom) {
  const yValues = [STAFF_TOP, staffBottom, noteY - NOTE_RY, noteY + NOTE_RY, ...ledgerYs];
  const minY = Math.min(...yValues) - PADDING_Y;
  const maxY = Math.max(...yValues) + PADDING_Y;
  const minX = -4;
  const maxX = STAFF_LEFT + STAFF_WIDTH + PADDING_X;

  return {
    minX,
    minY,
    width: maxX - minX,
    height: maxY - minY,
  };
}

function renderNoteOnStaff(container, pitchName) {
  const match = pitchName.match(/^([A-G])(#?)(\d)$/);
  if (!match) {
    container.innerHTML = '';
    return;
  }

  const [, letter, accidental, octaveStr] = match;
  const soundingOctave = parseInt(octaveStr, 10);
  const staffOctave = soundingOctave + 1;
  const staffBottom = STAFF_TOP + LINE_SPACING * 4;
  const middleLineY = STAFF_TOP + LINE_SPACING * 2;
  const noteX = STAFF_LEFT + STAFF_WIDTH * 0.58;

  const steps = stepsFromB4(letter, staffOctave);
  const noteY = middleLineY - steps * (LINE_SPACING / 2);
  const ledgerYs = getLedgerYs(noteY, STAFF_TOP, staffBottom);
  const view = getViewBounds(noteY, ledgerYs, staffBottom);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `${view.minX} ${view.minY} ${view.width} ${view.height}`);
  svg.setAttribute('class', 'note-staff');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.setAttribute('aria-hidden', 'true');

  for (let i = 0; i < 5; i++) {
    const y = STAFF_TOP + i * LINE_SPACING;
    svg.appendChild(staffLine(STAFF_LEFT, y, STAFF_WIDTH));
  }

  svg.appendChild(clef(STAFF_LEFT - 4, STAFF_TOP - 8));

  for (const y of ledgerYs) {
    svg.appendChild(staffLine(noteX - LEDGER_HALF_WIDTH, y, LEDGER_HALF_WIDTH * 2));
  }

  if (accidental) {
    svg.appendChild(sharp(noteX - 24, noteY));
  }

  svg.appendChild(noteHead(noteX, noteY));

  container.innerHTML = '';
  container.appendChild(svg);
}

function staffLine(x, y, width) {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x);
  line.setAttribute('y1', y);
  line.setAttribute('x2', x + width);
  line.setAttribute('y2', y);
  line.setAttribute('class', 'staff-line');
  return line;
}

function clef(x, y) {
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', x);
  text.setAttribute('y', y + LINE_SPACING * 4.4);
  text.setAttribute('class', 'staff-clef');
  text.textContent = '𝄞';
  return text;
}

function sharp(x, y) {
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', x);
  text.setAttribute('y', y + 5);
  text.setAttribute('class', 'staff-accidental');
  text.textContent = '♯';
  return text;
}

function noteHead(x, y) {
  const note = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
  note.setAttribute('cx', x);
  note.setAttribute('cy', y);
  note.setAttribute('rx', NOTE_RX);
  note.setAttribute('ry', NOTE_RY);
  note.setAttribute('class', 'staff-note');
  return note;
}

/**
 * @module mode-fret-note
 * @description Режим «Что за нота?» — клик по ладу показывает ноту и стан.
 * @depends config, note, fretboard, staff-view, note-chip
 */

function createFretNoteMode(deps) {
  const { elements } = deps;

  function showSelection(fret, string, note) {
    const parsed = parseNote(note);

    elements.selectionPanel.hidden = false;
    syncNoteChipWidth();
    elements.detailNote.innerHTML = parsed
      ? buildNoteChipGridHtml(parsed.pitch)
      : `<span class="selection-value">${note}</span>`;
    elements.detailOctave.textContent = parsed ? getRussianOctaveName(parsed.octave) : '—';
    elements.detailPosition.textContent = formatPosition(GUITAR, string, fret);

    if (parsed) {
      renderNoteOnStaff(elements.staffContainer, parsed.full);
    } else {
      elements.staffContainer.innerHTML = '';
    }
  }

  function clearSelection() {
    elements.selectionPanel.hidden = true;
    elements.detailNote.innerHTML = '';
    elements.staffContainer.innerHTML = '';
    elements.fretboardContainer.clearPitchHighlights?.();
  }

  function onFretClick(detail) {
    showSelection(detail.fret, detail.string, detail.note);
  }

  function onOutsideClick() {
    clearSelection();
  }

  return {
    enter() {
      elements.selectionPanel.hidden = true;
    },
    leave() {
      clearSelection();
    },
    onFretClick,
    onOutsideClick,
  };
}

/**
 * @module mode-note-frets
 * @description Режим «Октавные точки» — выбор pitch class подсвечивает позиции на грифе.
 * @depends note, note-chip
 */

function createNoteFretsMode(deps) {
  const { elements } = deps;

  let selectedPitchClass = null;
  let showAllNotes = false;

  function buildPalette() {
    elements.notePalette.innerHTML = PITCH_CLASSES.map((pitchClass) =>
      buildNoteChipHtml(pitchClass, { interactive: true })
    ).join('');

    elements.notePalette.querySelectorAll('.note-palette-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        selectPitchClass(btn.dataset.pitch);
      });
    });
  }

  function updatePaletteUI() {
    elements.showAllNotesBtn.classList.toggle('active', showAllNotes);
    elements.showAllNotesBtn.setAttribute('aria-pressed', String(showAllNotes));

    elements.notePalette.querySelectorAll('.note-palette-btn').forEach((btn) => {
      const pitch = btn.dataset.pitch;
      const isActive = !showAllNotes && pitch === selectedPitchClass;
      btn.classList.toggle('active', isActive);
      btn.classList.toggle('dimmed', !showAllNotes && selectedPitchClass !== null && !isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });
  }

  function selectPitchClass(pitchClass) {
    showAllNotes = false;
    selectedPitchClass = pitchClass;
    updatePaletteUI();
    elements.fretboardContainer.highlightPitchClass?.(pitchClass);
  }

  function showAllNotesOnFretboard() {
    showAllNotes = true;
    selectedPitchClass = null;
    updatePaletteUI();
    elements.fretboardContainer.highlightAllNotes?.();
  }

  function clearSelection() {
    selectedPitchClass = null;
    showAllNotes = false;
    elements.fretboardContainer.clearPitchHighlights?.();
    updatePaletteUI();
  }

  function onFretClick(detail) {
    selectPitchClass(getPitchClass(detail.note));
  }

  function onOutsideClick() {
    clearSelection();
  }

  return {
    enter() {
      elements.notePalettePanel.hidden = false;
      buildPalette();
      updatePaletteUI();
    },
    leave() {
      elements.notePalettePanel.hidden = true;
      clearSelection();
    },
    onFretClick,
    onOutsideClick,
    toggleShowAll() {
      if (showAllNotes) {
        clearSelection();
      } else {
        showAllNotesOnFretboard();
      }
    },
  };
}

/**
 * @module mode-find-note-stats
 * @description Статистика и heatmap в режиме «Найди ноту».
 * @depends find-note-stats, stats-fretboard-view, debug-log
 */

function createFindNoteStatsController({
  elements,
  getFindNote,
  getInputMode,
}) {
  let statsPanelOpen = false;
  let statsLogControls = null;

  function shouldCollectStats() {
    const findNote = getFindNote();
    return shouldCollectFindNoteStats(getInputMode(), findNote.variant);
  }

  function shouldShowStatsPanel() {
    return shouldCollectStats() && statsPanelOpen && !elements.findNotePanel?.hidden;
  }

  function syncStatsControls() {
    const showStatsTools = !elements.findNotePanel?.hidden && shouldCollectStats();

    statsLogControls?.sync();

    if (elements.findNoteStatsHeatmapBtn) {
      elements.findNoteStatsHeatmapBtn.hidden = !showStatsTools;
      elements.findNoteStatsHeatmapBtn.classList.toggle('active', statsPanelOpen);
    }

    if (elements.findNoteStatsPanel) {
      elements.findNoteStatsPanel.hidden = !shouldShowStatsPanel();
    }

    if (elements.findNoteStatsResetBtn) {
      elements.findNoteStatsResetBtn.hidden = !shouldShowStatsPanel();
    }
  }

  function renderStatsHeatmap() {
    const findNote = getFindNote();
    if (elements.findNoteStatsFretboard && findNote.positionScores) {
      renderFindNoteStatsFretboard(elements.findNoteStatsFretboard, findNote.positionScores);
    }
  }

  async function syncStatsPanel() {
    syncStatsControls();
    if (!shouldShowStatsPanel()) return;
    await refreshStatsCache();
    renderStatsHeatmap();
  }

  async function toggleStatsHeatmapPanel() {
    if (!shouldCollectStats()) return false;
    statsPanelOpen = !statsPanelOpen;
    syncStatsControls();
    await syncStatsPanel();
    return statsPanelOpen;
  }

  async function refreshStatsPanelAfterSave() {
    await refreshStatsCache();
    if (shouldShowStatsPanel()) {
      renderStatsHeatmap();
    }
    if (isStatsLogPanelOpen()) {
      void statsLogControls?.refresh();
    }
  }

  function syncStatsTask() {
    const findNote = getFindNote();
    findNote.useStatsWeightedPicking =
      shouldCollectFindNoteStats(getInputMode(), findNote.variant) &&
      Boolean(findNote.positionScores?.size);

    beginFindNoteStatsTask(findNote, {
      inputMode: getInputMode(),
      variant: findNote.variant,
    });
  }

  async function refreshStatsCache() {
    const findNote = getFindNote();
    if (!shouldCollectFindNoteStats(getInputMode(), findNote.variant)) {
      findNote.positionScores = null;
      findNote.useStatsWeightedPicking = false;
      return;
    }

    try {
      const context = await buildFindNoteStatsContext({
        inputMode: getInputMode(),
        variant: findNote.variant,
      });
      findNote.positionScores = context.positionScores;
      findNote.useStatsWeightedPicking = context.positionScores.size > 0;
    } catch (error) {
      console.error(error);
      findNote.positionScores = null;
      findNote.useStatsWeightedPicking = false;
    }
  }

  async function prepareStatsForPicking() {
    const findNote = getFindNote();
    if (shouldCollectFindNoteStats(getInputMode(), findNote.variant)) {
      await refreshStatsCache();
      syncStatsTask();
    } else {
      findNote.positionScores = null;
      findNote.useStatsWeightedPicking = false;
    }
    await syncStatsPanel();
  }

  function initStatsLogControls() {
    if (statsLogControls) return;

    statsLogControls = initStatsLog({
      logButton: elements.findNoteDebugLogBtn,
      logPanel: elements.findNoteDebugLogPanel,
      isFindNotePanelVisible: () => !elements.findNotePanel?.hidden,
      shouldShowControls: () => !elements.findNotePanel?.hidden && shouldCollectStats(),
      getStatsModeFilter: () => {
        const findNote = getFindNote();
        return shouldCollectFindNoteStats(getInputMode(), findNote.variant)
          ? { inputMode: getInputMode(), variant: findNote.variant }
          : null;
      },
    });
  }

  async function resetStats() {
    if (
      !window.confirm(
        'Удалить всю статистику текущей сессии? Данные исчезнут после закрытия вкладки.'
      )
    ) {
      return;
    }

    const findNote = getFindNote();
    await clearFindNoteStatsRecords();
    discardFindNoteStatsTask();
    findNote.positionScores = null;
    findNote.useStatsWeightedPicking = false;
    await prepareStatsForPicking();
    syncStatsTask();
    if (isStatsLogPanelOpen()) {
      void statsLogControls?.refresh();
    }
  }

  function onPauseChanged(paused) {
    if (paused) {
      pauseFindNoteStatsTask();
    } else {
      resumeFindNoteStatsTask();
    }
  }

  function onLeave() {
    discardFindNoteStatsTask();
    statsPanelOpen = false;
    closeStatsLogPanel();
    syncStatsControls();
  }

  function onEnter() {
    statsPanelOpen = false;
    syncStatsControls();
  }

  return {
    shouldCollectStats,
    shouldShowStatsPanel,
    syncStatsControls,
    syncStatsPanel,
    toggleStatsHeatmapPanel,
    refreshStatsPanelAfterSave,
    syncStatsTask,
    prepareStatsForPicking,
    initStatsLogControls,
    resetStats,
    onPauseChanged,
    onLeave,
    onEnter,
  };
}


// ----- js/mode-find-note-ui.js -----

/**
 * @module mode-find-note-ui
 * @description UI режима «Найди ноту»: пауза, история, панель задачи, toggles.
 * @depends config, find-note, find-note-view, find-note-stats
 */

function createFindNoteUI({
  elements,
  getFindNote,
  getInputMode,
  stats,
  syncLayout,
}) {
  let findNotePaused = false;
  let findNotePauseUiSnapshot = null;
  let findNoteHistoryFadeFrame = null;

  function isPaused() {
    return findNotePaused;
  }

  function syncInputRules() {
    getFindNote().requireTargetString = getFindNote().variant === FIND_VARIANTS.ANY;
  }

  function syncStringHighlight() {
    const findNote = getFindNote();
    const shouldHighlight =
      !findNote.completed &&
      findNote.requireTargetString &&
      findNote.targetStringIndex !== null &&
      isStringEnabled(findNote, findNote.targetStringIndex);

    elements.fretboardContainer.setFindNoteTargetString?.(
      shouldHighlight ? findNote.targetStringIndex : null
    );
  }

  function syncPauseUI({ force = false } = {}) {
    const showPause = !elements.findNotePanel?.hidden;
    const paused = isPaused();
    const snapshot = `${showPause}:${paused}`;
    if (!force && snapshot === findNotePauseUiSnapshot) return;
    findNotePauseUiSnapshot = snapshot;

    const btn = elements.findNotePauseBtn;
    if (btn) {
      btn.hidden = !showPause;
      btn.classList.toggle('active', paused);
      btn.setAttribute('aria-pressed', String(paused));
      btn.setAttribute('aria-label', paused ? 'Продолжить' : 'Пауза');
      btn.title = paused ? 'Продолжить' : 'Пауза';
    }

    document.body.classList.toggle('find-note-paused', paused);

    if (paused) {
      elements.findNoteProgress.hidden = false;
      elements.findNoteProgress.textContent = 'Пауза';
    }
  }

  function setPaused(paused) {
    const next = Boolean(paused);
    if (findNotePaused === next) return;
    findNotePaused = next;
    stats.onPauseChanged(findNotePaused);
    syncPauseUI({ force: true });
    if (!findNotePaused) {
      refreshUI();
    }
  }

  function stopHistoryFade() {
    if (findNoteHistoryFadeFrame) {
      cancelAnimationFrame(findNoteHistoryFadeFrame);
      findNoteHistoryFadeFrame = null;
    }
  }

  function startHistoryFade() {
    if (findNoteHistoryFadeFrame) return;
    findNoteHistoryFadeFrame = requestAnimationFrame(tickHistoryFade);
  }

  function tickHistoryFade() {
    findNoteHistoryFadeFrame = null;
    refreshUI({ skipLayoutSync: true });
    const capacity = estimateHistoryCapacity();
    if (hasActiveHistoryFade(getFindNote(), performance.now(), capacity)) {
      startHistoryFade();
    }
  }

  function clearBoard() {
    const findNote = getFindNote();
    findNote.foundPositions.clear();
    findNote.wrongPositions.clear();
    elements.fretboardContainer.clearFindNoteMarks?.();
  }

  function updateStringToggleUI() {
    const findNote = getFindNote();
    elements.findNoteStringToggles?.forEach((btn) => {
      const stringIndex = Number(btn.dataset.stringIndex);
      const enabled = isStringEnabled(findNote, stringIndex);
      btn.classList.toggle('active', enabled);
      btn.setAttribute('aria-pressed', String(enabled));
      btn.disabled = enabled && getEnabledStringIndices(findNote).length === 1;
    });
  }

  function updateInputUI(onListenBlocked) {
    elements.findNoteInputs?.forEach((btn) => {
      const isListen = btn.dataset.findInput === FIND_INPUT.LISTEN;
      const disabled = isListen;
      btn.disabled = disabled;
      if (disabled && btn.dataset.findInput === getInputMode()) {
        onListenBlocked?.();
      }

      const isActive = !disabled && btn.dataset.findInput === getInputMode();
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });

    if (elements.findNoteMicStatus) {
      elements.findNoteMicStatus.textContent = '';
    }

    if (elements.findNoteRecalibrateBtn) {
      elements.findNoteRecalibrateBtn.hidden = true;
    }

    updateStringToggleUI();
  }

  function updateVariantUI() {
    const findNote = getFindNote();
    elements.findNoteVariants?.forEach((btn) => {
      const isActive = btn.dataset.findVariant === findNote.variant;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });
  }

  function refreshUI({ now = performance.now(), skipLayoutSync = false } = {}) {
    const findNote = getFindNote();
    if (!findNote.targetPitchClass) {
      syncPauseUI();
      return;
    }

    if (!skipLayoutSync) {
      syncInputRules();
      syncLayout?.();
    }

    const capacity = estimateHistoryCapacity();
    pruneExpiredHistory(findNote, now, capacity);
    elements.findNoteTarget.innerHTML = buildTaskPanelHtml(findNote, now, { capacity });
    syncStringHighlight();
    syncPauseUI();
    stats.syncStatsControls();

    if (isPaused()) {
      return;
    }

    const progress = buildProgressText(findNote);
    if (progress) {
      elements.findNoteProgress.hidden = false;
      elements.findNoteProgress.textContent = progress;
    } else {
      elements.findNoteProgress.hidden = true;
      elements.findNoteProgress.textContent = '';
    }
  }

  function restoreMarks() {
    const findNote = getFindNote();
    if (
      findNote.variant !== FIND_VARIANTS.ALL ||
      !findNote.targetPitchClass ||
      findNote.completed
    ) {
      return;
    }

    for (const key of findNote.foundPositions) {
      const [string, fret] = key.split('-').map(Number);
      elements.fretboardContainer.markFindNotePosition?.(
        string,
        fret,
        true,
        findNote.targetPitchClass
      );
    }

    for (const key of findNote.wrongPositions) {
      if (findNote.foundPositions.has(key)) continue;
      const [string, fret] = key.split('-').map(Number);
      elements.fretboardContainer.markFindNotePosition?.(
        string,
        fret,
        false,
        findNote.targetPitchClass
      );
    }
  }

  function startNewRound({ resetHistory = false } = {}) {
    syncInputRules();
    if (resetHistory) {
      stopHistoryFade();
      resetFindNoteHistory(getFindNote());
    }
    discardFindNoteStatsTask();
    startRound(getFindNote());
    clearBoard();
    refreshUI();
    void stats.prepareStatsForPicking().then(() => {
      stats.syncStatsTask();
    });
  }

  return {
    isPaused,
    setPaused,
    stopHistoryFade,
    startHistoryFade,
    clearBoard,
    updateInputUI,
    updateStringToggleUI,
    updateVariantUI,
    refreshUI,
    restoreMarks,
    startNewRound,
    usesMultiPositionTask: () => usesMultiPositionTask(getFindNote()),
  };
}


// ----- js/mode-find-note-attempts.js -----

/**
 * @module mode-find-note-attempts
 * @description Обработка попыток и статистики в режиме «Найди ноту».
 * @depends config, find-note, find-note-stats
 */

function createFindNoteAttempts({
  elements,
  getFindNote,
  getInputMode,
  stats,
  ui,
}) {
  function advanceToNextTarget(result) {
    const findNote = getFindNote();
    if (result.roundComplete) {
      findNote.completed = false;
      findNote.targetStringIndex = null;
    }

    if (result.roundComplete || result.needsNextTarget) {
      pickTarget(findNote);
      stats.syncStatsTask();
    }
  }

  async function afterStatsSaved(result) {
    await stats.refreshStatsPanelAfterSave();
    if (result) {
      advanceToNextTarget(result);
      ui.refreshUI();
    }
  }

  async function afterPartialStatsSaved() {
    await stats.refreshStatsPanelAfterSave();
    stats.syncStatsTask();
    ui.refreshUI();
  }

  function finishSuccess(result) {
    const findNote = getFindNote();
    if (shouldCollectFindNoteStats(getInputMode(), findNote.variant)) {
      void completeFindNoteStatsTask().then(() => afterStatsSaved(result));
      return;
    }

    advanceToNextTarget(result);
    ui.refreshUI();
  }

  function applyResult(result, detail) {
    const findNote = getFindNote();
    const multiPositionTask = ui.usesMultiPositionTask();

    switch (result.kind) {
      case 'ignored':
        return;

      case 'wrong': {
        recordFindNoteStatsError();
        const wrongFade = { fadeMs: FIND_NOTE_FADE_WRONG_MS };
        if (multiPositionTask) {
          const key = positionKey(detail.string, detail.fret);
          elements.fretboardContainer.markFindNotePosition?.(
            detail.string,
            detail.fret,
            false,
            findNote.targetPitchClass,
            {
              ...wrongFade,
              onFadeComplete: () => findNote.wrongPositions.delete(key),
            }
          );
        } else {
          elements.fretboardContainer.showFindNoteResult?.(
            detail.cx,
            detail.cy,
            false,
            findNote.targetPitchClass,
            wrongFade
          );
        }
        break;
      }

      case 'wrong-string': {
        recordFindNoteStatsError();
        elements.fretboardContainer.markFindNotePosition?.(
          detail.string,
          detail.fret,
          false,
          findNote.targetPitchClass,
          { fadeMs: FIND_NOTE_FADE_WRONG_MS }
        );
        break;
      }

      case 'correct':
        elements.fretboardContainer.markFindNotePosition?.(
          detail.string,
          detail.fret,
          true,
          findNote.targetPitchClass
        );
        if (
          shouldCollectFindNoteStats(getInputMode(), findNote.variant) &&
          findNote.variant === FIND_VARIANTS.ANY &&
          findNote.requireTargetString
        ) {
          void completeFindNoteStatsTask({ position: detail }).then(() => afterPartialStatsSaved());
        }
        break;

      case 'string-complete': {
        const completedPitchClass = result.completedPitchClass ?? findNote.targetPitchClass;
        const correctFade = { fadeMs: FIND_NOTE_FADE_CORRECT_MS };

        if (findNote.variant === FIND_VARIANTS.ALL) {
          elements.fretboardContainer.markFindNotePosition?.(
            detail.string,
            detail.fret,
            true,
            completedPitchClass
          );
          elements.fretboardContainer.fadeOutAllFindNoteMarks?.(FIND_NOTE_FADE_CORRECT_MS);
        } else if (findNote.requireTargetString) {
          elements.fretboardContainer.markFindNotePosition?.(
            detail.string,
            detail.fret,
            true,
            completedPitchClass
          );
          elements.fretboardContainer.fadeOutAllFindNoteMarks?.(FIND_NOTE_FADE_CORRECT_MS);
        } else {
          elements.fretboardContainer.showFindNoteResult?.(
            detail.cx,
            detail.cy,
            true,
            completedPitchClass,
            correctFade
          );
        }

        pushFindNoteHistory(findNote, completedPitchClass, FIND_NOTE_FADE_CORRECT_MS);
        findNote.foundPositions.clear();
        findNote.wrongPositions.clear();
        ui.startHistoryFade();
        finishSuccess(result);
        break;
      }
    }

    if (result.kind !== 'string-complete') {
      ui.refreshUI();
    }
  }

  return {
    applyResult,
  };
}


// ----- js/mode-find-note-handlers.js -----

/**
 * @module mode-find-note-handlers
 * @description Композиция UI и обработки попыток в режиме «Найди ноту».
 * @depends find-note, mode-find-note-ui, mode-find-note-attempts
 */

function createFindNoteHandlers({ elements, getFindNote, getInputMode, stats, syncLayout }) {
  const ui = createFindNoteUI({
    elements,
    getFindNote,
    getInputMode,
    stats,
    syncLayout,
  });

  const attempts = createFindNoteAttempts({
    elements,
    getFindNote,
    getInputMode,
    stats,
    ui,
  });

  return {
    isPaused: ui.isPaused,
    setPaused: ui.setPaused,
    stopHistoryFade: ui.stopHistoryFade,
    clearBoard: ui.clearBoard,
    applyResult: attempts.applyResult,
    updateInputUI: ui.updateInputUI,
    updateStringToggleUI: ui.updateStringToggleUI,
    updateVariantUI: ui.updateVariantUI,
    refreshUI: ui.refreshUI,
    restoreMarks: ui.restoreMarks,
    startNewRound: ui.startNewRound,
    evaluateAttempt: (detail) => evaluateAttempt(getFindNote(), detail),
  };
}

/**
 * @module mode-find-note
 * @description Режим «Найди ноту» — mouse-режим, пауза, статистика.
 * @depends config, find-note, mode-find-note-stats, mode-find-note-handlers
 */

function createFindNoteMode(deps) {
  const { elements, syncLayout } = deps;

  const findNote = createFindNoteState();
  let findInputMode = FIND_INPUT.MOUSE;
  let controlsBound = false;

  const stats = createFindNoteStatsController({
    elements,
    getFindNote: () => findNote,
    getInputMode: () => findInputMode,
  });

  const handlers = createFindNoteHandlers({
    elements,
    getFindNote: () => findNote,
    getInputMode: () => findInputMode,
    stats,
    syncLayout,
  });

  function setInputMode(mode) {
    if (mode === FIND_INPUT.LISTEN) return;
    if (findInputMode === mode) return;
    findInputMode = mode;
    handlers.updateInputUI(() => {
      findInputMode = FIND_INPUT.MOUSE;
    });
    void stats.syncStatsPanel();
    handlers.startNewRound({ resetHistory: true });
  }

  function setVariant(variant) {
    if (findNote.variant === variant) return;
    findNote.variant = variant;
    elements.fretboardContainer.dataset.findVariant = variant;
    if (variant === FIND_VARIANTS.ALL && findInputMode === FIND_INPUT.LISTEN) {
      findInputMode = FIND_INPUT.MOUSE;
    }
    handlers.updateVariantUI();
    handlers.updateInputUI(() => {
      findInputMode = FIND_INPUT.MOUSE;
    });
    void stats.syncStatsPanel();
    handlers.startNewRound({ resetHistory: true });
  }

  function bindControls() {
    elements.findNoteInputs?.forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        setInputMode(btn.dataset.findInput);
      });
    });

    elements.findNoteVariants?.forEach((btn) => {
      btn.addEventListener('click', () => {
        setVariant(btn.dataset.findVariant);
      });
    });

    elements.findNoteStringToggles?.forEach((btn) => {
      btn.addEventListener('click', () => {
        const stringIndex = Number(btn.dataset.stringIndex);
        if (!toggleStringEnabled(findNote, stringIndex)) return;
        handlers.updateStringToggleUI();
        handlers.startNewRound({ resetHistory: false });
      });
    });

    elements.findNotePauseBtn?.addEventListener('click', () => {
      handlers.setPaused(!handlers.isPaused());
    });

    elements.findNoteStatsResetBtn?.addEventListener('click', () => {
      void stats.resetStats().then(() => {
        handlers.refreshUI();
      });
    });

    elements.findNoteStatsHeatmapBtn?.addEventListener('click', () => {
      void stats.toggleStatsHeatmapPanel();
    });
  }

  return {
    getState: () => findNote,
    getInputMode: () => findInputMode,

    enter() {
      if (!controlsBound) {
        bindControls();
        controlsBound = true;
      }

      stats.initStatsLogControls();
      stats.onEnter();

      findNote.variant = FIND_VARIANTS.ANY;
      elements.findNotePanel.hidden = false;
      elements.fretboardContainer.dataset.findVariant = findNote.variant;
      findNote.requireTargetString = findNote.variant === FIND_VARIANTS.ANY;
      handlers.updateInputUI(() => {
        findInputMode = FIND_INPUT.MOUSE;
      });
      handlers.updateVariantUI();
      handlers.setPaused(false);
      handlers.startNewRound({ resetHistory: true });
    },

    leave() {
      handlers.stopHistoryFade();
      stats.onLeave();
      handlers.setPaused(false);
      findNote.requireTargetString = false;
      resetFindNoteHistory(findNote);
      startRound(findNote);
      handlers.clearBoard();
      elements.fretboardContainer.setFindNoteTargetString?.(null);
      elements.findNotePanel.hidden = true;
      document.body.classList.remove('find-note-paused');
    },

    onFretClick(detail) {
      if (findInputMode !== FIND_INPUT.MOUSE || handlers.isPaused()) return;
      const result = handlers.evaluateAttempt(detail);
      handlers.applyResult(result, detail);
    },

    onOutsideClick() {
      if (findNote.variant === FIND_VARIANTS.ANY) {
        elements.fretboardContainer.clearGuess?.();
      }
    },

    restoreMarks: handlers.restoreMarks,

    simulateClick(string, fret) {
      const detail = elements.fretboardContainer.getCellDetail?.(string, fret);
      if (!detail) return { error: 'no-cell', string, fret };
      const result = handlers.evaluateAttempt(detail);
      handlers.applyResult(result, detail);
      return { kind: result.kind, detail };
    },
  };
}

/**
 * @module app
 * @description Тонкий оркестратор: boot, mode bar, wiring.
 * @depends config, version, ui-strings, fretboard-view, note-chip, persistence, mode-fret-note, mode-note-frets, mode-find-note, test-hooks
 */

const state = {
  activeMode: MODES.FRET_NOTE,
};

const elements = {
  fretboardContainer: document.getElementById('fretboard-container'),
  selectionPanel: document.getElementById('selection-panel'),
  notePalettePanel: document.getElementById('note-palette-panel'),
  findNotePanel: document.getElementById('find-note-panel'),
  findNoteSessionNotice: document.getElementById('find-note-session-notice'),
  findNoteTarget: document.getElementById('find-note-target'),
  findNoteProgress: document.getElementById('find-note-progress'),
  findNotePauseBtn: document.getElementById('find-note-pause-btn'),
  findNoteInputs: document.querySelectorAll('.find-note-input'),
  findNoteVariants: document.querySelectorAll('.find-note-variant'),
  findNoteStringToggles: document.querySelectorAll('.find-note-string-toggle'),
  findNoteStatsResetBtn: document.getElementById('find-note-stats-reset-btn'),
  findNoteStatsPanel: document.getElementById('find-note-stats-panel'),
  findNoteStatsFretboard: document.getElementById('find-note-stats-fretboard'),
  findNoteDebugLogBtn: document.getElementById('find-note-debug-log-btn'),
  findNoteDebugLogPanel: document.getElementById('find-note-debug-log-panel'),
  findNoteStatsHeatmapBtn: document.getElementById('find-note-stats-heatmap-btn'),
  findNoteMicStatus: document.getElementById('find-note-mic-status'),
  findNoteRecalibrateBtn: document.getElementById('find-note-recalibrate-btn'),
  detailNote: document.getElementById('detail-note'),
  detailOctave: document.getElementById('detail-octave'),
  detailPosition: document.getElementById('detail-position'),
  staffContainer: document.getElementById('staff-container'),
  showAllNotesBtn: document.getElementById('show-all-notes-btn'),
  notePalette: document.getElementById('note-palette'),
  appVersion: document.getElementById('app-version'),
  modePills: document.querySelectorAll('.mode-pill'),
  fretboardSection: document.querySelector('.fretboard-section'),
};

let modes;

function renderFretboardView() {
  renderFretboard(GUITAR, elements.fretboardContainer, { interactive: true });
  elements.fretboardContainer.dataset.mode = state.activeMode;
  modes?.[MODES.FIND_NOTE]?.restoreMarks?.();
}

modes = {
  [MODES.FRET_NOTE]: createFretNoteMode({ elements }),
  [MODES.NOTE_FRETS]: createNoteFretsMode({ elements }),
  [MODES.FIND_NOTE]: createFindNoteMode({
    elements,
    renderFretboardView,
    syncLayout: () => syncNoteChipWidth(elements.fretboardSection),
  }),
};

let currentMode = modes[MODES.FRET_NOTE];

function applyMode(mode) {
  if (currentMode?.leave) {
    currentMode.leave();
  }

  state.activeMode = mode;
  currentMode = modes[mode] ?? modes[MODES.FRET_NOTE];

  elements.selectionPanel.hidden = true;
  elements.notePalettePanel.hidden = true;
  elements.findNotePanel.hidden = true;
  elements.fretboardContainer.dataset.mode = mode;
  elements.fretboardContainer.setFindNoteTargetString?.(null);

  elements.modePills.forEach((pill) => {
    const isActive = pill.dataset.mode === mode;
    pill.classList.toggle('active', isActive);
    pill.setAttribute('aria-pressed', String(isActive));
  });

  renderFretboardView();
  syncNoteChipWidth(elements.fretboardSection);
  currentMode.enter?.();
}

function setMode(mode) {
  applyMode(mode);
}

function initModeBar() {
  elements.modePills.forEach((pill) => {
    pill.addEventListener('click', () => {
      if (pill.disabled) return;
      setMode(pill.dataset.mode);
    });
  });

  applyMode(MODES.FRET_NOTE);
}

function showBootError(message) {
  if (!elements.fretboardContainer) return;
  elements.fretboardContainer.innerHTML = `
    <div class="boot-error">
      <p><strong>${UI.bootErrorTitle}</strong></p>
      <p>${message}</p>
    </div>
  `;
}

function initOutsideClick() {
  document.addEventListener('pointerdown', (event) => {
    if (elements.fretboardSection?.contains(event.target)) return;
    if (event.target.closest('.mode-bar')) return;
    currentMode.onOutsideClick?.();
  });
}

function initFretboardEvents() {
  elements.fretboardContainer.addEventListener('fret-click', (event) => {
    currentMode.onFretClick?.(event.detail);
  });
}

async function init() {
  if (!elements.fretboardContainer) {
    console.error('Missing #fretboard-container');
    return;
  }

  try {
    if (elements.appVersion) {
      elements.appVersion.textContent = `v${APP_VERSION}`;
    }

    if (elements.findNoteSessionNotice) {
      elements.findNoteSessionNotice.textContent = UI.findNoteSessionNotice;
    }

    await loadAppData();

    initModeBar();
    initOutsideClick();
    initFretboardEvents();

    window.addEventListener('resize', () => syncNoteChipWidth(elements.fretboardSection));

    elements.showAllNotesBtn?.addEventListener('click', () => {
      modes[MODES.NOTE_FRETS].toggleShowAll?.();
    });

    installTestHooks(state, { findNote: modes[MODES.FIND_NOTE] });
    window.__MMA_BOOT = { ok: true, version: APP_VERSION };
  } catch (err) {
    console.error(err);
    showBootError(err.message || 'Ошибка инициализации');
    window.__MMA_BOOT = { ok: false, error: String(err) };
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  void init();
}

})();
  </script>
