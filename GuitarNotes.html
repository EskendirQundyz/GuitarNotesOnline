/**
 * @module heatmap-scale
 * @description Score → colour/opacity for stats heatmap dots (prototype port).
 */

const heatmapScale = (() => {
  const PALETTES = {
    mint: {
      label: 'Mint',
      stops: [
        { t: 0.0, c: [38, 52, 66] },
        { t: 0.35, c: [24, 104, 112] },
        { t: 0.7, c: [46, 190, 148] },
        { t: 1.0, c: [166, 255, 214] },
      ],
    },
    amber: {
      label: 'Amber',
      stops: [
        { t: 0.0, c: [52, 44, 54] },
        { t: 0.35, c: [136, 62, 52] },
        { t: 0.7, c: [226, 140, 44] },
        { t: 1.0, c: [255, 228, 150] },
      ],
    },
    violet: {
      label: 'Violet',
      stops: [
        { t: 0.0, c: [40, 44, 74] },
        { t: 0.35, c: [78, 62, 152] },
        { t: 0.7, c: [146, 108, 234] },
        { t: 1.0, c: [222, 200, 255] },
      ],
    },
  };

  const EMPTY_COLOR = [168, 162, 154];

  function clamp01(value) {
    return Math.max(0, Math.min(1, value));
  }

  function norm(score) {
    return clamp01((Number(score) || 0) / 100);
  }

  function mix(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t),
    ];
  }

  function palette(key) {
    return PALETTES[key] || PALETTES.mint;
  }

  function colorAt(t, key) {
    const stops = palette(key).stops;
    const value = clamp01(t);

    for (let i = 1; i < stops.length; i += 1) {
      if (value > stops[i].t) continue;
      const prev = stops[i - 1];
      const span = stops[i].t - prev.t;
      const local = span > 0 ? (value - prev.t) / span : 0;
      return mix(prev.c, stops[i].c, local);
    }
    return stops[stops.length - 1].c;
  }

  function rgba(color, alpha) {
    return `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
  }

  function dotStyle(score, key = 'mint') {
    if (score === null || score === undefined) {
      return {
        empty: true,
        color: EMPTY_COLOR,
        fill: rgba(EMPTY_COLOR, 0.12),
        ring: rgba(EMPTY_COLOR, 0.42),
        glow: null,
        radiusScale: 0.62,
      };
    }

    const t = norm(score);
    const color = colorAt(t, key);

    return {
      empty: false,
      color,
      fill: rgba(color, 0.34 + 0.62 * t),
      ring: rgba(color, 0.5 + 0.45 * t),
      glow: rgba(color, 0.08 + 0.3 * t),
      radiusScale: 0.78 + 0.22 * t,
    };
  }

  function cssGradient(key = 'mint') {
    const stops = palette(key).stops.map(
      (stop) => `${rgba(stop.c, 1)} ${Math.round(stop.t * 100)}%`
    );
    return `linear-gradient(90deg, ${stops.join(', ')})`;
  }

  function paletteKeys() {
    return Object.keys(PALETTES);
  }

  function paletteLabel(key) {
    return palette(key).label;
  }

  function paletteAccentRgb(key) {
    return colorAt(0.7, key);
  }

  function paletteAccentRgba(key, alpha = 1) {
    const color = paletteAccentRgb(key);
    return rgba(color, alpha);
  }

  return {
    dotStyle,
    cssGradient,
    paletteKeys,
    paletteLabel,
    paletteAccentRgb,
    paletteAccentRgba,
  };
})();

function dotStyle(score, key = 'mint') {
  return heatmapScale.dotStyle(score, key);
}

function cssGradient(key = 'mint') {
  return heatmapScale.cssGradient(key);
}

function heatmapPaletteKeys() {
  return heatmapScale.paletteKeys();
}

function heatmapPaletteLabel(key) {
  return heatmapScale.paletteLabel(key);
}

function heatmapPaletteAccentRgba(key = 'mint', alpha = 1) {
  return heatmapScale.paletteAccentRgba(key, alpha);
}

/**
 * @module find-note-fret-range-view
 * @description Range strip and inactive-fret dimming on the fretboard.
 * @depends find-note-fret-range-layout, heatmap-scale
 */

function createFindNoteFretRangeView({ elements, getRange, getPalette, frets }) {
  const strip = elements.findNoteFretRange;
  const inactiveLeft = elements.findNoteFretRangeInactiveLeft;
  const activeZone = elements.findNoteFretRangeActive;
  const inactiveRight = elements.findNoteFretRangeInactiveRight;
  const handleMin = elements.findNoteFretRangeHandleMin;
  const handleMax = elements.findNoteFretRangeHandleMax;
  const dimLayer = elements.findNoteFretRangeDim;
  const dimLeft = elements.findNoteFretRangeDimLeft;
  const dimRight = elements.findNoteFretRangeDimRight;
  const fretboardContainer = elements.fretboardContainer;

  function boardElement() {
    return fretboardContainer?.closest('.board') ?? null;
  }

  function applyPalette() {
    const board = boardElement();
    if (!board) return;

    const palette = getPalette?.() ?? 'mint';
    board.style.setProperty('--fret-range-active-gradient', cssGradient(palette));
    board.style.setProperty('--fret-range-accent', heatmapPaletteAccentRgba(palette, 1));
    board.style.setProperty('--fret-range-accent-ring', heatmapPaletteAccentRgba(palette, 0.55));
    board.style.setProperty('--fret-range-accent-glow', heatmapPaletteAccentRgba(palette, 0.28));
    board.dataset.fretRangePalette = palette;
  }

  function setVisible(visible) {
    if (strip) strip.hidden = !visible;
    if (dimLayer) dimLayer.hidden = !visible;
    fretboardContainer?.classList.toggle('find-note-fret-range-active', visible);
    if (!visible) {
      const board = boardElement();
      board?.style.removeProperty('--fret-range-board-left');
      board?.style.removeProperty('--fret-range-board-width');
      board?.style.removeProperty('--fret-range-active-gradient');
      board?.style.removeProperty('--fret-range-accent');
      board?.style.removeProperty('--fret-range-accent-ring');
      board?.style.removeProperty('--fret-range-accent-glow');
      board?.removeAttribute('data-fret-range-palette');
    } else {
      applyPalette();
    }
  }

  function applyBoardBounds(band) {
    const board = boardElement();
    if (!board || !band.containerWidth) return;

    const leftPct = (band.boardLeft / band.containerWidth) * 100;
    const widthPct = (band.boardWidth / band.containerWidth) * 100;
    board.style.setProperty('--fret-range-board-left', `${leftPct}%`);
    board.style.setProperty('--fret-range-board-width', `${widthPct}%`);
  }

  function applyBand(band) {
    if (!band) return;

    applyPalette();
    applyBoardBounds(band);

    const toPercent = (value) => `${(value / band.boardWidth) * 100}%`;
    const hasDim = band.inactiveLeftWidth > 0 || band.inactiveRightWidth > 0;
    const hasInactiveLeft = band.inactiveLeftWidth > 0;
    const hasInactiveRight = band.inactiveRightWidth > 0;

    if (inactiveLeft) {
      inactiveLeft.style.width = toPercent(band.inactiveLeftWidth);
      inactiveLeft.hidden = !hasInactiveLeft;
    }
    if (activeZone) {
      activeZone.style.left = toPercent(band.relLeftX);
      activeZone.style.width = toPercent(band.activeWidth);
      activeZone.classList.toggle('find-note-fret-range-zone--flush-left', !hasInactiveLeft);
      activeZone.classList.toggle('find-note-fret-range-zone--flush-right', !hasInactiveRight);
    }
    if (inactiveRight) {
      inactiveRight.style.left = toPercent(band.relRightX);
      inactiveRight.style.width = toPercent(band.inactiveRightWidth);
      inactiveRight.hidden = !hasInactiveRight;
    }

    if (handleMin) handleMin.style.left = toPercent(band.relLeftX);
    if (handleMax) handleMax.style.left = toPercent(band.relRightX);

    if (dimLayer) dimLayer.hidden = strip?.hidden || !hasDim;

    if (dimLeft) {
      dimLeft.hidden = !hasInactiveLeft;
      dimLeft.style.width = toPercent(band.inactiveLeftWidth);
    }
    if (dimRight) {
      dimRight.hidden = !hasInactiveRight;
      dimRight.style.left = toPercent(band.relRightX);
      dimRight.style.width = toPercent(band.inactiveRightWidth);
    }
  }

  function syncHitCells(range) {
    const cells = fretboardContainer?.querySelectorAll('.fret-cell');
    if (!cells) return;

    cells.forEach((cell) => {
      const fret = Number(cell.dataset.fret);
      const inRange = fret >= range.minFret && fret <= range.maxFret;
      cell.style.pointerEvents = inRange ? '' : 'none';
      cell.setAttribute('aria-hidden', inRange ? 'false' : 'true');
    });
  }

  function render(hitLayout) {
    if (!hitLayout || !strip || strip.hidden) return;

    const band = fretSpanPx(hitLayout, getRange(), frets);
    applyBand(band);
    syncHitCells(band.range);
  }

  return {
    setVisible,
    render,
    syncPalette: applyPalette,
    syncHitCells: () => syncHitCells(getRange()),
  };
}

/**
 * @module guess-note-stats
 * @description Session log for Find note trainer.
 * @depends config, fretboard, find-note-difficulty, stats-session

const GUESS_NOTE_RECORDS_KEY = 'guessNoteRecords';
const guessNoteSession = createStatsSession();

const pauseGuessNoteStatsTask = guessNoteSession.pause;
const resumeGuessNoteStatsTask = guessNoteSession.resume;
const recordGuessNoteStatsError = guessNoteSession.recordError;
const discardGuessNoteStatsTask = guessNoteSession.discard;

/** Приводит записи Find note к форме `targets[]`, которую понимает общий scoring. */
function guessRecordsToStatsShape(records) {
  return (records ?? [])
    .filter(
      (record) =>
        typeof record?.position?.string === 'number' && typeof record?.position?.fret === 'number'
    )
    .map((record) => ({
      durationMs: record.durationMs,
      errors: record.errors,
      finishedAt: record.finishedAt,
      startedAt: record.startedAt,
      targets: [
        {
          positions: [{ string: record.position.string, fret: record.position.fret }],
        },
      ],
    }));
}

async function buildGuessNoteStatsContext() {
  const records = await fetchGuessNoteStatsRecords();
  return {
    positionScores: scorePositionsByDifficultyIndex(guessRecordsToStatsShape(records)),
  };
}

async function buildGuessNoteStatsHeatmap() {
  const context = await buildGuessNoteStatsContext();
  return context.positionScores;
}

function beginGuessNoteStatsTask(state) {
  if (!state?.targetPitchClass || state.targetString === null || state.targetFret === null) {
    guessNoteSession.discard();
    return;
  }

  guessNoteSession.start({
    startedAt: Date.now(),
    errors: 0,
    pitchClass: state.targetPitchClass,
    position: {
      string: state.targetString,
      stringNumber: getVisualStringNumber(GUITAR, state.targetString),
      fret: state.targetFret,
      note: getNoteAtFret(GUITAR, state.targetString, state.targetFret),
    },
  });
}

function createGuessNoteStatsRecord(task, finishedAt = Date.now()) {
  if (!task) return null;

  return {
    ...baseStatsRecordFields(task, finishedAt, guessNoteSession.nextRecordId(finishedAt)),
    pitchClass: task.pitchClass,
    position: task.position,
  };
}

const saveGuessNoteStatsRecord = (record) => pushStatsRecord(GUESS_NOTE_RECORDS_KEY, record);
const fetchGuessNoteStatsRecords = () => fetchStatsRecords(GUESS_NOTE_RECORDS_KEY);
const deleteGuessNoteStatsRecord = (recordId) => deleteStatsRecord(GUESS_NOTE_RECORDS_KEY, recordId);
const clearGuessNoteStatsRecords = () => clearStatsRecords(GUESS_NOTE_RECORDS_KEY);

async function completeGuessNoteStatsTask() {
  const record = createGuessNoteStatsRecord(guessNoteSession.take());
  if (!record) return null;

  await saveGuessNoteStatsRecord(record);
  return record;
}

function getActiveGuessNoteStatsTaskForTest() {
  const task = guessNoteSession.get();
  return task ? { ...task, position: { ...task.position } } : null;
}

/**
 * @module find-note-history
 * @description История отгаданных нот и fade-логика.
 * @depends config
 */

let historyIdSeq = 0;

function resetFindNoteHistory(state) {
  state.history = [];
}

function pushFindNoteHistory(state, pitchClass, fadeMs) {
  if (!pitchClass || !fadeMs) return;
  state.history.push({
    id: ++historyIdSeq,
    pitchClass,
    fadeMs,
    startTime: performance.now(),
  });
}

function computeHistoryCapacity(contentWidth, chipWidth, gap = FIND_NOTE_HISTORY_GAP_PX) {
  const maxWidth = contentWidth * 0.5 - chipWidth / 2 - 16;
  if (maxWidth <= 0) return 1;
  return Math.max(1, Math.floor((maxWidth + gap) / (chipWidth + gap)));
}

function getEffectiveHistoryFadeMs(item, { index, total, capacity }) {
  if (index < total - capacity) return 0;

  const overflow = Math.max(0, total - capacity);
  if (overflow === 0) return item.fadeMs;

  return Math.max(
    FIND_NOTE_HISTORY_MIN_FADE_MS,
    Math.round(item.fadeMs * (capacity / total))
  );
}

function pruneExpiredHistory(state, now = performance.now(), capacity = Infinity) {
  const total = state.history.length;
  state.history = state.history.filter((item, index) => {
    if (index < total - capacity) return false;
    const fadeMs = getEffectiveHistoryFadeMs(item, { index, total, capacity });
    return now - item.startTime < fadeMs;
  });
}

function getHistoryItemOpacity(
  item,
  now = performance.now(),
  { index = 0, total = 1, capacity = Infinity } = {}
) {
  if (index < total - capacity) return 0;

  const fadeMs = getEffectiveHistoryFadeMs(item, { index, total, capacity });
  const elapsed = now - item.startTime;
  if (elapsed >= fadeMs) return 0;
  return 1 - elapsed / fadeMs;
}

function hasActiveHistoryFade(state, now = performance.now(), capacity = Infinity) {
  const total = state.history.length;
  return state.history.some(
    (item, index) => getHistoryItemOpacity(item, now, { index, total, capacity }) > 0
  );
}

/**
 * @module find-note-evaluate
 * @description Оценка попыток и прогресс задания.
 * @depends config, note, fretboard, find-note-state
 */

function filterPositionsByFretRange(positions) {
  const minFret = getMinFretForFindNote();
  const maxFret = getMaxFretForFindNote();
  return positions.filter((position) => isFretInRange(position.fret, { minFret, maxFret }));
}

function targetsForCurrentTask(state) {
  const maxFret = getMaxFretForFindNote();

  if (state.requireTargetString) {
    const stringIndex = currentTargetString(state);
    if (stringIndex === null || !isStringEnabled(state, stringIndex)) return [];
    return filterPositionsByFretRange(
      findPitchClassPositionsOnString(
        GUITAR,
        stringIndex,
        state.targetPitchClass,
        maxFret
      )
    );
  }

  return filterPositionsByFretRange(
    filterPositionsByEnabledStrings(
      state,
      findPitchClassPositions(GUITAR, state.targetPitchClass, maxFret)
    )
  );
}

function remainingOnCurrentTask(state) {
  const targets = targetsForCurrentTask(state);
  const found = targets.filter((p) =>
    state.foundPositions.has(positionRoundKey(p.string, p.fret))
  ).length;
  return targets.length - found;
}

function isCurrentTaskPlayable(state) {
  if (!state.targetPitchClass || state.completed) return true;

  const targets = targetsForCurrentTask(state);
  if (targets.length === 0) return false;

  if (usesMultiPositionTask(state)) {
    return remainingOnCurrentTask(state) > 0;
  }

  return true;
}

function usesMultiPositionTask(state) {
  return (
    state.variant === FIND_VARIANTS.ALL ||
    (state.variant === FIND_VARIANTS.ANY && state.requireTargetString)
  );
}

function advanceListenTask(state) {
  state.foundPositions.clear();
  state.wrongPositions.clear();
  return { done: true, roundComplete: false, needsNextTarget: true };
}

function completeFreeformRound(state) {
  state.completed = true;
  return { done: true, roundComplete: true };
}

function evaluateAttempt(state, { string, fret, note }) {
  if (state.completed) {
    return { kind: 'ignored' };
  }

  if (fret < getMinFretForFindNote() || fret > getMaxFretForFindNote()) {
    return { kind: 'ignored' };
  }

  if (!isStringEnabled(state, string)) {
    return { kind: 'ignored' };
  }

  if (state.requireTargetString && string !== currentTargetString(state)) {
    return { kind: 'wrong-string', string, fret, note };
  }

  const isCorrect = getPitchClass(note) === state.targetPitchClass;

  if (usesMultiPositionTask(state)) {
    const key = positionRoundKey(string, fret);
    if (state.foundPositions.has(key)) {
      return { kind: 'ignored' };
    }

    if (isCorrect) {
      state.foundPositions.add(key);
      state.wrongPositions.delete(key);
      if (remainingOnCurrentTask(state) === 0) {
        const completedPitchClass = state.targetPitchClass;
        if (state.requireTargetString) {
          const result = advanceListenTask(state);
          return {
            kind: 'string-complete',
            ...result,
            string,
            fret,
            isCorrect: true,
            completedPitchClass,
          };
        }
        const result = completeFreeformRound(state);
        return {
          kind: 'string-complete',
          ...result,
          string,
          fret,
          isCorrect: true,
          completedPitchClass,
        };
      }
      return { kind: 'correct', string, fret, isCorrect: true };
    }

    state.wrongPositions.add(key);
    return { kind: 'wrong', string, fret, isCorrect: false };
  }

  if (isCorrect) {
    const completedPitchClass = state.targetPitchClass;
    if (state.requireTargetString) {
      const result = advanceListenTask(state);
      return {
        kind: 'string-complete',
        ...result,
        string,
        fret,
        isCorrect: true,
        completedPitchClass,
      };
    }
    const result = completeFreeformRound(state);
    return {
      kind: 'string-complete',
      ...result,
      string,
      fret,
      isCorrect: true,
      completedPitchClass,
    };
  }

  return { kind: 'wrong', string, fret, isCorrect: false };
}

/**
 * @module find-note-picking
 * @description Выбор целевой ноты и струны.
 * @depends config, fretboard, find-note-state, find-note-weighting
 */

function getAllPitchClassesOnGuitar(state) {
  const classes = new Set();
  const minFret = getMinFretForFindNote();
  const maxFret = getMaxFretForFindNote();
  for (const stringIndex of getEnabledStringIndices(state)) {
    for (let fret = minFret; fret <= maxFret; fret += 1) {
      classes.add(getPitchClass(getNoteAtFret(GUITAR, stringIndex, fret)));
    }
  }
  return [...classes];
}

function pickRandomItem(items, previous = null) {
  if (items.length === 0) return null;

  let next = previous;
  let guard = 0;
  while (items.length > 1 && next === previous && guard < 20) {
    next = items[Math.floor(Math.random() * items.length)];
    guard++;
  }
  if (!items.includes(next)) {
    next = items[Math.floor(Math.random() * items.length)];
  }

  return next;
}

function pickRandomPitchClass(available, previous) {
  return pickRandomItem(available, previous);
}

function pickStatsWeightedPitchClassForState(state, available, previous, getWeight, getPositions) {
  return pickStatsWeightedPitchClass(available, previous, getWeight, (pool) =>
    filterPitchClassesWithUnplayedPositions(pool, state.positionScores, getPositions)
  );
}

function getAllEnabledPositions(state) {
  const minFret = getMinFretForFindNote();
  const maxFret = getMaxFretForFindNote();
  const positions = [];
  for (const stringIndex of getEnabledStringIndices(state)) {
    for (let fret = minFret; fret <= maxFret; fret += 1) {
      positions.push({
        string: stringIndex,
        fret,
        note: getNoteAtFret(GUITAR, stringIndex, fret),
      });
    }
  }
  return positions;
}

function currentTaskKey(state) {
  if (state.targetStringIndex === null || !state.targetPitchClass) return null;
  return positionTaskKey(state.targetStringIndex, state.targetPitchClass);
}

function pickRandomPosition(positions, previousTaskKey) {
  let pool = positions;
  if (previousTaskKey) {
    const withoutPrevious = pool.filter(
      (position) =>
        positionTaskKey(position.string, getPitchClass(position.note)) !== previousTaskKey
    );
    if (withoutPrevious.length > 0) {
      pool = withoutPrevious;
    }
  }
  return pickRandomItem(pool, null);
}

function pickTrainerPosition({
  positions,
  positionScores,
  useStatsWeightedPicking,
  previousTaskKey = null,
}) {
  if (positions.length === 0) return null;

  return useStatsWeightedPicking && positionScores?.size
    ? pickStatsWeightedPosition(positions, positionScores, previousTaskKey)
    : pickRandomPosition(positions, previousTaskKey);
}

function pickRandomPositionTarget(state) {
  const positions = getAllEnabledPositions(state);
  if (positions.length === 0) return null;

  const picked = pickTrainerPosition({
    positions,
    positionScores: state.positionScores,
    useStatsWeightedPicking: state.useStatsWeightedPicking,
    previousTaskKey: currentTaskKey(state),
  });
  if (!picked) return null;

  state.targetStringIndex = picked.string;
  state.targetPitchClass = getPitchClass(picked.note);
  return state.targetPitchClass;
}

function pickTargetForFretboard(state) {
  const available = getAllPitchClassesOnGuitar(state);
  if (available.length === 0) return null;

  const maxFret = getMaxFretForFindNote();
  const next = state.useStatsWeightedPicking
    ? pickStatsWeightedPitchClassForState(
        state,
        available,
        state.targetPitchClass,
        (pitchClass) =>
          pitchClassWeaknessOnFretboard(
            pitchClass,
            state.positionScores,
            maxFret,
            state.enabledStrings
          ),
        (pitchClass) =>
          filterPositionsByEnabledStrings(
            state,
            findPitchClassPositions(GUITAR, pitchClass, maxFret).filter(
              (position) => position.fret >= getMinFretForFindNote()
            )
          )
      )
    : pickRandomPitchClass(available, state.targetPitchClass);
  if (!next) return null;

  state.targetPitchClass = next;
  return next;
}

function pickTarget(state) {
  if (state.requireTargetString) {
    return pickRandomPositionTarget(state);
  }
  return pickTargetForFretboard(state);
}

function startRound(state) {
  clearRoundState(state);
  pickTarget(state);
}

/**
 * @module guess-note
 * @description Find note trainer: random fret position, guess pitch class.
 * @depends config, fretboard, note, find-note-state, find-note-picking, find-note-weighting
 */

function createGuessNoteState() {
  return {
    targetString: null,
    targetFret: null,
    targetPitchClass: null,
    completed: false,
    enabledStrings: createDefaultEnabledStrings(),
    positionScores: null,
    useStatsWeightedPicking: false,
  };
}

function listGuessNotePositions(state) {
  const minFret = getMinFretForFindNote();
  const maxFret = getMaxFretForFindNote();
  const positions = [];

  for (let string = 0; string < GUITAR.strings; string += 1) {
    if (state && !isStringEnabled(state, string)) continue;
    for (let fret = minFret; fret <= maxFret; fret += 1) {
      positions.push({ string, fret });
    }
  }

  return positions;
}

function getAllGuessNotePositions(state) {
  return listGuessNotePositions(state).map(({ string, fret }) => ({
    string,
    fret,
    note: getNoteAtFret(GUITAR, string, fret),
  }));
}

function previousGuessNoteTaskKey(previous) {
  if (!previous || previous.string === null || previous.fret === null) return null;
  return positionTaskKey(
    previous.string,
    getPitchClass(getNoteAtFret(GUITAR, previous.string, previous.fret))
  );
}

function isGuessNoteTargetPlayable(state) {
  if (state.completed) return true;
  if (state.targetString === null || state.targetFret === null) return false;
  if (!isStringEnabled(state, state.targetString)) return false;

  const minFret = getMinFretForFindNote();
  const maxFret = getMaxFretForFindNote();
  return state.targetFret >= minFret && state.targetFret <= maxFret;
}

function pickGuessNoteTarget(state, previous = null) {
  const positions = getAllGuessNotePositions(state);
  if (positions.length === 0) return false;

  const picked = pickTrainerPosition({
    positions,
    positionScores: state.positionScores,
    useStatsWeightedPicking: state.useStatsWeightedPicking,
    previousTaskKey: previousGuessNoteTaskKey(previous),
  });
  if (!picked) return false;

  state.targetString = picked.string;
  state.targetFret = picked.fret;
  state.targetPitchClass = getPitchClass(picked.note);
  state.completed = false;
  return true;
}

function evaluateGuessNoteAttempt(state, pitchClass) {
  if (state.completed || !state.targetPitchClass) {
    return { kind: 'ignored' };
  }

  if (pitchClass === state.targetPitchClass) {
    state.completed = true;
    return { kind: 'correct', pitchClass };
  }

  return { kind: 'wrong', pitchClass };
}

/**
 * @module find-note-stats
 * @description Сбор и агрегация статистики «Найди ноту» (in-memory, на время сессии).
 * @depends config, fretboard, find-note, find-note-difficulty, stats-session
 */

const FIND_NOTE_RECORDS_KEY = 'records';
const findNoteSession = createStatsSession();

const pauseFindNoteStatsTask = findNoteSession.pause;
const resumeFindNoteStatsTask = findNoteSession.resume;
const recordFindNoteStatsError = findNoteSession.recordError;
const discardFindNoteStatsTask = findNoteSession.discard;

function shouldCollectFindNoteStats(inputMode, variant) {
  return variant === 'any' || (inputMode === 'mouse' && variant === 'all');
}

function matchesFindNoteStatsMode(record, inputMode, variant) {
  return record?.inputMode === inputMode && record?.variant === variant;
}

function filterRecordsForMode(records, { inputMode, variant } = {}) {
  const filterByMode = Boolean(inputMode && variant);
  return (records ?? []).filter((record) => {
    if (!shouldCollectFindNoteStats(record.inputMode, record.variant)) return false;
    if (filterByMode && !matchesFindNoteStatsMode(record, inputMode, variant)) return false;
    return collectRecordPositions(record).length > 0;
  });
}

function aggregateFindNoteStatsByPosition(records, { inputMode, variant } = {}) {
  const filtered = filterRecordsForMode(records, { inputMode, variant });
  const histories = buildPositionAttemptHistories(filtered);
  const map = new Map();

  for (const [key, attempts] of histories) {
    const durationMs = attempts.reduce(
      (sum, attempt) => sum + (attempt.durationSeconds ?? 0) * 1000,
      0
    );
    const errors = attempts.reduce((sum, attempt) => sum + (attempt.errors ?? 0), 0);
    map.set(key, {
      attempts: attempts.length,
      durationMs,
      errors,
    });
  }

  return map;
}

function scoreFindNoteStatsPositions(records, { inputMode, variant, recentWindow } = {}) {
  const filtered = filterRecordsForMode(records, { inputMode, variant });
  return scorePositionsByDifficultyIndex(filtered, { recentWindow });
}

async function buildFindNoteStatsContext({ inputMode, variant } = {}) {
  const records = await fetchFindNoteStatsRecords();
  return {
    positionScores: scoreFindNoteStatsPositions(records, { inputMode, variant }),
  };
}

async function buildFindNoteStatsHeatmap({ inputMode, variant } = {}) {
  const context = await buildFindNoteStatsContext({ inputMode, variant });
  return context.positionScores;
}

function mapPosition(position) {
  return {
    string: position.string,
    stringNumber: getVisualStringNumber(GUITAR, position.string),
    fret: position.fret,
    note: position.note,
  };
}

function remainingTargetPositions(state) {
  return targetsForCurrentTask(state).filter(
    (position) => !state.foundPositions?.has(positionRoundKey(position.string, position.fret))
  );
}

function buildFindNoteStatsTargetsSnapshot(state) {
  if (!state?.targetPitchClass) return [];

  const positions = remainingTargetPositions(state);
  if (positions.length === 0) return [];

  return [
    {
      pitchClass: state.targetPitchClass,
      stringIndex: state.requireTargetString ? state.targetStringIndex : null,
      stringNumber:
        state.requireTargetString && state.targetStringIndex !== null
          ? getVisualStringNumber(GUITAR, state.targetStringIndex)
          : null,
      positions: positions.map(mapPosition),
    },
  ];
}

function beginFindNoteStatsTask(state, { inputMode, variant }) {
  if (!shouldCollectFindNoteStats(inputMode, variant) || !state?.targetPitchClass) {
    findNoteSession.discard();
    return;
  }

  const targets = buildFindNoteStatsTargetsSnapshot(state);
  if (targets.length === 0 || targets[0].positions.length === 0) {
    findNoteSession.discard();
    return;
  }

  findNoteSession.start({
    startedAt: Date.now(),
    errors: 0,
    inputMode,
    variant,
    targets,
  });
}

function createFindNoteStatsRecord(task, finishedAt = Date.now()) {
  if (!task) return null;

  return {
    ...baseStatsRecordFields(task, finishedAt, findNoteSession.nextRecordId(finishedAt)),
    inputMode: task.inputMode,
    variant: task.variant,
    targets: task.targets,
  };
}

const saveFindNoteStatsRecord = (record) => pushStatsRecord(FIND_NOTE_RECORDS_KEY, record);
const fetchFindNoteStatsRecords = () => fetchStatsRecords(FIND_NOTE_RECORDS_KEY);
const deleteFindNoteStatsRecord = (recordId) => deleteStatsRecord(FIND_NOTE_RECORDS_KEY, recordId);
const clearFindNoteStatsRecords = () => clearStatsRecords(FIND_NOTE_RECORDS_KEY);

async function completeFindNoteStatsTask({ position } = {}) {
  const task = findNoteSession.take();
  if (!task) return null;

  let targets = task.targets;
  if (position) {
    const base = task.targets[0] ?? {};
    targets = [
      {
        pitchClass: base.pitchClass,
        stringIndex: base.stringIndex ?? position.string,
        stringNumber: base.stringNumber ?? getVisualStringNumber(GUITAR, position.string),
        positions: [mapPosition(position)],
      },
    ];
  }

  const record = createFindNoteStatsRecord({ ...task, targets });
  if (!record) return null;

  await saveFindNoteStatsRecord(record);
  return record;
}

function getActiveFindNoteStatsTaskForTest() {
  const task = findNoteSession.get();
  return task ? { ...task, targets: structuredClone(task.targets) } : null;
}

/**
 * @module format-utils
 * @description Shared formatting helpers for log tables and panels.
 * @depends ui-strings
 */

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function formatDateTime(iso) {
  if (!iso) return '—';
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return iso;
  return date.toLocaleString('en-US', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
  });
}

function formatDuration(durationMs) {
  if (typeof durationMs !== 'number' || durationMs < 0) return '—';
  if (durationMs < 1000) return UI.debugLogDurationMs(durationMs);
  return UI.debugLogDurationSec((durationMs / 1000).toFixed(1));
}

/** `E · str. 1, fret 0` для одной позиции на грифе. */
function formatPositionLabel(pitchClass, position) {
  if (!position) return pitchClass ?? '—';

  const fretLabel = position.fret === 0 ? '0' : String(position.fret);
  const stringLabel = position.stringNumber ?? position.string + 1;
  return UI.debugLogPosition(pitchClass, stringLabel, fretLabel);
}

/**
 * v1.13.0: opening any trainer's log panel is the one deliberate exception
 * to the fixed no-scroll shell — it grows the page and enables normal page
 * scroll via `body.log-panel-open`. Both Find Fret and Find note panels are
 * instances created below, so the "any panel open" set lives at module
 * scope (each instance registers under its own `boundDatasetKey`).
 */
const openLogPanelIds = new Set();

function syncScrollableBody() {
  document.body.classList.toggle('log-panel-open', openLogPanelIds.size > 0);
}

/**
 * @param {object} options
 * @param {string} options.boundDatasetKey уникальный dataset-флаг, чтобы не навесить listener дважды
 * @param {Function} options.fetchRecords async (filter) => records
 * @param {Function} options.deleteRecord async (id) => { deleted }
 * @param {Function} options.buildTableHtml (records) => html
 */
function createTrainerLogPanel({
  boundDatasetKey,
  fetchRecords,
  deleteRecord,
  buildTableHtml,
}) {
  let panelOpen = false;
  let contentEl = null;

  function ensureStructure(logPanel) {
    if (!logPanel) return;

    const existing = logPanel.querySelector('.find-note-debug-log-content');
    if (existing) {
      contentEl = existing;
      return;
    }

    logPanel.innerHTML = `<div class="find-note-debug-log-content"></div>`;
    contentEl = logPanel.querySelector('.find-note-debug-log-content');
  }

  function isOpen() {
    return panelOpen;
  }

  function setPanelOpen(next) {
    panelOpen = next;
    if (next) {
      openLogPanelIds.add(boundDatasetKey);
    } else {
      openLogPanelIds.delete(boundDatasetKey);
    }
    syncScrollableBody();
  }

  function close() {
    setPanelOpen(false);
  }

  function updateControls({ logButton, logPanel, panelVisible, toolsVisible = true }) {
    if (!logButton) return;

    logButton.hidden = !(panelVisible && toolsVisible);
    logButton.classList.toggle('active', panelOpen);

    if (!logPanel) return;

    logPanel.hidden = !(panelVisible && toolsVisible && panelOpen);
  }

  async function refresh(logPanel, filter = {}) {
    if (!logPanel) return;

    ensureStructure(logPanel);
    contentEl.innerHTML = `<p class="find-note-debug-log-empty">${UI.debugLogLoading}</p>`;

    const records = await fetchRecords(filter);
    contentEl.innerHTML = buildTableHtml(records);
  }

  async function toggle({ logButton, logPanel, panelVisible, toolsVisible = true, filter = {} }) {
    if (!panelVisible || !toolsVisible) return false;

    setPanelOpen(!panelOpen);
    updateControls({ logButton, logPanel, panelVisible, toolsVisible });

    if (panelOpen) {
      await refresh(logPanel, filter);
    }

    return panelOpen;
  }

  async function handleDelete(recordId, logPanel, filter, onRecordDeleted) {
    if (!recordId) return;
    if (!window.confirm(UI.statsDeleteRecordConfirm)) return;

    const result = await deleteRecord(recordId);
    if (!result.deleted) return;

    await refresh(logPanel, filter);
    await onRecordDeleted?.();
  }

  /**
   * @param {Function} [options.isPanelVisible] видна ли панель режима
   * @param {Function} [options.shouldShowControls] доп. условие показа кнопки (Find Fret)
   * @param {Function} [options.getFilter] фильтр записей (Find Fret: режим ввода + вариант)
   */
  function init({ logButton, logPanel, isPanelVisible, shouldShowControls, getFilter, onRecordDeleted }) {
    ensureStructure(logPanel);

    const toolsVisible = () => shouldShowControls?.() ?? isPanelVisible();
    const filter = () => getFilter?.() ?? {};

    if (logPanel && !logPanel.dataset[boundDatasetKey]) {
      logPanel.dataset[boundDatasetKey] = 'true';

      logPanel.addEventListener('click', (event) => {
        const deleteBtn = event.target.closest('.find-note-debug-log-delete-btn');
        if (!deleteBtn || !contentEl?.contains(deleteBtn)) return;

        event.preventDefault();
        event.stopPropagation();

        const row = deleteBtn.closest('.find-note-debug-log-row');
        if (!row) return;

        void handleDelete(row.dataset.recordId, logPanel, filter(), onRecordDeleted);
      });
    }

    logButton?.addEventListener('click', () => {
      void toggle({
        logButton,
        logPanel,
        panelVisible: isPanelVisible(),
        toolsVisible: toolsVisible(),
        filter: filter(),
      });
    });

    return {
      sync: () =>
        updateControls({
          logButton,
          logPanel,
          panelVisible: isPanelVisible(),
          toolsVisible: toolsVisible(),
        }),
      refresh: () => refresh(logPanel, filter()),
    };
  }

  return { isOpen, close, init };
}

/**
 * @module debug-log
 * @description Log tables for Find Fret and Find note trainers (columns + wiring only).
 * @depends trainer-log-panel, format-utils, find-note-stats, guess-note-stats, ui-strings
 */

const INPUT_MODE_LABELS = {
  mouse: UI.debugLogInputMouse,
  listen: UI.debugLogInputListen,
};

const VARIANT_LABELS = {
  any: UI.debugLogVariantAny,
  all: UI.debugLogVariantAll,
};

function formatMode(inputMode, variant) {
  const inputLabel = INPUT_MODE_LABELS[inputMode] ?? inputMode ?? '—';
  const variantLabel = VARIANT_LABELS[variant] ?? variant ?? '—';
  return `${inputLabel} · ${variantLabel}`;
}

function formatTargets(targets) {
  if (!Array.isArray(targets) || targets.length === 0) return '—';

  return targets
    .map((target) => {
      const pitchClass = target.pitchClass ?? '—';
      const positions = Array.isArray(target.positions) ? target.positions : [];
      if (positions.length === 0) return pitchClass;

      return positions
        .map((position) => formatPositionLabel(pitchClass, position))
        .join('; ');
    })
    .join(' | ');
}

function formatGuessNoteRecord(record) {
  if (!record?.pitchClass) return '—';
  return formatPositionLabel(record.pitchClass, record.position);
}

function cell(value) {
  return `<td>${escapeHtml(value)}</td>`;
}

function buildFindNoteTableHtml(records) {
  if (!records.length) return buildLogEmptyHtml();

  const rowsHtml = records
    .map((record) =>
      buildLogRowHtml({
        recordId: record.id,
        cellsHtml: [
          cell(formatDateTime(record.finishedAt || record.startedAt)),
          cell(formatTargets(record.targets)),
          cell(String(record.errors ?? 0)),
          cell(formatDuration(record.durationMs)),
          cell(formatMode(record.inputMode, record.variant)),
        ].join(''),
      })
    )
    .join('');

  return buildLogTableHtml({
    headHtml: `
          <th>${UI.debugLogWhen}</th>
          <th>${UI.debugLogNoteFrets}</th>
          <th>${UI.debugLogErrors}</th>
          <th>${UI.debugLogDuration}</th>
          <th>${UI.debugLogMode}</th>`,
    rowsHtml,
  });
}

function buildGuessNoteTableHtml(records) {
  if (!records.length) return buildLogEmptyHtml();

  const rowsHtml = records
    .map((record) =>
      buildLogRowHtml({
        recordId: record.id,
        cellsHtml: [
          cell(formatDateTime(record.finishedAt || record.startedAt)),
          cell(formatGuessNoteRecord(record)),
          cell(String(record.errors ?? 0)),
          cell(formatDuration(record.durationMs)),
        ].join(''),
      })
    )
    .join('');

  return buildLogTableHtml({
    headHtml: `
          <th>${UI.debugLogWhen}</th>
          <th>${UI.debugLogNoteFrets}</th>
          <th>${UI.debugLogErrors}</th>
          <th>${UI.debugLogDuration}</th>`,
    rowsHtml,
  });
}

const findNotePanel = createTrainerLogPanel({
  boundDatasetKey: 'logBound',
  deleteRecord: deleteFindNoteStatsRecord,

    const records = await fetchFindNoteStatsRecords();
    if (!inputMode || !variant || !shouldCollectFindNoteStats(inputMode, variant)) {
      return records;
    }
    return records.filter((record) => matchesFindNoteStatsMode(record, inputMode, variant));
  },
});

const guessNotePanel = createTrainerLogPanel({
  boundDatasetKey: 'guessNoteLogBound',
  deleteRecord: deleteGuessNoteStatsRecord,
  buildTableHtml: buildGuessNoteTableHtml,
  fetchRecords: () => fetchGuessNoteStatsRecords(),

const isStatsLogPanelOpen = findNotePanel.isOpen;
const closeStatsLogPanel = findNotePanel.close;

function initStatsLog({

    shouldShowControls,
    getFilter: getStatsModeFilter,
    onRecordDeleted,
  });
}

const isGuessNoteLogPanelOpen = guessNotePanel.isOpen;
const closeGuessNoteLogPanel = guessNotePanel.close;

function initGuessNoteLog({ logButton, logPanel, isGuessNotePanelVisible, onRecordDeleted }) {
  return guessNotePanel.init({
    logButton,
    logPanel,
    isPanelVisible: isGuessNotePanelVisible,
    onRecordDeleted,
  });
}

function pitchClassButtonLabel(pitchClass) {
  const noteName = pitchClass.replace('#', '');
  const accidental = pitchClass.includes('#') ? '♯' : '';
  return `${pitchClass} (${getNoteNameEn(noteName, accidental)})`;
}

function buildNoteChipHtml(pitchClass, { opacity = 1, interactive = false } = {}) {
  if (!pitchClass) return '';

  const color = getNoteRainbowColor(pitchClass);
  const textColor = getContrastTextColor(color);
  const textShadow =
    textColor === '#ffffff'
      ? '0 1px 2px rgba(0, 0, 0, 0.35)'
      : '0 1px 0 rgba(255, 255, 255, 0.55)';
  const opacityStyle = opacity < 1 ? ` opacity: ${opacity};` : '';
  const tag = interactive ? 'button' : 'span';
  const typeAttr = interactive ? ' type="button"' : '';
  const className = interactive ? 'note-palette-btn' : 'note-palette-btn note-chip';
  const extraAttrs = interactive
    ? ` data-pitch="${pitchClass}" aria-pressed="false"`
    : '';

  return `
    <${tag}${typeAttr}
      class="${className}"
      ${extraAttrs}
      style="--note-color: ${color}; background-color: ${color}; color: ${textColor}; text-shadow: ${textShadow};${opacityStyle}"
    >
      ${pitchClassButtonLabel(pitchClass)}
    </${tag}>
  `;
}

function buildNoteChipGridHtml(pitchClass) {
  return `<div class="note-chip-grid">${buildNoteChipHtml(pitchClass)}</div>`;
}

function measureNoteChipContentWidth() {
  if (typeof document === 'undefined') return 72;

  const probe = document.createElement('button');
  probe.type = 'button';
  probe.className = 'note-palette-btn';
  probe.style.cssText =
    'position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;width:auto;min-width:0;';
  document.body.appendChild(probe);

  let max = 0;
  for (const pitchClass of PITCH_CLASSES) {
    probe.textContent = pitchClassButtonLabel(pitchClass);
    max = Math.max(max, probe.getBoundingClientRect().width);
  }

  probe.remove();
  return Math.ceil(max);
}

function syncNoteChipWidth(_section = document.querySelector('.fretboard-section')) {
  if (typeof document === 'undefined') return;

  document.documentElement.style.setProperty(
    '--note-chip-width',
    `${measureNoteChipContentWidth()}px`
  );
}

/**
 * @module find-note-view
 * @description DOM/HTML для панели задачи «Найди ноту».
 * @depends find-note, note-chip, config
 */

function estimateHistoryCapacity({
  contentWidth,
  chipWidth,
  gap = FIND_NOTE_HISTORY_GAP_PX,
} = {}) {
  let resolvedChipWidth = chipWidth;
  let resolvedContentWidth = contentWidth;

  if (resolvedContentWidth == null || resolvedChipWidth == null) {
    if (typeof document === 'undefined') return Infinity;

    resolvedChipWidth =
      resolvedChipWidth ??
      (parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue('--note-chip-width')
      ) || 72);

    const section = document.querySelector('.fretboard-section');
    if (!section) return Infinity;

    const sectionStyle = getComputedStyle(section);
    const sectionPadX =
      parseFloat(sectionStyle.paddingLeft) + parseFloat(sectionStyle.paddingRight);
    resolvedContentWidth = section.clientWidth - sectionPadX;
  }

  return computeHistoryCapacity(resolvedContentWidth, resolvedChipWidth, gap);
}

function buildTaskPanelHtml(state, now = performance.now(), { capacity = Infinity } = {}) {
  const total = state.history.length;
  const historyHtml = state.history
    .map((item, index) => {
      const opacity = getHistoryItemOpacity(item, now, { index, total, capacity });
      if (opacity <= 0) return '';
      return `
        <div class="note-chip-grid find-note-history-item">
          ${buildNoteChipHtml(item.pitchClass, { opacity })}
        </div>
      `;
    })
    .join('');

  const currentHtml =
    !state.completed && state.targetPitchClass
      ? (() => {
          let remainingLabel = '';
          if (state.variant === FIND_VARIANTS.ALL) {
            const remaining = remainingOnCurrentTask(state);
            if (remaining > 0) {
              remainingLabel = `<div class="find-note-remaining">${UI.findNoteRemainingLeft(remaining)}</div>`;
            }
          }

          return `
        <div class="find-note-current-wrap">
          <div class="note-chip-grid find-note-current">
            ${buildNoteChipHtml(state.targetPitchClass)}
          </div>
          ${remainingLabel}
        </div>
      `;
        })()
      : '';

  return `
    <div class="find-note-task">
      <div class="find-note-task-row">
        <div class="find-note-history" aria-label="${UI.guessHistoryAriaLabel}">${historyHtml}</div>
        ${currentHtml}
      </div>
    </div>
  `;
}

/**
 * @module fretboard-canvas-geometry
 * @description Геометрия canvas-грифа в миллиметрах (прототип fretboard).
 * @depends config
 */

/** D'Addario Pro-Arte EJ45 — диаметры мм, row 0 = 1-я струна сверху. */
const EJ45_DIAMETERS_MM = [0.7112, 0.818, 1.0236, 0.7366, 0.889, 1.0922];

const CANVAS_PAD = { left: 13, right: 10, top: 12, bottom: 12 };
const BOARD_TAIL_MM = 12;
const BOARD_HEAD_MM = 18;
const NUT_DEPTH_MM = 6;
const TAP_MARK_RADIUS_MM = 3.52;

function tapMarkRadiusPx(pxPerMm) {
  return TAP_MARK_RADIUS_MM * pxPerMm;
}

function scaleLengthMm(guitar) {
  return guitar.scaleUnit === 'mm' ? guitar.scaleLength : guitar.scaleLength * 25.4;
}

function spreadNutMm(guitar) {
  if (guitar.stringSpacingNutMm != null) return guitar.stringSpacingNutMm;
  const inset = guitar.stringEdgeInsetMm ?? 4;
  return guitar.nutWidth - inset * 2;
}

/** @param {import('./config.js').GUITAR} guitar */
function createCanvasGeom(guitar) {
  const scaleMm = scaleLengthMm(guitar);
  const spreadNut = spreadNutMm(guitar);
  const spreadBridge = guitar.stringSpacingBridgeMm ?? 56;

  const SPEC = {
    scaleMm,
    frets: guitar.frets,
    nutWidthMm: guitar.nutWidth,
    width12Mm: guitar.fretboardWidth12Mm ?? 62,
    spreadNutMm: spreadNut,
    spreadBridgeMm: spreadBridge,
    tailMm: BOARD_TAIL_MM,
    headMm: BOARD_HEAD_MM,
    nutDepthMm: NUT_DEPTH_MM,
    strings: Array.from({ length: guitar.strings }, (_, row) => {
      const tuningIdx = guitar.strings - 1 - row;
      return {
        num: row + 1,
        note: guitar.stringLabels[tuningIdx],
        dMm: EJ45_DIAMETERS_MM[row],
        wound: row >= 3,
      };
    }),
    inlaySingle: [3, 5, 7, 9, 15, 17, 19].filter((n) => n <= guitar.frets),
    inlayDouble: 12,
  };

  function fretMm(n) {
    if (n <= 0) return 0;
    return SPEC.scaleMm * (1 - 2 ** (-n / 12));
  }

  function fretCenterMm(n) {
    return (fretMm(n) + fretMm(n - 1)) / 2;
  }

  function boardStartMm() {
    return -SPEC.headMm;
  }

  function boardLenMm() {
    return fretMm(SPEC.frets) + SPEC.tailMm;
  }

  function boardWidthMm(dMm) {
    const t = dMm / fretMm(12);
    return SPEC.nutWidthMm + t * (SPEC.width12Mm - SPEC.nutWidthMm);
  }

  function spreadMm(dMm) {
    const t = Math.min(1, dMm / SPEC.scaleMm);
    return SPEC.spreadNutMm + t * (SPEC.spreadBridgeMm - SPEC.spreadNutMm);
  }

  function stringOffsetMm(row, dMm) {
    const spread = spreadMm(dMm);
    return -spread / 2 + (row * spread) / (SPEC.strings.length - 1);
  }

  function layout(view) {
    const k = view.pxPerMm;

    function x(dMm) {
      return view.nutX + dMm * k;
    }

    return {
      pxPerMm: k,
      x,
      fretX(n) {
        return x(fretMm(n));
      },
      fretCenterX(n) {
        return x(fretCenterMm(n));
      },
      edgeY(dMm, side) {
        return view.axisY + (side * boardWidthMm(dMm) * k) / 2;
      },
      stringY(row, dMm) {
        return view.axisY + stringOffsetMm(row, dMm) * k;
      },
      startMm: boardStartMm(),
      startX: x(boardStartMm()),
      endMm: boardLenMm(),
      endX: x(boardLenMm()),
    };
  }

  return {
    SPEC,
    fretMm,
    fretCenterMm,
    boardStartMm,
    boardLenMm,
    boardWidthMm,
    spreadMm,
    stringOffsetMm,
    layout,
  };
}

/** @param {import('./config.js').GUITAR} guitar */
function canvasMetrics(guitar, cssWidth) {
  const geom = createCanvasGeom(guitar);
  const startMm = geom.boardStartMm();
  const endMm = geom.boardLenMm();
  const maxWmm = geom.boardWidthMm(endMm);
  const totalWmm = CANVAS_PAD.left + (endMm - startMm) + CANVAS_PAD.right;
  const totalHmm = CANVAS_PAD.top + maxWmm + CANVAS_PAD.bottom;
  const pxPerMm = cssWidth / totalWmm;

  return {
    pxPerMm,
    nutX: (CANVAS_PAD.left - startMm) * pxPerMm,
    axisY: (CANVAS_PAD.top + maxWmm / 2) * pxPerMm,
    cssWidth,
    cssHeight: totalHmm * pxPerMm,
  };
}

/** Insets between the canvas box and the drawn board edges (px). */
function fretboardContentInsetsPx(guitar, cssWidth) {
  const geom = createCanvasGeom(guitar);
  const view = canvasMetrics(guitar, cssWidth);
  const L = geom.layout(view);

  return {
    right: Math.max(0, view.cssWidth - L.endX),
    left: Math.max(0, L.startX),
  };
}

/** Координаты для hit-слоя поверх canvas. */
function buildCanvasHitLayout(guitar, L, geom) {
  const stringCount = guitar.strings;

  function dMmAt(x) {
    return (x - L.x(0)) / L.pxPerMm;
  }

  function stringYAt(stringIndex, x) {
    return L.stringY(stringIndex, dMmAt(x));
  }

  function stringSpacingAt(x) {
    return (geom.spreadMm(dMmAt(x)) * L.pxPerMm) / (stringCount - 1);
  }

  function fretPositionPx(fret) {
    return geom.fretMm(fret) * L.pxPerMm;
  }

  function cellCenterAt(stringIndex, fret) {
    const dMm = fret === 0 ? -geom.SPEC.nutDepthMm / 2 : geom.fretCenterMm(fret);
    return {
      cx: L.x(dMm),
      cy: L.stringY(stringIndex, dMm),
    };
  }

  return {
    paddingLeft: L.x(0),
    nutX: L.x(0),
    startX: L.startX,
    endX: L.endX,
    stringYAt,
    stringSpacingAt,
    fretPositionPx,
    cellCenterAt,
    tapDotR: tapMarkRadiusPx(L.pxPerMm),
    fretCount: guitar.frets,
    stringCount,
    cssWidth: L.pxPerMm * (geom.boardLenMm() - geom.boardStartMm() + CANVAS_PAD.left + CANVAS_PAD.right),
    cssHeight: null,
  };
}

/**
 * @module fretboard-canvas-hover
 * @description Состояние подсветки струны: целевая строка и сглаженная анимация.
 * @depends none
 */

const EASE = 0.22;
const SNAP = 0.002;

function createStringHoverState(stringCount) {
  return {
    glow: Array.from({ length: stringCount }, () => 0),
    disabled: Array.from({ length: stringCount }, () => 0),
    disabledTarget: Array.from({ length: stringCount }, () => 0),
    dimDisabledLanes: false,
    target: -1,
  };
}

function isPointOnBoard(L, x, y) {
  if (x < L.startX || x > L.endX) return false;
  const dMm = (x - L.x(0)) / L.pxPerMm;
  return y >= L.edgeY(dMm, -1) && y <= L.edgeY(dMm, 1);
}

/** @returns {number} индекс строки или -1 */
function stringRowAt(L, geom, x, y) {
  if (!isPointOnBoard(L, x, y)) return -1;

  const dMm = (x - L.x(0)) / L.pxPerMm;
  let best = -1;
  let bestDist = Infinity;

  for (let row = 0; row < geom.SPEC.strings.length; row++) {
    const dist = Math.abs(L.stringY(row, dMm) - y);
    if (dist < bestDist) {
      bestDist = dist;
      best = row;
    }
  }

  return best;
}

/** @returns {boolean} нужен ли ещё один кадр */
function stepStringHover(state) {
  let moving = false;

  for (let i = 0; i < state.glow.length; i++) {
    const target = i === state.target ? 1 : 0;
    let value = state.glow[i] + (target - state.glow[i]) * EASE;

    if (Math.abs(target - value) < SNAP) value = target;
    else moving = true;

    state.glow[i] = value;

    const disabledTarget = state.disabledTarget[i] ?? 0;
    let disabledValue = state.disabled[i] + (disabledTarget - state.disabled[i]) * EASE;

    if (Math.abs(disabledTarget - disabledValue) < SNAP) disabledValue = disabledTarget;
    else moving = true;

    state.disabled[i] = disabledValue;
  }

  return moving;
}

function stringHoverFocus(state) {
  if (!state) return 0;
  return state.glow.reduce((max, value) => Math.max(max, value), 0);
}

function stringLabelCenter(L, row) {
  const k = L.pxPerMm;
  return {
    x: L.startX - 5.5 * k,
    y: L.stringY(row, L.startMm),
    r: 3.6 * k,
  };
}

/** @returns {number} индекс строки у кружка или -1 */
function stringLabelRowAt(L, stringCount, x, y) {
  const hitR = 3.6 * L.pxPerMm * 1.15;

  for (let row = 0; row < stringCount; row++) {
    const { x: cx, y: cy } = stringLabelCenter(L, row);
    if (Math.hypot(x - cx, y - cy) <= hitR) return row;
  }

  return -1;
}

/**
 * @module fretboard-canvas-texture
 * @description Процедурные текстуры палисандра для canvas-грифа.
 * @depends none
 */

function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

let noiseTile = null;

function noise(size) {
  if (noiseTile) return noiseTile;

  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const rand = rng(20260815);

  for (let i = 0; i < img.data.length; i += 4) {
    const v = 110 + rand() * 90;
    img.data[i] = v;
    img.data[i + 1] = v * 0.92;
    img.data[i + 2] = v * 0.82;
    img.data[i + 3] = 255;
  }

  ctx.putImageData(img, 0, 0);
  noiseTile = c;
  return c;
}

function grain(ctx, band, count) {
  const rand = rng(777);
  ctx.lineCap = 'round';

  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count + (rand() - 0.5) * 0.045;
    const amp = 1.2 + rand() * 3.6;
    const phase = rand() * Math.PI * 2;
    const freq = 0.8 + rand() * 2.4;
    const drift = (rand() - 0.5) * 0.09;
    const driftFreq = 0.4 + rand() * 1.1;
    const driftPhase = rand() * Math.PI * 2;
    const dark = rand() < 0.58;

    ctx.beginPath();
    for (let x = band.x0; x <= band.x1; x += 5) {
      const u = (x - band.x0) / (band.x1 - band.x0);
      const tt = t + Math.sin(u * driftFreq * Math.PI * 2 + driftPhase) * drift;
      const top = band.yTop(x);
      let y = top + tt * (band.yBot(x) - top);
      y += Math.sin(u * freq * Math.PI * 2 + phase) * amp;
      if (x === band.x0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.strokeStyle = dark
      ? `rgba(16,8,3,${(0.34 + rand() * 0.34).toFixed(2)})`
      : `rgba(152,92,50,${(0.14 + rand() * 0.22).toFixed(2)})`;
    ctx.lineWidth = dark ? 0.4 + rand() * 1.8 : 0.4 + rand() * 1.2;
    ctx.stroke();
  }
}

function figure(ctx, band, count) {
  const rand = rng(9091);
  const w = band.x1 - band.x0;

  for (let i = 0; i < count; i++) {
    const x = band.x0 + rand() * w;
    const top = band.yTop(x);
    const y = top + rand() * (band.yBot(x) - top);
    const rx = w * (0.03 + rand() * 0.1);
    const ry = (band.yBot(x) - top) * (0.25 + rand() * 0.6);
    const dark = rand() < 0.5;

    const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
    g.addColorStop(0, dark ? 'rgba(8,4,2,0.30)' : 'rgba(170,106,58,0.22)');
    g.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry));
    ctx.translate(-x, -y);
    ctx.fillStyle = g;
    ctx.fillRect(x - rx * 2, y - ry * 2, rx * 4, ry * 4);
    ctx.restore();
  }
}

function pores(ctx, band, count) {
  const rand = rng(4242);
  ctx.fillStyle = 'rgba(10,5,2,0.5)';

  for (let i = 0; i < count; i++) {
    const x = band.x0 + rand() * (band.x1 - band.x0);
    const top = band.yTop(x);
    const y = top + rand() * (band.yBot(x) - top);
    const w = 1.5 + rand() * 5;
    const h = 0.5 + rand() * 0.9;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((rand() - 0.5) * 0.16);
    ctx.beginPath();
    ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}


// ----- js/fretboard-canvas-board.js -----

/**
 * @module fretboard-canvas-board
 * @description Canvas-рендер накладки: дерево, порожек, лады, инкрустация.
 * @depends fretboard-canvas-texture
 */

/** Радиус скругления углов — кромка накладки выглядит запиленной, а не вырезанной ножницами. */
function cornerRadius(L) {
  const width = L.edgeY(L.endMm, 1) - L.edgeY(L.endMm, -1);
  return Math.min(7 * L.pxPerMm, width * 0.22);
}

function boardPath(ctx, L) {
  const r = cornerRadius(L);
  const xL = L.startX;
  const xR = L.endX;
  const yTL = L.edgeY(L.startMm, -1);
  const yBL = L.edgeY(L.startMm, 1);
  const yTR = L.edgeY(L.endMm, -1);
  const yBR = L.edgeY(L.endMm, 1);

  ctx.beginPath();
  ctx.moveTo(xL + r, yTL);
  ctx.lineTo(xR - r, yTR);
  ctx.quadraticCurveTo(xR, yTR, xR, yTR + r);
  ctx.lineTo(xR, yBR - r);
  ctx.quadraticCurveTo(xR, yBR, xR - r, yBR);
  ctx.lineTo(xL + r, yBL);
  ctx.quadraticCurveTo(xL, yBL, xL, yBL - r);
  ctx.lineTo(xL, yTL + r);
  ctx.quadraticCurveTo(xL, yTL, xL + r, yTL);
  ctx.closePath();
}

function edgeAtX(L, x, side) {
  return L.edgeY((x - L.x(0)) / L.pxPerMm, side);
}

function wood(ctx, L) {
  const x0 = L.startX;
  const x1 = L.endX;
  const yTop = (x) => edgeAtX(L, x, -1);
  const yBot = (x) => edgeAtX(L, x, 1);

  ctx.save();
  boardPath(ctx, L);
  ctx.clip();

  ctx.fillStyle = '#2c1a10';
  boardPath(ctx, L);
  ctx.fill();

  const top = yTop(x0);
  const bot = yBot(x1);
  const base = ctx.createLinearGradient(0, top, 0, bot);
  base.addColorStop(0, '#5e3a22');
  base.addColorStop(0.14, '#43281a');
  base.addColorStop(0.45, '#311c12');
  base.addColorStop(0.78, '#3a2115');
  base.addColorStop(1, '#1c0f08');
  ctx.fillStyle = base;
  ctx.fillRect(x0 - 20, top - 40, x1 - x0 + 60, bot - top + 90);

  const band = { x0, x1, yTop, yBot };
  figure(ctx, band, 26);
  grain(ctx, band, 64);
  pores(ctx, band, 620);

  const tile = noise(96);
  ctx.globalAlpha = 0.13;
  ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = ctx.createPattern(tile, 'repeat');
  ctx.fillRect(x0 - 20, top - 40, x1 - x0 + 60, bot - top + 90);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  const sheen = ctx.createLinearGradient(0, top, 0, bot);
  sheen.addColorStop(0, 'rgba(255,214,164,0.16)');
  sheen.addColorStop(0.28, 'rgba(255,200,150,0.05)');
  sheen.addColorStop(0.62, 'rgba(0,0,0,0.12)');
  sheen.addColorStop(1, 'rgba(0,0,0,0.34)');
  ctx.fillStyle = sheen;
  ctx.fillRect(x0 - 20, top - 40, x1 - x0 + 60, bot - top + 90);

  /*
   * Кант радиуса: накладка гитары выгнута поперёк, поэтому свет собирается
   * узкой полосой у верхней грани, а нижняя грань уходит в собственную тень.
   * Строк с shadowBlur, обрезанный клипом, даёт мягкий внутренний градиент
   * без лишней геометрии.
   */
  const glow = 5 * L.pxPerMm;

  ctx.beginPath();
  ctx.moveTo(x0, yTop(x0));
  ctx.lineTo(x1, yTop(x1));
  ctx.lineWidth = 1;
  ctx.shadowBlur = glow;
  ctx.shadowColor = 'rgba(255,228,186,0.85)';
  ctx.strokeStyle = 'rgba(255,228,186,0.85)';
  ctx.stroke();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x0, yBot(x0));
  ctx.lineTo(x1, yBot(x1));
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.strokeStyle = 'rgba(0,0,0,0.75)';
  ctx.stroke();
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.restore();

  /* Чёткий контур поверх мягкой кромки — задаёт физический край, а не срез картинки. */
  ctx.save();
  boardPath(ctx, L);
  ctx.lineWidth = Math.max(1, 0.32 * L.pxPerMm);
  ctx.strokeStyle = 'rgba(10,6,3,0.55)';
  ctx.stroke();
  ctx.restore();
}

function nut(ctx, L, geom) {
  const d = geom.SPEC.nutDepthMm * L.pxPerMm;
  const x = L.x(0);
  const xl = x - d;

  function shape() {
    ctx.beginPath();
    ctx.moveTo(xl, edgeAtX(L, xl, -1));
    ctx.lineTo(x, edgeAtX(L, x, -1));
    ctx.lineTo(x, edgeAtX(L, x, 1));
    ctx.lineTo(xl, edgeAtX(L, xl, 1));
    ctx.closePath();
  }

  ctx.save();
  boardPath(ctx, L);
  ctx.clip();

  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 8 * (L.pxPerMm / 3);
  ctx.shadowOffsetX = 2 * (L.pxPerMm / 3);
  ctx.fillStyle = '#e6dcc4';
  shape();
  ctx.fill();
  ctx.shadowColor = 'transparent';

  const g = ctx.createLinearGradient(xl, 0, x, 0);
  g.addColorStop(0, '#78684c');
  g.addColorStop(0.35, '#fffaee');
  g.addColorStop(0.7, '#d6c6a6');
  g.addColorStop(1, '#60523c');
  ctx.fillStyle = g;
  shape();
  ctx.fill();
  ctx.restore();
}

function fretWirePath(ctx, L, x, halfW) {
  const xl = x - halfW;
  const xr = x + halfW;
  const yTopL = edgeAtX(L, xl, -1);
  const yTopR = edgeAtX(L, xr, -1);
  const yBotL = edgeAtX(L, xl, 1);
  const yBotR = edgeAtX(L, xr, 1);
  const r = Math.min(halfW * 0.55, (yBotL - yTopL) * 0.06);

  ctx.beginPath();
  ctx.moveTo(xl + r, yTopL);
  ctx.lineTo(xr - r, yTopR);
  ctx.quadraticCurveTo(xr, yTopR, xr, yTopR + r);
  ctx.lineTo(xr, yBotR - r);
  ctx.quadraticCurveTo(xr, yBotR, xr - r, yBotR);
  ctx.lineTo(xl + r, yBotL);
  ctx.quadraticCurveTo(xl, yBotL, xl, yBotL - r);
  ctx.lineTo(xl, yTopL + r);
  ctx.quadraticCurveTo(xl, yTopL, xl + r, yTopL);
  ctx.closePath();
}

function drawFretWire(ctx, L, x, halfW, fillStyle) {
  ctx.save();
  fretWirePath(ctx, L, x, halfW);
  ctx.fillStyle = fillStyle;
  ctx.fill();
  ctx.restore();
}

function frets(ctx, L, geom) {
  const k = L.pxPerMm;

  ctx.save();
  boardPath(ctx, L);
  ctx.clip();

  for (let n = 1; n <= geom.SPEC.frets; n++) {
    const x = L.fretX(n);
    const halfW = (n === 12 ? 2.4 : 2.1) * k * 0.55;

    drawFretWire(ctx, L, x + halfW * 0.1, halfW, 'rgba(0,0,0,0.24)');

    const g = ctx.createLinearGradient(x - halfW, 0, x + halfW, 0);
    g.addColorStop(0, '#4d4a42');
    g.addColorStop(0.2, '#a9a498');
    g.addColorStop(0.42, '#f4f1e8');
    g.addColorStop(0.52, '#ffffff');
    g.addColorStop(0.68, '#c6c0b2');
    g.addColorStop(0.88, '#6f6a60');
    g.addColorStop(1, '#3c3932');
    drawFretWire(ctx, L, x, halfW, g);

    ctx.save();
    fretWirePath(ctx, L, x, halfW);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(
      x - halfW * 0.18,
      edgeAtX(L, x, -1),
      halfW * 0.2,
      edgeAtX(L, x, 1) - edgeAtX(L, x, -1)
    );
    ctx.restore();
  }

  ctx.restore();
}

function inlay(ctx, cx, cy, r) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.18, r * 1.12, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fill();

  const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.4, '#f2e9d6');
  g.addColorStop(0.78, '#d8c8a8');
  g.addColorStop(1, '#a8977a');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx - r * 0.3, cy - r * 0.34, r * 0.26, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fill();
  ctx.restore();
}

function inlays(ctx, L, geom) {
  const r = 2.6 * L.pxPerMm;

  geom.SPEC.inlaySingle.forEach((n) => {
    const d = geom.fretCenterMm(n);
    inlay(ctx, L.fretCenterX(n), L.stringY(2.5, d), r);
  });

  const n12 = geom.SPEC.inlayDouble;
  const d12 = geom.fretCenterMm(n12);
  inlay(ctx, L.fretCenterX(n12), L.stringY(1.5, d12), r);
  inlay(ctx, L.fretCenterX(n12), L.stringY(3.5, d12), r);
}

function drawCanvasBoard(ctx, L, geom) {
  wood(ctx, L);
  inlays(ctx, L, geom);
  frets(ctx, L, geom);
  nut(ctx, L, geom);
}


// ----- js/fretboard-canvas-strings.js -----

/**
 * @module fretboard-canvas-strings
 * @description Canvas-рендер струн и подписей с подсветкой целевой струны.
 * @depends fretboard-canvas-hover, fretboard-canvas-board
 */

const GAIN = 1.5;
const DIM = 0.45;

/** Затемнение струн на грифе — focus + target glow (Find Fret) или disabled mask (Find note). */
function stringLaneAlpha(hoverState, row, glowValue) {
  const disabled = hoverState?.disabled?.[row] ?? 0;
  if (hoverState?.dimDisabledLanes) {
    return 1 - DIM * disabled;
  }

  const focus = stringHoverFocus(hoverState);
  return 1 - DIM * focus * (1 - glowValue);
}

/**
 * Кружки слева в Find Fret: target (золото), enabled (как справочник), disabled (блеклый).
 */
function stringCircleAlpha(hoverState, row, glowValue) {
  if (glowValue > 0.01) return 1;

  const disabled = hoverState?.disabled?.[row] ?? 0;
  if (disabled > 0.01) return 1 - DIM;

  return 1;
}

const COPPER = [
  { core: '#8a5a2c', mid: '#e0aa66', hot: '#ffe6bc' },
  { core: '#8f5f30', mid: '#e6b472', hot: '#ffeac6' },
  { core: '#95663a', mid: '#ecbd80', hot: '#fff0d2' },
];

function line(L, row) {
  const x1 = L.startX;
  const y1 = L.stringY(row, L.startMm);
  const x2 = L.endX;
  const y2 = L.stringY(row, L.endMm);
  return {
    x: x1,
    y: y1,
    len: Math.hypot(x2 - x1, y2 - y1),
    a: Math.atan2(y2 - y1, x2 - x1),
  };
}

function shadow(ctx, L, geom) {
  ctx.save();
  ctx.globalAlpha = 0.42;
  ctx.strokeStyle = '#000';
  ctx.lineCap = 'butt';

  geom.SPEC.strings.forEach((s, row) => {
    const w = s.dMm * GAIN * L.pxPerMm;
    ctx.lineWidth = w * 1.25;
    ctx.beginPath();
    ctx.moveTo(L.startX, L.stringY(row, L.startMm) + w * 0.9);
    ctx.lineTo(L.endX, L.stringY(row, L.endMm) + w * 0.9);
    ctx.stroke();
  });

  ctx.restore();
}

function wound(ctx, len, w, tone) {
  const g = ctx.createLinearGradient(0, -w / 2, 0, w / 2);
  g.addColorStop(0, tone.core);
  g.addColorStop(0.22, tone.mid);
  g.addColorStop(0.38, tone.hot);
  g.addColorStop(0.6, tone.mid);
  g.addColorStop(1, '#3d2410');
  ctx.fillStyle = g;
  ctx.fillRect(0, -w / 2, len, w);

  const pitch = Math.max(1.6, w * 0.62);
  const slant = w * 0.5;
  ctx.lineWidth = Math.max(0.6, w * 0.16);

  for (let x = 0; x < len; x += pitch) {
    ctx.strokeStyle = 'rgba(255,240,214,0.5)';
    ctx.beginPath();
    ctx.moveTo(x - slant, w / 2);
    ctx.lineTo(x + slant, -w / 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(40,20,6,0.45)';
    ctx.beginPath();
    ctx.moveTo(x - slant + pitch / 2, w / 2);
    ctx.lineTo(x + slant + pitch / 2, -w / 2);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,252,242,0.62)';
  ctx.fillRect(0, -w * 0.2, len, w * 0.13);
}

function nylon(ctx, len, w, warm) {
  const g = ctx.createLinearGradient(0, -w / 2, 0, w / 2);
  g.addColorStop(0, warm ? 'rgba(96,68,26,0.60)' : 'rgba(104,104,98,0.55)');
  g.addColorStop(0.16, warm ? 'rgba(228,196,124,0.34)' : 'rgba(206,206,200,0.30)');
  g.addColorStop(0.44, warm ? 'rgba(255,244,206,0.20)' : 'rgba(252,252,250,0.18)');
  g.addColorStop(0.74, warm ? 'rgba(170,128,58,0.30)' : 'rgba(160,160,154,0.28)');
  g.addColorStop(1, warm ? 'rgba(58,38,12,0.62)' : 'rgba(64,64,60,0.58)');
  ctx.fillStyle = g;
  ctx.fillRect(0, -w / 2, len, w);

  const s = ctx.createLinearGradient(0, -w * 0.36, 0, -w * 0.05);
  s.addColorStop(0, 'rgba(255,255,255,0)');
  s.addColorStop(0.5, warm ? 'rgba(255,250,232,0.95)' : 'rgba(255,255,255,0.95)');
  s.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = s;
  ctx.fillRect(0, -w * 0.36, len, w * 0.31);

  ctx.fillStyle = warm ? 'rgba(255,226,158,0.28)' : 'rgba(255,255,252,0.24)';
  ctx.fillRect(0, w * 0.26, len, Math.max(0.5, w * 0.12));
}

function laneGlow(ctx, L, row, s, glowValue) {
  if (glowValue < 0.004) return;

  const l = line(L, row);
  const h = Math.max(4.6 * L.pxPerMm, s.dMm * GAIN * L.pxPerMm * 5);

  ctx.save();
  ctx.translate(l.x, l.y);
  ctx.rotate(l.a);
  ctx.globalCompositeOperation = 'lighter';

  const grad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  grad.addColorStop(0, 'rgba(255,188,104,0)');
  grad.addColorStop(0.5, `rgba(255,206,140,${(0.26 * glowValue).toFixed(3)})`);
  grad.addColorStop(1, 'rgba(255,188,104,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, -h / 2, l.len, h);

  ctx.restore();
}

function laneSheen(ctx, len, w, glowValue) {
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(255,236,200,${(0.5 * glowValue).toFixed(3)})`;
  ctx.fillRect(0, -w * 0.42, len, Math.max(0.6, w * 0.3));
  ctx.restore();
}

function drawCanvasStrings(ctx, L, geom, hoverState = null) {
  const glow = hoverState?.glow ?? null;

  /*
   * Скруглённые углы накладки «подъедают» крайние миллиметры у самого
   * порожка-зоны — без обтравки тень и блик нижней струны вылезали
   * за контур на прозрачный фон.
   */
  ctx.save();
  boardPath(ctx, L);
  ctx.clip();

  shadow(ctx, L, geom);

  geom.SPEC.strings.forEach((s, row) => {
    laneGlow(ctx, L, row, s, glow ? glow[row] : 0);
  });

  geom.SPEC.strings.forEach((s, row) => {
    const g = glow ? glow[row] : 0;
    const l = line(L, row);
    const w = s.dMm * GAIN * L.pxPerMm;

    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.a);
    ctx.globalAlpha = stringLaneAlpha(hoverState, row, g);

    if (s.wound) wound(ctx, l.len, w, COPPER[s.num - 4] || COPPER[0]);
    else nylon(ctx, l.len, w, s.num === 3);

    if (g > 0.01) laneSheen(ctx, l.len, w, g);

    ctx.restore();
  });

  ctx.restore();
}

function drawCanvasStringLabels(ctx, L, geom, hoverState = null) {
  const k = L.pxPerMm;
  const glow = hoverState?.glow ?? null;

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  geom.SPEC.strings.forEach((s, row) => {
    const { x, y, r } = stringLabelCenter(L, row);
    const g = glow ? glow[row] : 0;

    ctx.globalAlpha = stringCircleAlpha(hoverState, row, g);

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(28,22,18,0.92)';
    ctx.fill();
    const innerStrokeAlpha = 0.45 + 0.5 * g;
    const innerR = Math.round(214 - 14 * g);
    const innerG = Math.round(190 - 52 * g);
    const innerB = Math.round(150 - 105 * g);
    ctx.strokeStyle = `rgba(${innerR},${innerG},${innerB},${innerStrokeAlpha.toFixed(2)})`;
    ctx.lineWidth = (0.4 + 0.38 * g) * k;
    ctx.stroke();

    if (g > 0.01) {
      ctx.beginPath();
      ctx.arc(x, y, r + 1.4 * k * g, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(232,152,36,${(0.58 * g).toFixed(3)})`;
      ctx.lineWidth = 0.55 * k;
      ctx.stroke();
    }

    ctx.font = `600 ${(3.4 * k).toFixed(1)}px system-ui, sans-serif`;
    ctx.fillStyle = '#f0e6d2';
    ctx.fillText(String(s.num), x, y);
    if (g > 0.01) {
      ctx.fillStyle = `rgba(255,214,150,${g.toFixed(3)})`;
      ctx.fillText(String(s.num), x, y);
    }
  });

  ctx.restore();
}


// ----- js/fretboard-canvas-view.js -----

/**
 * @module fretboard-canvas-view
 * @description Canvas-рендер грифа: кэш накладки + анимированные струны.
 * @depends fretboard-canvas-geometry, fretboard-canvas-board, fretboard-canvas-strings, fretboard-canvas-hover
 */

function buildBoardCache(view, L, geom, dpr) {
  const still = document.createElement('canvas');
  still.width = Math.round(view.cssWidth * dpr);
  still.height = Math.round(view.cssHeight * dpr);

  const sctx = still.getContext('2d');
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCanvasBoard(sctx, L, geom);
  return still;
}

function paintStringsLayer(ctx, view, boardCache, L, geom, hoverState) {
  ctx.clearRect(0, 0, view.cssWidth, view.cssHeight);
  ctx.drawImage(boardCache, 0, 0, view.cssWidth, view.cssHeight);
  drawCanvasStrings(ctx, L, geom, hoverState);
  drawCanvasStringLabels(ctx, L, geom, hoverState);
}

/**
 * @param {import('./config.js').GUITAR} guitar
 * @param {number} cssWidth
 */
function renderCanvasStage(guitar, cssWidth) {
  const geom = createCanvasGeom(guitar);
  let view = canvasMetrics(guitar, cssWidth);
  let L = geom.layout(view);
  let dpr = Math.min(3, window.devicePixelRatio || 1);

  const canvas = document.createElement('canvas');
  canvas.className = 'fretboard-canvas';

  const ctx = canvas.getContext('2d');
  let boardCache = null;
  let hoverState = createStringHoverState(guitar.strings);
  let pinnedStringIndex = null;
  let animating = false;
  let animFrame = null;

  function syncCanvasSize() {
    canvas.width = Math.round(view.cssWidth * dpr);
    canvas.height = Math.round(view.cssHeight * dpr);
    canvas.style.width = `${view.cssWidth}px`;
    canvas.style.height = `${view.cssHeight}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function resolveHoverTarget() {
    return pinnedStringIndex !== null ? pinnedStringIndex : -1;
  }

  function syncHoverTarget() {
    const target = resolveHoverTarget();
    if (target === hoverState.target) return false;
    hoverState.target = target;
    return true;
  }

  function tick() {
    const moving = stepStringHover(hoverState);
    paintStringsLayer(ctx, view, boardCache, L, geom, hoverState);
    if (moving) {
      animFrame = requestAnimationFrame(tick);
    } else {
      animating = false;
      animFrame = null;
    }
  }

  function animateHover() {
    if (animating) return;
    animating = true;
    animFrame = requestAnimationFrame(tick);
  }

  function stopAnimation() {
    if (animFrame !== null) {
      cancelAnimationFrame(animFrame);
      animFrame = null;
    }
    animating = false;
  }

  function rebuildBoard() {
    syncCanvasSize();
    boardCache = buildBoardCache(view, L, geom, dpr);
    paintStringsLayer(ctx, view, boardCache, L, geom, hoverState);
  }

  function setPinnedStringHighlight(stringIndex) {
    const next =
      typeof stringIndex === 'number' && stringIndex >= 0 && stringIndex < guitar.strings
        ? stringIndex
        : null;

    if (next === pinnedStringIndex) return;
    pinnedStringIndex = next;
    if (syncHoverTarget()) animateHover();
  }

  function setDimDisabledLanes(enabled) {
    const next = Boolean(enabled);
    if (hoverState.dimDisabledLanes === next) return;
    hoverState.dimDisabledLanes = next;
    animateHover();
  }

  function setDisabledStringMask(mask) {
    const next = Array.from({ length: guitar.strings }, (_, row) =>
      mask?.[row] ? 1 : 0
    );
    const changed = next.some((value, row) => value !== hoverState.disabledTarget[row]);
    if (!changed) return;

    hoverState.disabledTarget = next;
    animateHover();
  }

  function clearStringVisualState() {
    pinnedStringIndex = null;
    hoverState.disabledTarget = Array.from({ length: guitar.strings }, () => 0);
    hoverState.dimDisabledLanes = false;
    syncHoverTarget();
    animateHover();
  }

  syncCanvasSize();
  rebuildBoard();
  syncHoverTarget();
  animateHover();

  const hitLayout = buildCanvasHitLayout(guitar, L, geom);
  hitLayout.cssHeight = view.cssHeight;

  return {
    canvas,
    geom,
    L,
    view,
    hitLayout,
    setPinnedStringHighlight,
    setDisabledStringMask,
    setDimDisabledLanes,
    clearStringVisualState,
    getStringHoverFocus: () => stringHoverFocus(hoverState),
    getStringDisabledValue: (row) => hoverState.disabled[row] ?? 0,
    getStringCircleAlpha: (row) => {
      const g = hoverState.glow[row] ?? 0;
      return stringCircleAlpha(hoverState, row, g);
    },
    repaint(nextWidth) {
      stopAnimation();
      view = canvasMetrics(guitar, nextWidth);
      L = geom.layout(view);
      dpr = Math.min(3, window.devicePixelRatio || 1);
      rebuildBoard();
      syncHoverTarget();
      animateHover();

      const nextHit = buildCanvasHitLayout(guitar, L, geom);
      nextHit.cssHeight = view.cssHeight;
      return { L, view: view, hitLayout: nextHit };
    },
    destroy() {
      stopAnimation();
    },
  };
}

/**
 * @module fretboard-view-svg
 * @description SVG-примитивы и стили струн.
 * @depends fretboard
 */

function rect(x, y, w, h, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  el.setAttribute('x', x);
  el.setAttribute('y', y);
  el.setAttribute('width', w);
  el.setAttribute('height', h);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function lineEl(x1, y1, x2, y2, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  el.setAttribute('x1', x1);
  el.setAttribute('y1', y1);
  el.setAttribute('x2', x2);
  el.setAttribute('y2', y2);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function textEl(x, y, content, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  el.setAttribute('x', x);
  el.setAttribute('y', y);
  el.textContent = content;
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function lighten(hex, amount) {
  return adjustColor(hex, amount);
}

function darken(hex, amount) {
  return adjustColor(hex, -amount);
}

function adjustColor(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amount));
  const b = Math.min(255, Math.max(0, (num & 0xff) + amount));
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

function addDot(svg, x, y, theme) {
  const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('cx', x);
  dot.setAttribute('cy', y);
  dot.setAttribute('r', 5);
  dot.setAttribute('fill', theme.inlay);
  dot.setAttribute('opacity', '0.85');
  svg.appendChild(dot);
}

function getStringStyle(guitar, visualStringIndex) {
  const tuningIndex = getTuningIndex(guitar, visualStringIndex);

  const profiles = [
    {
      type: 'wound',
      color: '#75634a',
      wrap: '#564e42',
      highlight: '#b0a080',
      width: 3.2,
      dash: '2.4 1.6',
      wrapOpacity: 0.82,
    },
    {
      type: 'wound',
      color: '#857358',
      wrap: '#645c50',
      highlight: '#bcae90',
      width: 2.9,
      dash: '2.1 1.5',
      wrapOpacity: 0.78,
    },
    {
      type: 'wound',
      color: '#958878',
      wrap: '#746a5e',
      highlight: '#c8baa0',
      width: 2.6,
      dash: '1.8 1.3',
      wrapOpacity: 0.74,
    },
    {
      type: 'nylon',
      color: '#ebe3d2',
      wrap: null,
      highlight: '#fff6ea',
      width: 2.2,
      dash: null,
      wrapOpacity: 0,
    },
    {
      type: 'nylon',
      color: '#f7f4ec',
      wrap: null,
      highlight: '#ffffff',
      width: 1.85,
      dash: null,
      wrapOpacity: 0,
    },
    {
      type: 'nylon',
      color: '#fffdf8',
      wrap: null,
      highlight: '#ffffff',
      width: 1.5,
      dash: null,
      wrapOpacity: 0,
    },
  ];

  const profile = profiles[tuningIndex] || profiles[profiles.length - 1];
  const themeStrings = guitar.theme.strings;

  if (profile.type === 'wound') {
    const wound = typeof themeStrings === 'object' ? themeStrings.wound : null;
    return {
      type: 'wound',
      color: profile.color || wound?.core || '#9a8870',
      wrap: profile.wrap || wound?.wrap || '#7a7060',
      highlight: profile.highlight,
      width: profile.width,
      dash: profile.dash,
      wrapOpacity: profile.wrapOpacity,
    };
  }

  const nylon = typeof themeStrings === 'object' ? themeStrings.nylon : null;
  return {
    type: 'nylon',
    color: profile.color || nylon?.color || '#fffef8',
    wrap: null,
    highlight: profile.highlight,
    width: profile.width,
    dash: null,
    wrapOpacity: 0,
  };
}
