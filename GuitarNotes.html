/**
 * @module fretboard-view-find-note
 * @description Маркеры результата в режиме «Найди ноту» на SVG-грифе.
 * @depends note, fretboard-view-svg
 */

function createFindNoteMarkHandlers({
  matchLayer,
  cellCenters,
  getTapDotR,
  hideSelected,
  hideHover,
  styleRainbowDot,
  clearMatches,
  clearGuess,
}) {
  const findNoteMarks = new Map();

  function markPositionKey(string, fret) {
    return `${string}:${fret}`;
  }

  function styleWhiteDot(dot) {
    dot.setAttribute('fill', 'rgba(255, 255, 255, 0.95)');
    dot.removeAttribute('fill-opacity');
    dot.setAttribute('stroke', 'rgba(0, 0, 0, 0.14)');
    dot.setAttribute('stroke-width', '1');
    dot.setAttribute('class', 'fret-tap fret-tap-selected');
  }

  function fadeOutAndRemove(dot, durationMs, onComplete) {
    const fillStart = parseFloat(dot.getAttribute('fill-opacity') || '1');
    const strokeStart = parseFloat(dot.getAttribute('stroke-opacity') || '1');
    const start = performance.now();

    function frame(now) {
      const progress = Math.min(1, (now - start) / durationMs);
      const remaining = 1 - progress;
      dot.setAttribute('fill-opacity', String(fillStart * remaining));
      dot.setAttribute('stroke-opacity', String(strokeStart * remaining));

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        dot.remove();
        onComplete?.();
      }
    }

    requestAnimationFrame(frame);
  }

  function showFindNoteResult(cx, cy, isCorrect, pitchClass, options = {}) {
    hideSelected();
    hideHover();

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', getTapDotR());
    dot.setAttribute('class', 'fret-tap fret-tap-result');
    dot.setAttribute('pointer-events', 'none');

    if (isCorrect) {
      styleRainbowDot(dot, getNoteRainbowColor(pitchClass));
    } else {
      styleWhiteDot(dot);
    }

    matchLayer.appendChild(dot);

    if (options.fadeMs) {
      fadeOutAndRemove(dot, options.fadeMs);
    }
  }

  function appendMarkedDot(cx, cy, key) {
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('data-find-key', key);
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', getTapDotR());
    matchLayer.appendChild(dot);
    return dot;
  }

  function markFindNotePosition(string, fret, isCorrect, pitchClass, options = {}) {
    const key = markPositionKey(string, fret);
    if (findNoteMarks.get(key) === 'correct') return;

    matchLayer.querySelectorAll(`[data-find-key="${key}"]`).forEach((el) => el.remove());

    const cell = cellCenters.find((c) => c.string === string && c.fret === fret);
    if (!cell) return;

    const dot = appendMarkedDot(cell.cx, cell.cy, key);
    if (isCorrect) {
      styleRainbowDot(dot, getNoteRainbowColor(pitchClass));
      findNoteMarks.set(key, 'correct');
    } else {
      styleWhiteDot(dot);
      findNoteMarks.set(key, 'wrong');
      if (options.fadeMs) {
        fadeOutAndRemove(dot, options.fadeMs, () => {
          findNoteMarks.delete(key);
          options.onFadeComplete?.();
        });
      }
    }

    hideSelected();
    hideHover();
  }

  function fadeOutAllFindNoteMarks(durationMs, onComplete) {
    const dots = [...matchLayer.querySelectorAll('[data-find-key]')];

    if (dots.length === 0) {
      findNoteMarks.clear();
      onComplete?.();
      return;
    }

    let pending = dots.length;
    dots.forEach((dot) => {
      const markKey = dot.getAttribute('data-find-key');
      fadeOutAndRemove(dot, durationMs, () => {
        if (markKey) findNoteMarks.delete(markKey);
        pending -= 1;
        if (pending === 0) {
          findNoteMarks.clear();
          onComplete?.();
        }
      });
    });
  }

  function clearFindNoteMarks() {
    findNoteMarks.clear();
    clearMatches();
    clearGuess();
  }

  function isFindNoteMarkCorrect(string, fret) {
    return findNoteMarks.get(markPositionKey(string, fret)) === 'correct';
  }

  return {
    showFindNoteResult,
    markFindNotePosition,
    fadeOutAllFindNoteMarks,
    clearFindNoteMarks,
    isFindNoteMarkCorrect,
  };
}


// ----- js/fretboard-view-trainer-target.js -----

/**
 * @module fretboard-view-trainer-target
 * @description White target dot for non-interactive trainer modes.
 */

function createTrainerTargetDot({ container, tapLayer, cellCenters, getTapDotR }) {
  let dot = null;
  let activeTarget = null;

  function isGuessNoteMode() {
    return container.dataset.mode === 'guess-note';
  }

  function clear() {
    dot?.remove();
    dot = null;
    activeTarget = null;
  }

  function show(string, fret) {
    if (!isGuessNoteMode()) {
      clear();
      return;
    }

    const cell = cellCenters.find((c) => c.string === string && c.fret === fret);
    if (!cell) {
      clear();
      return;
    }

    activeTarget = { string, fret };

    if (!dot) {
      dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('class', 'fret-tap fret-tap-selected trainer-target-dot');
      dot.setAttribute('pointer-events', 'none');
      tapLayer.appendChild(dot);
    }

    dot.setAttribute('cx', String(cell.cx));
    dot.setAttribute('cy', String(cell.cy));
    dot.setAttribute('r', String(getTapDotR()));
    dot.setAttribute('fill', 'rgba(255, 255, 255, 0.95)');
    dot.setAttribute('stroke', 'rgba(0, 0, 0, 0.14)');
    dot.setAttribute('stroke-width', '1');
    dot.removeAttribute('fill-opacity');
    dot.removeAttribute('stroke-opacity');
  }

  function refresh() {
    if (!isGuessNoteMode()) {
      clear();
      return;
    }
    if (!activeTarget) return;
    show(activeTarget.string, activeTarget.fret);
  }

  return { show, clear, refresh };
}


// ----- js/fretboard-view-selection.js -----

/**
 * @module fretboard-view-selection
 * @description Выбор лада: hover/selected dots на SVG-overlay.
 * @depends note
 */

function createFretboardSelection({ selectedDot, hoverDot }) {
  let selection = null;

  function styleRainbowDot(dot, color, opacity = 1) {
    dot.setAttribute('fill', color);
    if (opacity < 1) {
      dot.setAttribute('fill-opacity', String(opacity));
    } else {
      dot.removeAttribute('fill-opacity');
    }
    dot.setAttribute('stroke', 'rgba(255, 255, 255, 0.92)');
    dot.setAttribute('stroke-width', '1.5');
    dot.setAttribute('class', 'fret-tap fret-tap-rainbow');
  }

  function hideSelected() {
    selectedDot.setAttribute('visibility', 'hidden');
  }

  function hideHover() {
    hoverDot.setAttribute('visibility', 'hidden');
  }

  function showSelectedAt(cx, cy, note) {
    selectedDot.setAttribute('cx', cx);
    selectedDot.setAttribute('cy', cy);
    if (note) {
      styleRainbowDot(selectedDot, getNoteRainbowColor(getPitchClass(note)));
    }
    selectedDot.setAttribute('visibility', 'visible');
  }

  function showHoverAt(cx, cy) {
    hoverDot.setAttribute('cx', cx);
    hoverDot.setAttribute('cy', cy);
    hoverDot.setAttribute('fill', 'rgba(255, 255, 255, 0.42)');
    hoverDot.removeAttribute('fill-opacity');
    hoverDot.setAttribute('stroke', 'rgba(255, 255, 255, 0.55)');
    hoverDot.setAttribute('stroke-width', '1');
    hoverDot.setAttribute('class', 'fret-tap fret-tap-hover');
    hoverDot.setAttribute('visibility', 'visible');
  }

  function setSelection(cx, cy, note) {
    selection = { cx, cy, note };
    showSelectedAt(cx, cy, note);
    hideHover();
  }

  function clearGuess() {
    selection = null;
    hideSelected();
    hideHover();
    selectedDot.removeAttribute('fill-opacity');
    selectedDot.removeAttribute('stroke-opacity');
  }

  function isSameSelection(cx, cy) {
    return selection?.cx === cx && selection?.cy === cy;
  }

  return {
    styleRainbowDot,
    hideSelected,
    hideHover,
    showHoverAt,
    setSelection,
    clearGuess,
    isSameSelection,
  };
}


// ----- js/fretboard-view-highlights.js -----

/**
 * @module fretboard-view-highlights
 * @description Подсветка pitch class и всех нот на SVG-overlay.
 * @depends fretboard, note
 */

function createFretboardHighlights({ guitar, cellCenters, matchLayer, getTapDotR, styleRainbowDot }) {
  function clearMatches() {
    matchLayer.replaceChildren();
  }

  function appendRainbowDot(cx, cy, color, note = null) {
    const parsed = note ? parseNote(note) : null;
    const octaveLabel = parsed ? getOctaveLabel(parsed.octave) : '';
    const dotR = getTapDotR();

    if (!octaveLabel) {
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('class', 'fret-tap fret-tap-rainbow');
      dot.setAttribute('cx', cx);
      dot.setAttribute('cy', cy);
      dot.setAttribute('r', dotR);
      dot.setAttribute('fill', color);
      dot.setAttribute('stroke', 'rgba(255, 255, 255, 0.92)');
      dot.setAttribute('stroke-width', '1.5');
      matchLayer.appendChild(dot);
      return;
    }

    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.setAttribute('class', 'fret-tap fret-tap-rainbow fret-tap-labeled');
    group.setAttribute('pointer-events', 'none');

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', dotR);
    dot.setAttribute('fill', color);
    dot.setAttribute('stroke', 'rgba(255, 255, 255, 0.92)');
    dot.setAttribute('stroke-width', '1.5');
    group.appendChild(dot);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', String(cx));
    text.setAttribute('y', String(cy));
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.setAttribute('font-size', String(Math.max(6.5, dotR * 0.72)));
    text.setAttribute('font-weight', '700');
    text.setAttribute('fill', getContrastTextColor(color));
    text.setAttribute('class', 'fret-tap-label');
    text.textContent = octaveLabel;
    group.appendChild(text);

    matchLayer.appendChild(group);
  }

  function highlightPitchClass(pitchClass) {
    clearMatches();
    const color = getNoteRainbowColor(pitchClass);

    for (const { fret, string, cx, cy } of cellCenters) {
      const note = getNoteAtFret(guitar, string, fret);
      if (getPitchClass(note) !== pitchClass) continue;
      appendRainbowDot(cx, cy, color, note);
    }
  }

  function highlightAllNotes() {
    clearMatches();

    for (const { fret, string, cx, cy } of cellCenters) {
      const note = getNoteAtFret(guitar, string, fret);
      appendRainbowDot(cx, cy, getNoteRainbowColor(getPitchClass(note)), note);
    }
  }

  return {
    highlightPitchClass,
    highlightAllNotes,
    clearMatches,
  };
}


// ----- js/fretboard-view-octave-overlay.js -----

/**
 * @module fretboard-view-octave-overlay
 * @description Полупрозрачные зоны октав поверх грифа.
 * @depends fretboard, note, fretboard-view-svg
 */

function getOctaveOverlayFill(octave, minOctave, maxOctave, opacity = 0.44) {
  const span = Math.max(1, maxOctave - minOctave);
  const t = (octave - minOctave) / span;
  const gray = Math.round(58 + t * 148);
  return `rgba(${gray}, ${gray}, ${gray}, ${opacity})`;
}

function groupCellsByOctave(guitar, cells) {
  const byOctave = new Map();

  for (const cell of cells) {
    const parsed = parseNote(getNoteAtFret(guitar, cell.string, cell.fret));
    if (!parsed) continue;

    const bucket = byOctave.get(parsed.octave) ?? [];
    bucket.push(cell);
    byOctave.set(parsed.octave, bucket);
  }

  return byOctave;
}

function mergeStringRuns(cells) {
  const byString = new Map();

  for (const cell of cells) {
    const row = byString.get(cell.string) ?? [];
    row.push(cell);
    byString.set(cell.string, row);
  }

  const merged = [];

  for (const rowCells of byString.values()) {
    rowCells.sort((a, b) => a.fret - b.fret);

    let run = null;
    for (const cell of rowCells) {
      if (!run || cell.fret !== run.lastFret + 1) {
        run = { cells: [cell], lastFret: cell.fret };
        merged.push(run);
      } else {
        run.cells.push(cell);
        run.lastFret = cell.fret;
      }
    }
  }

  return merged.map(({ cells: runCells }) => {
    const x = Math.min(...runCells.map((cell) => cell.x));
    const y = Math.min(...runCells.map((cell) => cell.y));
    const x2 = Math.max(...runCells.map((cell) => cell.x + cell.w));
    const y2 = Math.max(...runCells.map((cell) => cell.y + cell.h));
    return {
      x,
      y,
      w: x2 - x,
      h: y2 - y,
      cx: (x + x2) / 2,
      cy: (y + y2) / 2,
    };
  });
}

function createOctaveOverlay({ guitar, cellCenters, octaveLayer }) {
  let visible = false;

  function render() {
    octaveLayer.replaceChildren();
    if (!visible || cellCenters.length === 0) return;

    const byOctave = groupCellsByOctave(guitar, cellCenters);
    const octaves = [...byOctave.keys()].sort((a, b) => a - b);
    if (octaves.length === 0) return;

    const minOctave = octaves[0];
    const maxOctave = octaves[octaves.length - 1];

    for (const octave of octaves) {
      const runs = mergeStringRuns(byOctave.get(octave));
      if (runs.length === 0) continue;

      const fill = getOctaveOverlayFill(octave, minOctave, maxOctave);
      const labelFill = octave >= minOctave + (maxOctave - minOctave) / 2 ? '#2a2622' : '#f8f6f2';

      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('class', 'octave-overlay-group');
      group.setAttribute('data-octave', String(octave));

      for (const run of runs) {
        const shape = rect(run.x, run.y, run.w, run.h, {
          fill,
          stroke: 'rgba(255, 255, 255, 0.18)',
          'stroke-width': '1',
          rx: '3',
          ry: '3',
          class: 'octave-overlay-shape',
        });
        group.appendChild(shape);
      }

      const totalArea = runs.reduce((sum, run) => sum + run.w * run.h, 0);
      let labelX = 0;
      let labelY = 0;
      for (const run of runs) {
        const weight = (run.w * run.h) / totalArea;
        labelX += run.cx * weight;
        labelY += run.cy * weight;
      }

      const label = textEl(labelX, labelY, getOctaveName(octave), {
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        'font-size': '11',
        'font-weight': '600',
        fill: labelFill,
        class: 'octave-overlay-label',
      });
      group.appendChild(label);
      octaveLayer.appendChild(group);
    }
  }

  return {
    show() {
      visible = true;
      render();
    },
    hide() {
      visible = false;
      render();
    },
    onLayoutChange() {
      if (visible) render();
    },
    isVisible() {
      return visible;
    },
  };
}


// ----- js/fretboard-view-stats-heatmap.js -----

/**
 * @module fretboard-view-stats-heatmap
 * @description Heatmap точек статистики на SVG-overlay.
 * @depends none
 */

function statsGreenStyle(strength) {
  const t = Math.max(0, Math.min(1, strength));

  const fillR = Math.round(214 + (74 - 214) * t);
  const fillG = Math.round(245 + (222 - 245) * t);
  const fillB = Math.round(228 + (128 - 228) * t);
  const fillAlpha = 0.05 + t * 0.95;

  const strokeR = Math.round(134 + (21 - 134) * t);
  const strokeG = Math.round(196 + (128 - 196) * t);
  const strokeB = Math.round(154 + (61 - 154) * t);
  const strokeAlpha = 0.08 + t * 0.92;

  return {
    fill: `rgba(${fillR}, ${fillG}, ${fillB}, ${fillAlpha})`,
    stroke: `rgba(${strokeR}, ${strokeG}, ${strokeB}, ${strokeAlpha})`,
    tier: t >= 0.72 ? 'strong' : t >= 0.38 ? 'mid' : 'weak',
  };
}

function createStatsHeatmapRenderer(cellCenters, statsLayer, getTapDotR) {
  function renderStatsHeatmap(scores) {
    statsLayer.replaceChildren();
    if (!scores || scores.size === 0) return;

    const dotR = getTapDotR();

    for (const { fret, string, cx, cy } of cellCenters) {
      const key = `${string}:${fret}`;
      const entry = scores.get(key);
      if (!entry) continue;

      const strength = entry.heatmapStrength ?? entry.normalized ?? 0;
      const style = statsGreenStyle(strength);
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('class', `stats-note-dot stats-note-dot--${style.tier}`);
      dot.setAttribute('cx', cx);
      dot.setAttribute('cy', cy);
      dot.setAttribute('r', dotR);
      dot.setAttribute('fill', style.fill);
      dot.setAttribute('stroke', style.stroke);
      dot.setAttribute(
        'stroke-width',
        style.tier === 'strong' ? '1.8' : style.tier === 'mid' ? '1.4' : '1.1'
      );
      statsLayer.appendChild(dot);
    }
  }

  return { renderStatsHeatmap };
}


// ----- js/fretboard-view-hit-cells.js -----

/**
 * @module fretboard-view-hit-cells
 * @description Hit-ячейки грифа на SVG-overlay.
 * @depends fretboard, fretboard-view-svg
 */

function createHitCellFactory({
  container,
  guitar,
  interactive,
  cellCenters,
  selection,
  findNoteMarks,
}) {
  function addHitCell(hitLayer, x, y, w, h, fret, string, tapX, tapY) {
    const cell = rect(x, y, w, h, {
      fill: 'transparent',
      class: 'fret-cell',
      'data-fret': fret,
      'data-string': string,
      'pointer-events': interactive ? 'all' : 'none',
    });
    const cx = tapX ?? x + w / 2;
    const cy = tapY ?? y + h / 2;
    cellCenters.push({ fret, string, cx, cy, x, y, w, h });

    if (!interactive) {
      hitLayer.appendChild(cell);
      return;
    }

    cell.addEventListener('mouseenter', () => {
      const mode = container.dataset.mode || 'fret-note';
      if (
        (mode === 'find-note' || mode === 'guess-note') &&
        container.isTrainerStringEnabled &&
        !container.isTrainerStringEnabled(string)
      ) {
        selection.hideHover();
        return;
      }

      if (
        mode === 'find-note' &&
        container.dataset.findVariant === 'all' &&
        findNoteMarks.isFindNoteMarkCorrect(string, fret)
      ) {
        selection.hideHover();
        return;
      }

      if (selection.isSameSelection(cx, cy)) {
        selection.hideHover();
        return;
      }
      selection.showHoverAt(cx, cy);
    });
    cell.addEventListener('mouseleave', selection.hideHover);
    cell.addEventListener('click', () => {
      const note = getNoteAtFret(guitar, string, fret);
      const mode = container.dataset.mode || 'fret-note';

      if (mode === 'note-frets') {
        selection.hideSelected();
        selection.hideHover();
      } else if (mode === 'find-note') {
        selection.hideHover();
      } else {
        selection.setSelection(cx, cy, note);
      }

      container.dispatchEvent(
        new CustomEvent('fret-click', {
          detail: { fret, string, note, cx, cy },
        })
      );
    });
    hitLayer.appendChild(cell);
  }

  return { addHitCell };
}

/**
 * @module fretboard-view-string-labels
 * @description Hit-зоны кружков струн слева от грифа (Find Fret и Find note).
 * @depends fretboard-canvas-hover
 */

function createStringLabelHitFactory({ container, getL, stringCount }) {
  function addStringLabelHits(hitLayer) {
    const L = getL();
    for (let stringIndex = 0; stringIndex < stringCount; stringIndex++) {
      const { x, y, r } = stringLabelCenter(L, stringIndex);
      const hitR = r * 1.15;
      const cell = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      cell.setAttribute('class', 'string-label-hit');
      cell.setAttribute('cx', String(x));
      cell.setAttribute('cy', String(y));
      cell.setAttribute('r', String(hitR));
      cell.setAttribute('fill', 'transparent');
      cell.setAttribute('data-string-index', String(stringIndex));

      cell.addEventListener('click', () => {
        const mode = container.dataset.mode;
        if (mode !== 'find-note' && mode !== 'guess-note') return;
        container.dispatchEvent(
          new CustomEvent('string-toggle', {
            detail: { stringIndex },
          })
        );
      });

      hitLayer.appendChild(cell);
    }
  }

  return { addStringLabelHits };
}


// ----- js/fretboard-view-interaction.js -----

/**
 * @module fretboard-view-interaction
 * @description Интерактивные слои грифа: wiring кликов, подсветки, find-note marks.
 * @depends fretboard, fretboard-view-find-note, fretboard-view-selection, fretboard-view-highlights, fretboard-view-octave-overlay, fretboard-view-stats-heatmap, fretboard-view-hit-cells
 */

function attachFretboardInteraction({
  container,
  guitar,
  interactive,
  stringCount,
  cellCenters,
  matchLayer,
  tapLayer,
  octaveLayer,
  statsLayer,
  selectedDot,
  hoverDot,
  tapDotR,
  setPinnedStringHighlight,
  setDisabledStringMask,
  setDimDisabledLanes,
  clearStringVisualState,
}) {
  let dotR = tapDotR;
  /** @type {Set<number> | null} null — все струны активны (не тренажёр или сброс) */
  let trainerEnabledStrings = null;

  function setTapDotRadius(r) {
    dotR = r;
    selectedDot.setAttribute('r', r);
    hoverDot.setAttribute('r', r);
  }

  const selection = createFretboardSelection({ selectedDot, hoverDot });

  const findNoteMarks = createFindNoteMarkHandlers({
    matchLayer,
    cellCenters,
    getTapDotR: () => dotR,
    hideSelected: selection.hideSelected,
    hideHover: selection.hideHover,
    styleRainbowDot: selection.styleRainbowDot,
    clearMatches: () => matchLayer.replaceChildren(),
    clearGuess: selection.clearGuess,
  });

  const trainerTarget = createTrainerTargetDot({
    container,
    tapLayer,
    cellCenters,
    getTapDotR: () => dotR,
  });

  const highlights = createFretboardHighlights({
    guitar,
    cellCenters,
    matchLayer,
    getTapDotR: () => dotR,
    styleRainbowDot: selection.styleRainbowDot,
  });

  const octaveOverlay = createOctaveOverlay({ guitar, cellCenters, octaveLayer });

  const { renderStatsHeatmap } = createStatsHeatmapRenderer(cellCenters, statsLayer, () => dotR);

  const { addHitCell } = createHitCellFactory({
    container,
    guitar,
    interactive,
    cellCenters,
    selection,
    findNoteMarks,
  });

  function shouldAllowStringPin(stringIndex) {
    const mode = container.dataset.mode;
    if (mode !== 'find-note' || container.dataset.findVariant === 'all') {
      return false;
    }

    return (
      typeof stringIndex === 'number' &&
      stringIndex >= 0 &&
      stringIndex < stringCount
    );
  }

  /**
   * Общая маска отключённых струн. Find Fret дополнительно подсвечивает целевую струну,
   * Find note вместо этого гасит неактивные дорожки (`dimLanes`).
   */
  function isTrainerStringEnabled(stringIndex) {
    if (trainerEnabledStrings === null) return true;
    return trainerEnabledStrings.has(stringIndex);
  }

  function syncFretCellCursors() {
    const mode = container.dataset.mode;
    const trainerMode = mode === 'find-note' || mode === 'guess-note';

    for (const cell of container.querySelectorAll('.fret-cell')) {
      if (!trainerMode) {
        cell.style.removeProperty('cursor');
        continue;
      }

      const stringIndex = Number(cell.dataset.string);
      if (!isTrainerStringEnabled(stringIndex)) {
        cell.style.cursor = 'default';
      } else {
        cell.style.removeProperty('cursor');
      }
    }
  }

  function applyStringVisuals(payload, { mode: expectedMode, dimLanes }) {
    const enabledStrings = payload?.enabledStrings;
    if (container.dataset.mode !== expectedMode || !Array.isArray(enabledStrings)) {
      clearStringVisualState?.();
      delete container.dataset.findNoteTargetString;
      trainerEnabledStrings = null;
      syncFretCellCursors();
      return false;
    }

    setDimDisabledLanes?.(dimLanes);

    const enabled = new Set(enabledStrings);
    trainerEnabledStrings = enabled;
    setDisabledStringMask?.(
      Array.from({ length: stringCount }, (_, index) => (enabled.has(index) ? 0 : 1))
    );
    syncFretCellCursors();
    return true;
  }

  function setFindNoteStringVisuals(payload = null) {
    if (!applyStringVisuals(payload, { mode: 'find-note', dimLanes: false })) return;
    setFindNoteTargetString(payload.targetStringIndex ?? null);
  }

  function setGuessNoteStringVisuals(payload = null) {
    setPinnedStringHighlight?.(null);
    delete container.dataset.findNoteTargetString;
    applyStringVisuals(payload, { mode: 'guess-note', dimLanes: true });
  }

  function setFindNoteTargetString(stringIndex) {
    if (!shouldAllowStringPin(stringIndex)) {
      delete container.dataset.findNoteTargetString;
      setPinnedStringHighlight?.(null);
      return;
    }

    container.dataset.findNoteTargetString = String(stringIndex);
    setPinnedStringHighlight?.(stringIndex);
  }

  function syncPinnedStringHighlight() {
    const raw = container.dataset.findNoteTargetString;
    if (raw == null) {
      setPinnedStringHighlight?.(null);
      return;
    }

    const index = Number(raw);
    setFindNoteTargetString(Number.isInteger(index) ? index : null);
  }

  function getCellDetail(string, fret) {
    const cell = cellCenters.find((c) => c.string === string && c.fret === fret);
    return cell
      ? { fret, string, cx: cell.cx, cy: cell.cy, note: getNoteAtFret(guitar, string, fret) }
      : null;
  }

  return {
    addHitCell,
    highlightPitchClass: highlights.highlightPitchClass,
    highlightAllNotes: highlights.highlightAllNotes,
    showOctaveOverlay: octaveOverlay.show,
    hideOctaveOverlay: octaveOverlay.hide,
    onLayoutChange: () => {
      octaveOverlay.onLayoutChange?.();
      trainerTarget.refresh();
      syncPinnedStringHighlight();
      syncFretCellCursors();
    },
    isOctaveOverlayVisible: octaveOverlay.isVisible,
    showFindNoteResult: findNoteMarks.showFindNoteResult,
    markFindNotePosition: findNoteMarks.markFindNotePosition,
    clearGuess: selection.clearGuess,
    clearFindNoteMarks: findNoteMarks.clearFindNoteMarks,
    fadeOutAllFindNoteMarks: findNoteMarks.fadeOutAllFindNoteMarks,
    showTrainerTarget: trainerTarget.show,
    clearTrainerTarget: trainerTarget.clear,
    renderStatsHeatmap,
    setFindNoteTargetString,
    setFindNoteStringVisuals,
    setGuessNoteStringVisuals,
    syncPinnedStringHighlight,
    getCellDetail,
    clearPitchHighlights: highlights.clearMatches,
    setTapDotRadius,
    isTrainerStringEnabled,
  };
}


// ----- js/fretboard-view.js -----

/**
 * @module fretboard-view
 * @description Canvas-рендер грифа (прототип) + SVG hit-слой для интерактива.
 * @depends fretboard-canvas-view, fretboard-view-interaction
 */

let resizeObserver = null;
let activeStage = null;

function attachBoardCursor(wrapper, container, getStage, interactive) {
  function updateCursor(event) {
    const stage = getStage();
    if (!stage) return;

    const trainerMode =
      container?.dataset?.mode === 'find-note' || container?.dataset?.mode === 'guess-note';

    if (!interactive && !trainerMode) {
      wrapper.style.cursor = 'default';
      return;
    }

    const rect = wrapper.getBoundingClientRect();
    const scale = rect.width ? stage.view.cssWidth / rect.width : 1;
    const x = (event.clientX - rect.left) * scale;
    const y = (event.clientY - rect.top) * scale;

    if (trainerMode && stringLabelRowAt(stage.L, stage.geom.SPEC.strings.length, x, y) >= 0) {
      wrapper.style.cursor = 'pointer';
      return;
    }

    if (isPointOnBoard(stage.L, x, y)) {
      if (trainerMode) {
        const row = stringRowAt(stage.L, stage.geom, x, y);
        const enabled =
          row < 0 || container.isTrainerStringEnabled?.(row) !== false;
        wrapper.style.cursor = enabled ? 'pointer' : 'default';
        return;
      }
      wrapper.style.cursor = 'pointer';
      return;
    }

    wrapper.style.cursor = 'default';
  }

  wrapper.addEventListener('pointermove', updateCursor);
  wrapper.addEventListener('pointerleave', () => {
    wrapper.style.cursor = 'default';
  });
}

function disconnectResizeObserver() {
  if (resizeObserver) {
    resizeObserver.disconnect();
    resizeObserver = null;
  }
}

function mountResizeObserver(container, stage, onLayout) {
  disconnectResizeObserver();
  if (typeof ResizeObserver === 'undefined') return;

  resizeObserver = new ResizeObserver(() => {
    const width = container.clientWidth;
    if (!width || Math.abs(width - stage.view.cssWidth) < 1) return;
    const next = stage.repaint(width);
    onLayout(next);
  });
  resizeObserver.observe(container);
}

function renderFretboard(guitar, container, options = {}) {
  const interactive = options.interactive !== false;
  const statsScores = options.statsScores ?? null;
  const cssWidth = container.clientWidth || 960;

  disconnectResizeObserver();
  activeStage?.destroy();
  container.innerHTML = '';

  const stage = renderCanvasStage(guitar, cssWidth);
  activeStage = stage;
  let { L, hitLayout } = stage;

  const wrapper = document.createElement('div');
  wrapper.className = 'fretboard-canvas-stage';

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.classList.add('fretboard-overlay');
  svg.setAttribute('viewBox', `0 0 ${stage.view.cssWidth} ${stage.view.cssHeight}`);
  svg.setAttribute('width', String(stage.view.cssWidth));
  svg.setAttribute('height', String(stage.view.cssHeight));
  svg.setAttribute('role', 'img');
  svg.setAttribute(
    'aria-label',
    statsScores ? UI.statsFretboardLabel : UI.fretboardLabel
  );

  const hitLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  hitLayer.setAttribute('class', 'hit-layer');

  const tapLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  tapLayer.setAttribute('class', 'tap-layer');
  tapLayer.setAttribute('pointer-events', 'none');

  const octaveLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  octaveLayer.setAttribute('class', 'octave-layer');
  octaveLayer.setAttribute('pointer-events', 'none');
  tapLayer.appendChild(octaveLayer);

  const selectedDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  selectedDot.setAttribute('class', 'fret-tap fret-tap-selected');
  selectedDot.setAttribute('r', hitLayout.tapDotR);
  selectedDot.setAttribute('visibility', 'hidden');
  tapLayer.appendChild(selectedDot);

  const hoverDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  hoverDot.setAttribute('class', 'fret-tap fret-tap-hover');
  hoverDot.setAttribute('r', hitLayout.tapDotR);
  hoverDot.setAttribute('visibility', 'hidden');
  tapLayer.appendChild(hoverDot);

  const matchLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  matchLayer.setAttribute('class', 'match-layer');
  matchLayer.setAttribute('pointer-events', 'none');
  tapLayer.appendChild(matchLayer);

  const statsLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  statsLayer.setAttribute('class', 'stats-layer');
  statsLayer.setAttribute('pointer-events', 'none');
  tapLayer.appendChild(statsLayer);

  const cellCenters = [];

  const interaction = attachFretboardInteraction({
    container,
    guitar,
    interactive,
    stringCount: hitLayout.stringCount,
    cellCenters,
    matchLayer,
    tapLayer,
    octaveLayer,
    statsLayer,
    selectedDot,
    hoverDot,
    tapDotR: hitLayout.tapDotR,
    setPinnedStringHighlight: stage.setPinnedStringHighlight,
    setDisabledStringMask: stage.setDisabledStringMask,
    setDimDisabledLanes: stage.setDimDisabledLanes,
    clearStringVisualState: stage.clearStringVisualState,
  });

  const stringLabelHits = createStringLabelHitFactory({
    container,
    getL: () => L,
    stringCount: hitLayout.stringCount,
  });

  function addHitCells(layout) {
    hitLayer.replaceChildren();
    cellCenters.length = 0;

    const { paddingLeft, fretCount, stringCount, stringSpacingAt, fretPositionPx, startX, cellCenterAt } =
      layout;

    for (let f = 1; f <= fretCount; f++) {
      const x1 = paddingLeft + fretPositionPx(f - 1);
      const x2 = paddingLeft + fretPositionPx(f);

      for (let s = 0; s < stringCount; s++) {
        const { cx, cy } = cellCenterAt(s, f);
        const spacing = stringSpacingAt(cx) * 1.08;
        interaction.addHitCell(hitLayer, x1, cy - spacing / 2, x2 - x1, spacing, f, s, cx, cy);
      }
    }

    const openStringRightPad = 16;
    for (let s = 0; s < stringCount; s++) {
      const { cx, cy } = cellCenterAt(s, 0);
      const spacing = stringSpacingAt(cx) * 1.08;
      const openHitX = startX;
      const openHitW = paddingLeft - openHitX + openStringRightPad;
      interaction.addHitCell(
        hitLayer,
        openHitX,
        cy - spacing / 2,
        openHitW,
        spacing,
        0,
        s,
        cx,
        cy
      );
    }
    stringLabelHits.addStringLabelHits(hitLayer);
  }

  addHitCells(hitLayout);

  svg.appendChild(hitLayer);
  svg.appendChild(tapLayer);
  wrapper.appendChild(stage.canvas);
  wrapper.appendChild(svg);
  container.appendChild(wrapper);
  attachBoardCursor(wrapper, container, () => stage, interactive);

  if (statsScores) {
    interaction.renderStatsHeatmap(statsScores);
    container.classList.add('fretboard-stats-view');
  } else {
    container.classList.remove('fretboard-stats-view');
  }

  container.getFretboardHitLayout = () => {
    hitLayout.totalWidth = stage.view.cssWidth;
    return hitLayout;
  };
  container.onFretboardLayoutChange = null;

  mountResizeObserver(container, stage, (next) => {
    L = next.L;
    hitLayout = next.hitLayout;
    svg.setAttribute('viewBox', `0 0 ${next.view.cssWidth} ${next.view.cssHeight}`);
    svg.setAttribute('width', String(next.view.cssWidth));
    svg.setAttribute('height', String(next.view.cssHeight));
    interaction.setTapDotRadius(next.hitLayout.tapDotR);
    addHitCells(hitLayout);
    interaction.onLayoutChange?.();
    container.onFretboardLayoutChange?.();
    if (statsScores) {
      interaction.renderStatsHeatmap(statsScores);
    }
  });

  container.highlightPitchClass = interaction.highlightPitchClass;
  container.highlightAllNotes = interaction.highlightAllNotes;
  container.showOctaveOverlay = interaction.showOctaveOverlay;
  container.hideOctaveOverlay = interaction.hideOctaveOverlay;
  container.isOctaveOverlayVisible = interaction.isOctaveOverlayVisible;
  container.showFindNoteResult = interaction.showFindNoteResult;
  container.markFindNotePosition = interaction.markFindNotePosition;
  container.clearGuess = interaction.clearGuess;
  container.clearFindNoteMarks = interaction.clearFindNoteMarks;
  container.fadeOutAllFindNoteMarks = interaction.fadeOutAllFindNoteMarks;
  container.showTrainerTarget = interaction.showTrainerTarget;
  container.clearTrainerTarget = interaction.clearTrainerTarget;
  container.getCellDetail = interaction.getCellDetail;
  container.clearPitchHighlights = interaction.clearPitchHighlights;
  container.setFindNoteTargetString = interaction.setFindNoteTargetString;
  container.setFindNoteStringVisuals = interaction.setFindNoteStringVisuals;
  container.setGuessNoteStringVisuals = interaction.setGuessNoteStringVisuals;
  container.syncPinnedStringHighlight = interaction.syncPinnedStringHighlight;
  interaction.syncPinnedStringHighlight();
  container.getStringDisabledValue = stage.getStringDisabledValue;
  container.getStringCircleAlpha = stage.getStringCircleAlpha;
  container.updateStatsHeatmap = interaction.renderStatsHeatmap;
  container.getStringHoverFocus = stage.getStringHoverFocus;
  container.isTrainerStringEnabled = interaction.isTrainerStringEnabled;

  return svg;
}

/**
 * @module staff-view
 * @description Рендер ноты на нотном стане.
 * @depends staff
 */

const STAFF_LEFT = 60;
const STAFF_WIDTH = 180;
const NOTE_RX = 8;
const NOTE_RY = 6;
const ACCIDENTAL_OFFSET = NOTE_RX + 8;
const LEDGER_HALF_WIDTH = 16;
const PADDING_X = 18;
const PADDING_Y = 18;

function getLedgerYs(noteY, staffTop, staffBottom) {
  const ledgerYs = [];
  if (noteY < staffTop - 1) {
    for (let y = staffTop - LINE_SPACING; y >= noteY - 0.5; y -= LINE_SPACING) {
      ledgerYs.push(y);
    }
  } else if (noteY > staffBottom + 1) {
    for (let y = staffBottom + LINE_SPACING; y <= noteY + 0.5; y += LINE_SPACING) {
      ledgerYs.push(y);
    }
  }
  return ledgerYs;
}

function getViewBounds(noteY, ledgerYs, staffBottom) {
  const yValues = [STAFF_TOP, staffBottom, noteY - NOTE_RY, noteY + NOTE_RY, ...ledgerYs];
  const minY = Math.min(...yValues) - PADDING_Y;
  const maxY = Math.max(...yValues) + PADDING_Y;
  const minX = -4;
  const maxX = STAFF_LEFT + STAFF_WIDTH + PADDING_X;

  return {
    minX,
    minY,
    width: maxX - minX,
    height: maxY - minY,
  };
}

function renderNoteOnStaff(container, pitchName) {
  const match = pitchName.match(/^([A-G])(#?)(\d)$/);
  if (!match) {
    container.innerHTML = '';
    return;
  }

  const [, letter, accidental, octaveStr] = match;
  const soundingOctave = parseInt(octaveStr, 10);
  const staffOctave = soundingOctave + 1;
  const staffBottom = STAFF_TOP + LINE_SPACING * 4;
  const middleLineY = STAFF_TOP + LINE_SPACING * 2;
  const noteX = STAFF_LEFT + STAFF_WIDTH * 0.58;

  const steps = stepsFromB4(letter, staffOctave);
  const noteY = middleLineY - steps * (LINE_SPACING / 2);
  const ledgerYs = getLedgerYs(noteY, STAFF_TOP, staffBottom);
  const view = getViewBounds(noteY, ledgerYs, staffBottom);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `${view.minX} ${view.minY} ${view.width} ${view.height}`);
  svg.setAttribute('class', 'note-staff');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.setAttribute('aria-hidden', 'true');

  for (let i = 0; i < 5; i++) {
    const y = STAFF_TOP + i * LINE_SPACING;
    svg.appendChild(staffLine(STAFF_LEFT, y, STAFF_WIDTH));
  }

  svg.appendChild(clef(STAFF_LEFT - 4, STAFF_TOP - 8));

  for (const y of ledgerYs) {
    svg.appendChild(staffLine(noteX - LEDGER_HALF_WIDTH, y, LEDGER_HALF_WIDTH * 2));
  }

  if (accidental) {
    svg.appendChild(sharp(noteX - ACCIDENTAL_OFFSET, noteY));
  }

  svg.appendChild(noteHead(noteX, noteY));

  container.innerHTML = '';
  container.appendChild(svg);
}

function staffLine(x, y, width) {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x);
  line.setAttribute('y1', y);
  line.setAttribute('x2', x + width);
  line.setAttribute('y2', y);
  line.setAttribute('class', 'staff-line');
  return line;
}

function clef(x, y) {
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', x);
  text.setAttribute('y', y + LINE_SPACING * 4.4);
  text.setAttribute('class', 'staff-clef');
  text.textContent = '𝄞';
  return text;
}

function sharp(x, y) {
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', x);
  text.setAttribute('y', y + 5);
  text.setAttribute('class', 'staff-accidental');
  text.textContent = '♯';
  return text;
}

function noteHead(x, y) {
  const note = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
  note.setAttribute('cx', x);
  note.setAttribute('cy', y);
  note.setAttribute('rx', NOTE_RX);
  note.setAttribute('ry', NOTE_RY);
  note.setAttribute('class', 'staff-note');
  return note;
}

/**
 * @module mode-fret-note
 * @description Режим «Что за нота?» — клик по ладу показывает ноту и стан.
 * @depends config, note, fretboard, staff-view, note-chip
 */

function createFretNoteMode(deps) {
  const { elements } = deps;

  function showSelection(fret, string, note) {
    const parsed = parseNote(note);

    elements.selectionPanel.hidden = false;
    syncNoteChipWidth(elements.fretboardSection);
    elements.detailNote.innerHTML = parsed
      ? buildNoteChipGridHtml(parsed.pitch)
      : `<span>${note}</span>`;
    elements.detailOctave.textContent = parsed ? getOctaveName(parsed.octave) : '—';
    elements.detailPosition.textContent = formatPosition(GUITAR, string, fret);

    if (parsed) {
      renderNoteOnStaff(elements.staffContainer, parsed.full);
    } else {
      elements.staffContainer.innerHTML = '';
    }
  }

  function clearSelection() {
    elements.selectionPanel.hidden = true;
    elements.detailNote.innerHTML = '';
    elements.detailOctave.textContent = '';
    elements.detailPosition.textContent = '';
    elements.staffContainer.innerHTML = '';
    elements.fretboardContainer.clearPitchHighlights?.();
  }

  function onFretClick(detail) {
    showSelection(detail.fret, detail.string, detail.note);
  }

  function onOutsideClick() {
    clearSelection();
  }

  return {
    enter() {
      clearSelection();
    },
    leave() {
      clearSelection();
    },
    onFretClick,
    onOutsideClick,
  };
}


// ----- js/mode-note-frets.js -----

/**
 * @module mode-note-frets
 * @description Режим «Октавные точки» — выбор pitch class подсвечивает позиции на грифе.
 * @depends note, note-chip
 */

function createNoteFretsMode(deps) {
  const { elements } = deps;

  let selectedPitchClass = null;
  let showAllNotes = false;
  let showAllOctaves = false;

  function buildPalette() {
    elements.notePalette.innerHTML = PITCH_CLASSES.map((pitchClass) =>
      buildNoteChipHtml(pitchClass, { interactive: true })
    ).join('');

    elements.notePalette.querySelectorAll('.note-palette-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        selectPitchClass(btn.dataset.pitch);
      });
    });
  }

  function updatePaletteUI() {
    elements.showAllNotesBtn.classList.toggle('active', showAllNotes);
    elements.showAllNotesBtn.setAttribute('aria-pressed', String(showAllNotes));
    elements.showAllOctavesBtn?.classList.toggle('active', showAllOctaves);
    elements.showAllOctavesBtn?.setAttribute('aria-pressed', String(showAllOctaves));

    elements.notePalette.querySelectorAll('.note-palette-btn').forEach((btn) => {
      const pitch = btn.dataset.pitch;
      const isActive = !showAllNotes && pitch === selectedPitchClass;
      btn.classList.toggle('active', isActive);
      btn.classList.toggle('dimmed', !showAllNotes && selectedPitchClass !== null && !isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });
  }

  function selectPitchClass(pitchClass) {
    showAllNotes = false;
    selectedPitchClass = pitchClass;
    updatePaletteUI();
    elements.fretboardContainer.highlightPitchClass?.(pitchClass);
  }

  function showAllNotesOnFretboard() {
    showAllNotes = true;
    selectedPitchClass = null;
    updatePaletteUI();
    elements.fretboardContainer.highlightAllNotes?.();
  }

  function hideOctaveOverlay() {
    showAllOctaves = false;
    elements.fretboardContainer.hideOctaveOverlay?.();
  }

  function clearSelection() {
    selectedPitchClass = null;
    showAllNotes = false;
    elements.fretboardContainer.clearPitchHighlights?.();
    updatePaletteUI();
  }

  function showOctaveOverlay() {
    showAllOctaves = true;
    updatePaletteUI();
    elements.fretboardContainer.showOctaveOverlay?.();
  }

  function hideOctaveOverlayState() {
    hideOctaveOverlay();
    updatePaletteUI();
  }

  function onFretClick(detail) {
    selectPitchClass(getPitchClass(detail.note));
  }

  function onOutsideClick() {
    clearSelection();
  }

  return {
    enter() {
      elements.notePalettePanel.hidden = false;
      syncNoteChipWidth(elements.fretboardSection);
      buildPalette();
      updatePaletteUI();
      if (showAllOctaves) {
        elements.fretboardContainer.showOctaveOverlay?.();
      }
    },
    leave() {
      elements.notePalettePanel.hidden = true;
      hideOctaveOverlay();
      clearSelection();
    },
    onFretClick,
    onOutsideClick,
    toggleShowAll() {
      if (showAllNotes) {
        clearSelection();
      } else {
        showAllNotesOnFretboard();
      }
    },
    toggleShowAllOctaves() {
      if (showAllOctaves) {
        hideOctaveOverlayState();
      } else {
        showOctaveOverlay();
      }
    },
  };
}


// ----- js/heatmap-board.js -----

/**
 * @module heatmap-board
 * @description Flat stats heatmap board (port of prototype/heatmap/heatmap-board.js).
 */

const heatmapBoard = (() => {
  const THEME = {
    board: '#e2ded8',
    boardEdge: 'rgba(28, 25, 23, 0.14)',
    lane: 'rgba(28, 25, 23, 0.09)',
    fret: 'rgba(28, 25, 23, 0.13)',
    nut: 'rgba(28, 25, 23, 0.38)',
    inlay: 'rgba(28, 25, 23, 0.11)',
    label: 'rgba(87, 83, 78, 0.88)',
    labelStrong: 'rgba(28, 25, 23, 0.92)',
    openZone: 'rgba(180, 83, 10, 0.05)',
  };

  function nutCenterMm(geom) {
    return -geom.SPEC.nutDepthMm / 2;
  }

  function cornerRadius(L) {
    const width = L.edgeY(L.endMm, 1) - L.edgeY(L.endMm, -1);
    return Math.min(7 * L.pxPerMm, width * 0.22);
  }

  function boardPath(ctx, L) {
    const r = cornerRadius(L);
    const xL = L.startX;
    const xR = L.endX;
    const yTL = L.edgeY(L.startMm, -1);
    const yBL = L.edgeY(L.startMm, 1);
    const yTR = L.edgeY(L.endMm, -1);
    const yBR = L.edgeY(L.endMm, 1);

    ctx.beginPath();
    ctx.moveTo(xL + r, yTL);
    ctx.lineTo(xR - r, yTR);
    ctx.quadraticCurveTo(xR, yTR, xR, yTR + r);
    ctx.lineTo(xR, yBR - r);
    ctx.quadraticCurveTo(xR, yBR, xR - r, yBR);
    ctx.lineTo(xL + r, yBL);
    ctx.quadraticCurveTo(xL, yBL, xL, yBL - r);
    ctx.lineTo(xL, yTL + r);
    ctx.quadraticCurveTo(xL, yTL, xL + r, yTL);
    ctx.closePath();
  }

  function openZoneEndMm(geom) {
    return nutCenterMm(geom);
  }

  function openZone(ctx, L, geom) {
    const endMm = openZoneEndMm(geom);
    const endX = L.x(endMm);

    ctx.save();
    boardPath(ctx, L);
    ctx.clip();

    ctx.beginPath();
    ctx.moveTo(L.startX, L.edgeY(L.startMm, -1));
    ctx.lineTo(endX, L.edgeY(endMm, -1));
    ctx.lineTo(endX, L.edgeY(endMm, 1));
    ctx.lineTo(L.startX, L.edgeY(L.startMm, 1));
    ctx.closePath();
    ctx.fillStyle = THEME.openZone;
    ctx.fill();
    ctx.restore();
  }

  function surface(ctx, L, geom) {
    ctx.save();
    boardPath(ctx, L);
    ctx.fillStyle = THEME.board;
    ctx.fill();
    ctx.restore();

    openZone(ctx, L, geom);

    ctx.save();
    boardPath(ctx, L);
    ctx.strokeStyle = THEME.boardEdge;
    ctx.lineWidth = Math.max(1, 0.4 * L.pxPerMm);
    ctx.stroke();
    ctx.restore();
  }

  function frets(ctx, L, geom) {
    ctx.save();
    boardPath(ctx, L);
    ctx.clip();

    for (let n = 1; n <= geom.SPEC.frets; n += 1) {
      const x = L.fretX(n);
      const mm = geom.fretMm(n);

      ctx.beginPath();
      ctx.moveTo(x, L.edgeY(mm, -1));
      ctx.lineTo(x, L.edgeY(mm, 1));
      ctx.strokeStyle = THEME.fret;
      ctx.lineWidth = Math.max(1, 0.34 * L.pxPerMm);
      ctx.stroke();
    }
    ctx.restore();
  }

  function nut(ctx, L, geom) {
    const x = L.x(nutCenterMm(geom));
    ctx.beginPath();
    ctx.moveTo(x, L.edgeY(0, -1));
    ctx.lineTo(x, L.edgeY(0, 1));
    ctx.strokeStyle = THEME.nut;
    ctx.lineWidth = Math.max(1.5, 1.1 * L.pxPerMm);
    ctx.stroke();
  }

  function lanes(ctx, L, geom) {
    const strings = geom.SPEC.strings;

    ctx.save();
    boardPath(ctx, L);
    ctx.clip();
    ctx.strokeStyle = THEME.lane;

    for (let row = 0; row < strings.length; row += 1) {
      ctx.beginPath();
      ctx.moveTo(L.startX, L.stringY(row, L.startMm));
      ctx.lineTo(L.endX, L.stringY(row, L.endMm));
      ctx.lineWidth = Math.max(0.75, strings[row].dMm * 0.5 * L.pxPerMm);
      ctx.stroke();
    }
    ctx.restore();
  }

  function inlays(ctx, L, geom) {
    const spec = geom.SPEC;
    const marks = spec.inlaySingle.slice();
    if (!marks.includes(spec.inlayDouble)) marks.push(spec.inlayDouble);

    ctx.save();
    ctx.fillStyle = THEME.inlay;

    for (const fret of marks) {
      const x = L.fretCenterX(fret);
      const mm = geom.fretCenterMm(fret);
      const half = (L.edgeY(mm, 1) - L.edgeY(mm, -1)) / 2;
      const y = L.edgeY(mm, -1) + half;
      const r = Math.max(1.5, 0.85 * L.pxPerMm);

      if (fret === spec.inlayDouble) {
        ctx.beginPath();
        ctx.arc(x, y - half * 0.62, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y + half * 0.62, r, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }

      ctx.beginPath();
      ctx.arc(x, y + half * 0.62, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawNumberBadge(ctx, {
    x,
    y,
    k,
    text,
    paletteKey,
    marked = false,
    paletteRing = false,
    filledStrong = false,
  }) {
    const r = 3.6 * k;
    const accentRing = heatmapPaletteAccentRgba(paletteKey, paletteRing ? 0.48 : 0.62);
    const accentFill = heatmapPaletteAccentRgba(paletteKey, marked ? 0.1 : 0.16);

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = marked || filledStrong ? 'rgba(255, 255, 255, 0.94)' : 'rgba(255, 255, 255, 0.82)';
    ctx.fill();

    if (marked || filledStrong) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = accentFill;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = marked || paletteRing || filledStrong ? accentRing : THEME.boardEdge;
    ctx.lineWidth = Math.max(1, (marked || paletteRing || filledStrong ? 0.5 : 0.42) * k);
    ctx.stroke();

    ctx.fillStyle = marked || filledStrong ? THEME.labelStrong : THEME.label;
    ctx.fillText(String(text), x, y);
  }

  function fretNumbers(ctx, L, geom, paletteKey = 'mint') {
    const spec = geom.SPEC;
    const k = L.pxPerMm;
    const r = 3.6 * k;
    const cy = L.edgeY(geom.boardLenMm(), 1) + r + 0.9 * k;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${(3.4 * k).toFixed(1)}px -apple-system, "SF Pro Text", system-ui, sans-serif`;

    for (let n = 0; n <= spec.frets; n += 1) {
      const marked = n === spec.inlayDouble || spec.inlaySingle.includes(n);
      const x = n === 0 ? (L.startX + L.x(0)) / 2 : L.fretCenterX(n);
      drawNumberBadge(ctx, {
        x,
        y: cy,
        k,
        text: n,
        paletteKey,
        marked,
      });
    }
    ctx.restore();
  }

  function stringLabels(ctx, L, geom, paletteKey = 'mint') {
    const strings = geom.SPEC.strings;
    const k = L.pxPerMm;
    const x = L.startX - 5.5 * k;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${(3.4 * k).toFixed(1)}px -apple-system, "SF Pro Text", system-ui, sans-serif`;

    for (let row = 0; row < strings.length; row += 1) {
      drawNumberBadge(ctx, {
        x,
        y: L.stringY(row, L.startMm),
        k,
        text: strings[row].num,
        paletteKey,
        filledStrong: true,
      });
    }
    ctx.restore();
  }

  function draw(ctx, L, geom, options = {}) {
    const paletteKey = options.palette ?? 'mint';
    surface(ctx, L, geom);
    lanes(ctx, L, geom);
    frets(ctx, L, geom);
    inlays(ctx, L, geom);
    nut(ctx, L, geom);
    fretNumbers(ctx, L, geom, paletteKey);
    stringLabels(ctx, L, geom, paletteKey);
  }

  return { draw, THEME };
})();

function drawHeatmapBoard(ctx, L, geom, options = {}) {
  heatmapBoard.draw(ctx, L, geom, options);
}


// ----- js/heatmap-dots.js -----

/**
 * @module heatmap-dots
 * @description Score dots for stats heatmap (prototype port).
 */

/**
 * iPad Safari не рисует canvas `fillText` со `system-ui` / `-apple-system`.
 * Helvetica есть на iOS и desktop и даёт видимые цифры внутри кружков.
 */
const CANVAS_LABEL_FONT_FAMILY = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const LABEL_MIN_FONT_PX = 10;

function heatmapLabelFont(fontSize) {
  return `bold ${fontSize}px ${CANVAS_LABEL_FONT_FAMILY}`;
}

function heatmapLabelFontSize(radius, label = '') {
  const cap = String(label).length > 2 ? 11 : 12;
  const fromRadius = Number.isFinite(radius) ? radius * 1.2 : LABEL_MIN_FONT_PX;
  return Math.max(LABEL_MIN_FONT_PX, Math.min(Math.round(fromRadius), cap));
}

const heatmapDots = (() => {
  function cellCenterMm(geom, fret) {
    return fret === 0 ? geom.boardStartMm() / 2 : geom.fretCenterMm(fret);
  }

  function baseRadius(L, geom) {
    const lastFret = geom.SPEC.frets;
    const spanMm = geom.fretMm(lastFret) - geom.fretMm(lastFret - 1);
    const gapMm = geom.spreadMm(geom.fretMm(lastFret)) / (geom.SPEC.strings.length - 1);
    return Math.min(spanMm * 0.4, gapMm * 0.37) * L.pxPerMm;
  }

  function cells(L, geom) {
    const list = [];
    const radius = baseRadius(L, geom);

    for (let row = 0; row < geom.SPEC.strings.length; row += 1) {
      for (let fret = 0; fret <= geom.SPEC.frets; fret += 1) {
        const mm = cellCenterMm(geom, fret);
        list.push({
          row,
          fret,
          cx: L.x(mm),
          cy: L.stringY(row, mm),
          r: radius,
        });
      }
    }
    return list;
  }

  function labelTextColor(style) {
    if (style.empty || !style.color) return 'rgba(255, 255, 252, 0.96)';
    const [r, g, b] = style.color;
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.62 ? 'rgba(18, 24, 32, 0.9)' : 'rgba(255, 255, 252, 0.96)';
  }

  function drawLabel(ctx, cell, style, label) {
    if (!label || style.empty) return;

    const radius = cell.r * style.radiusScale;
    const fontSize = heatmapLabelFontSize(radius, label);
    const x = Math.round(cell.cx);
    const y = Math.round(cell.cy);

    ctx.font = heatmapLabelFont(fontSize);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, fontSize * 0.16);
    ctx.strokeStyle = 'rgba(18, 24, 32, 0.45)';
    ctx.strokeText(label, x, y);
    ctx.fillStyle = labelTextColor(style);
    ctx.fillText(label, x, y);
  }

  function drawDot(ctx, cell, style, label = null) {
    const r = cell.r * style.radiusScale;

    if (style.glow) {
      const glow = ctx.createRadialGradient(cell.cx, cell.cy, r * 0.2, cell.cx, cell.cy, r * 2.1);
      glow.addColorStop(0, style.glow);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cell.cx, cell.cy, r * 2.1, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(cell.cx, cell.cy, r, 0, Math.PI * 2);
    ctx.fillStyle = style.fill;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cell.cx, cell.cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = style.ring;
    ctx.lineWidth = Math.max(1, r * (style.empty ? 0.1 : 0.14));
    if (style.empty) ctx.setLineDash([r * 0.5, r * 0.45]);
    ctx.stroke();
    ctx.setLineDash([]);

    drawLabel(ctx, cell, style, label);
  }

  function draw(ctx, L, geom, getScore, options = {}) {
    const list = options.cells || cells(L, geom);
    const getLabel = options.getLabel ?? null;

    ctx.save();
    for (const cell of list) {
      const score = getScore(cell.row, cell.fret);
      const style = dotStyle(score, options.palette);
      const label = getLabel ? getLabel(cell.row, cell.fret, score, style) : null;
      drawDot(ctx, cell, style, label);
    }
    ctx.restore();
  }

  return { draw, cells };
})();

function formatHeatmapDotLabel(weight) {
  const value = Number(weight);
  if (!Number.isFinite(value)) return null;
  return String(Math.round(value));
}

function heatmapCells(L, geom) {
  return heatmapDots.cells(L, geom);
}

function drawHeatmapDots(ctx, L, geom, getScore, options = {}) {
  heatmapDots.draw(ctx, L, geom, getScore, options);
}

function heatmapLabelsForScores(positionScores) {
  const labels = {};
  for (const [key, entry] of positionScores ?? []) {
    if (entry?.integralScore === undefined || entry?.integralScore === null) continue;
    labels[key] = formatHeatmapDotLabel(entry.integralScore);
  }
  return labels;
}


// ----- js/heatmap-view.js -----

/**
 * @module heatmap-view
 * @description Canvas host for the stats heatmap (prototype port).
 */

const HEATMAP_PAD = {
  left: CANVAS_PAD.left,
  right: CANVAS_PAD.right,
  top: 5,
  bottom: 12,
};

const heatmapView = (() => {
  function metrics(geom, cssWidth) {
    const startMm = geom.boardStartMm();
    const endMm = geom.boardLenMm();
    const maxWmm = geom.boardWidthMm(endMm);
    const totalWmm = HEATMAP_PAD.left + (endMm - startMm) + HEATMAP_PAD.right;
    const totalHmm = HEATMAP_PAD.top + maxWmm + HEATMAP_PAD.bottom;
    const pxPerMm = cssWidth / totalWmm;

    return {
      pxPerMm,
      nutX: (HEATMAP_PAD.left - startMm) * pxPerMm,
      axisY: (HEATMAP_PAD.top + maxWmm / 2) * pxPerMm,
      cssWidth,
      cssHeight: totalHmm * pxPerMm,
    };
  }

  function createHeatmap({ canvas, geom, palette = 'mint', getScore = () => null, getLabel = null }) {
    const state = { palette, getScore, getLabel };

    let ctx = null;
    let view = null;
    let L = null;
    let cellList = [];

    function paint() {
      if (!ctx) return;
      ctx.clearRect(0, 0, view.cssWidth, view.cssHeight);
      drawHeatmapBoard(ctx, L, geom, { palette: state.palette });
      drawHeatmapDots(ctx, L, geom, state.getScore, {
        palette: state.palette,
        cells: cellList,
        getLabel: state.getLabel,
      });
    }

    function render() {
      const host = canvas.parentElement;
      const cssWidth = host ? host.clientWidth : 0;
      if (!cssWidth) return;

      const dpr = Math.min(3, window.devicePixelRatio || 1);
      view = metrics(geom, cssWidth);

      canvas.width = Math.round(view.cssWidth * dpr);
      canvas.height = Math.round(view.cssHeight * dpr);
      canvas.style.width = `${view.cssWidth}px`;
      canvas.style.height = `${view.cssHeight}px`;

      ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      L = geom.layout(view);
      cellList = heatmapCells(L, geom);
      paint();
    }

    function setScores(nextProvider) {
      if (typeof nextProvider === 'function') {
        state.getScore = nextProvider;
        state.getLabel = null;
      } else {
        state.getScore = nextProvider?.getScore ?? (() => null);
        state.getLabel = nextProvider?.getLabel ?? null;
      }
      paint();
    }

    function setPalette(nextPalette) {
      state.palette = nextPalette;
      paint();
    }

    function observeResize() {
      let scheduled = false;
      window.addEventListener('resize', () => {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => {
          scheduled = false;
          render();
        });
      });
    }

    return {
      render,
      setScores,
      setPalette,
      observeResize,
    };
  }

  return { createHeatmap, metrics };
})();

function createHeatmapView(config) {
  return heatmapView.createHeatmap(config);
}

function heatmapMetrics(geom, cssWidth) {
  return heatmapView.metrics(geom, cssWidth);
}

/**
 * @module stats-fretboard-view
 * @description Canvas heatmap статистики Find Fret (отдельно от интерактивного грифа).
 * @depends config, find-note-stats, heatmap-geometry, heatmap-view, heatmap-scale
 */

const STATS_HEATMAP_ARIA_LABEL = 'Note guess statistics on the fretboard';

let heatmapInstance = null;
let currentPalette = 'mint';
let paletteControlsBound = false;
let paletteRootEl = null;
let legendBarEl = null;

function positionScoresToHeatmapProvider(positionScores) {
  return {
    getScore(row, fret) {
      const entry = positionScores.get(`${row}:${fret}`);
      if (!entry) return null;
      const strength = entry.heatmapStrength ?? entry.normalized ?? 0;
      const score = entry.integralScore ?? strength * 100;
      return score;
    },
    getLabel(row, fret, score) {
      if (score === null || score === undefined) return null;
      const entry = positionScores.get(`${row}:${fret}`);
      if (!entry || entry.integralScore === undefined || entry.integralScore === null) {
        return null;
      }
      return formatHeatmapDotLabel(entry.integralScore);
    },
  };
}

function syncPaletteUi() {
  if (legendBarEl) {
    legendBarEl.style.background = cssGradient(currentPalette);
  }
  paletteRootEl?.querySelectorAll('[data-palette]').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.palette === currentPalette);
  });
}

function setStatsHeatmapPalette(paletteKey) {
  if (!heatmapPaletteKeys().includes(paletteKey)) return;
  currentPalette = paletteKey;
  heatmapInstance?.setPalette(paletteKey);
  syncPaletteUi();
}

function getStatsHeatmapPalette() {
  return currentPalette;
}

function initStatsHeatmapPaletteControls({ paletteRoot, legendBar, onPaletteChange } = {}) {
  paletteRootEl = paletteRoot ?? paletteRootEl;
  legendBarEl = legendBar ?? legendBarEl;
  syncPaletteUi();

  if (!paletteRootEl || paletteControlsBound) return;
  paletteControlsBound = true;

  paletteRootEl.addEventListener('click', (event) => {
    const button = event.target.closest('[data-palette]');
    if (!button || !paletteRootEl.contains(button)) return;
    setStatsHeatmapPalette(button.dataset.palette);
    onPaletteChange?.(button.dataset.palette);
  });
}

function getStatsHeatmapScoredCount(container) {
  const canvas = container?.querySelector?.('canvas') ?? container;
  if (!canvas?.dataset) return -1;
  const value = Number(canvas.dataset.scoredCells);
  return Number.isFinite(value) ? value : -1;
}

function renderFindNoteStatsFretboard(container, positionScores) {
  if (!container) return;

  const scores = positionScores ?? new Map();
  let canvas = container.querySelector('canvas');

  if (!canvas) {
    container.replaceChildren();
    canvas = document.createElement('canvas');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', STATS_HEATMAP_ARIA_LABEL);
    container.appendChild(canvas);

    const geom = createHeatmapGeom(GUITAR);
    heatmapInstance = createHeatmapView({ canvas, geom, palette: currentPalette });
    heatmapInstance.observeResize();
    heatmapInstance.render();
  }

  heatmapInstance.setPalette(currentPalette);
  heatmapInstance.setScores(positionScoresToHeatmapProvider(scores));
  heatmapInstance.render();
  canvas.dataset.scoredCells = String(scores.size);
}

async function refreshFindNoteStatsFretboard(container, { inputMode, variant } = {}) {
  const scores = await buildFindNoteStatsHeatmap({ inputMode, variant });
  renderFindNoteStatsFretboard(container, scores);
  return scores;
}

/**
 * @module trainer-stats-panel
 * @description Общая панель статистики тренажёров: видимость, heatmap, палитра, сброс.
 * @depends stats-fretboard-view, ui-strings
 */

/**
 * @param {object} options
 * @param {Function} options.isVisible показывать ли панель для текущего режима
 * @param {Function} options.loadScores async () => Map|null — свежие очки позиций
 * @param {Function} options.applyScores (Map|null) => void — записать очки в состояние тренажёра
 * @param {Function} options.getScores () => Map|null — очки для отрисовки
 * @param {boolean} [options.renderEmptyScores] рисовать ли heatmap при пустых очках
 *   (Find note так очищает панель после сброса; Find Fret — нет)
 * @param {Function} [options.onSyncControls] дополнительная синхронизация (например, кнопка log)
 * @param {Function} [options.refreshLogIfOpen] async — обновить открытую панель log
 */
function createTrainerStatsPanel({
  elements,
  isVisible,
  loadScores,
  applyScores,
  getScores,
  renderEmptyScores = false,
  onSyncControls,
  refreshLogIfOpen,
  onHeatmapPaletteChange,
}) {
  function shouldShowStatsPanel() {
    return isVisible();
  }

  function setPanelHidden(hidden) {
    if (elements.findNoteStatsPanel) {
      elements.findNoteStatsPanel.hidden = hidden;
    }
    if (elements.findNoteStatsResetBtn) {
      elements.findNoteStatsResetBtn.hidden = hidden;
    }
  }

  function syncStatsControls() {
    onSyncControls?.();
    setPanelHidden(!shouldShowStatsPanel());
  }

  function renderStatsHeatmap() {
    if (!elements.findNoteStatsFretboard) return;

    const scores = getScores();
    if (!scores && !renderEmptyScores) return;

    renderFindNoteStatsFretboard(elements.findNoteStatsFretboard, scores);
  }

  async function refreshStatsCache() {
    try {
      applyScores(await loadScores());
    } catch (error) {
      console.error(error);
      applyScores(null);
    }
  }

  async function syncStatsPanel() {
    syncStatsControls();
    if (!shouldShowStatsPanel()) return;
    await refreshStatsCache();
    renderStatsHeatmap();
  }

  async function refreshStatsPanelAfterSave() {
    await refreshStatsCache();
    if (shouldShowStatsPanel()) {
      renderStatsHeatmap();
    }
    await refreshLogIfOpen?.();
  }

  function initPaletteControls() {
    initStatsHeatmapPaletteControls({
      paletteRoot: elements.findNoteStatsPalettes,
      legendBar: elements.findNoteStatsLegendBar,
      onPaletteChange: onHeatmapPaletteChange,
    });
  }

  function confirmReset() {
    return window.confirm(UI.statsResetConfirm);
  }

  function hidePanel() {
    setPanelHidden(true);
  }

  return {
    shouldShowStatsPanel,
    syncStatsControls,
    renderStatsHeatmap,
    refreshStatsCache,
    syncStatsPanel,
    refreshStatsPanelAfterSave,
    initPaletteControls,
    confirmReset,
    hidePanel,
  };
}

/**
 * @module trainer-pause-controller
 * @description Общая пауза тренажёров: кнопка, aria, класс на body, подпись progress.
 * @depends ui-strings
 */

const PAUSED_BODY_CLASS = 'find-note-paused';

/**
 * @param {object} options
 * @param {HTMLElement|null} options.pauseButton
 * @param {HTMLElement|null} options.progressEl
 * @param {Function} options.isPanelVisible видна ли панель режима
 * @param {boolean} [options.hideProgressWhenRunning] скрывать progress при снятии паузы
 *   (Find Fret прячет его сам в `refreshUI`, поэтому там `false`)
 * @param {Function} [options.onPauseChanged]
 */
function createTrainerPauseController({
  pauseButton,
  progressEl,
  isPanelVisible,
  hideProgressWhenRunning = false,
  onPauseChanged,
}) {
  let paused = false;
  let uiSnapshot = null;
  let buttonBound = false;

  function isPaused() {
    return paused;
  }

  function syncPauseUI({ force = false } = {}) {
    const showPause = isPanelVisible();
    const snapshot = `${showPause}:${paused}`;
    if (!force && snapshot === uiSnapshot) return;
    uiSnapshot = snapshot;

    if (pauseButton) {
      pauseButton.hidden = !showPause;
      pauseButton.classList.toggle('active', paused);
      pauseButton.setAttribute('aria-pressed', String(paused));
      pauseButton.setAttribute('aria-label', paused ? UI.resumeLabel : UI.pauseLabel);
      pauseButton.title = paused ? UI.resumeLabel : UI.pauseLabel;
    }

    document.body.classList.toggle(PAUSED_BODY_CLASS, paused);

    if (!progressEl) return;

    if (paused) {
      progressEl.hidden = false;
      progressEl.textContent = UI.pausedLabel;
    } else if (hideProgressWhenRunning) {
      progressEl.hidden = true;
      progressEl.textContent = '';
    }
  }

  /** @returns {boolean} изменилось ли состояние */
  function setPaused(next) {
    const value = Boolean(next);
    if (paused === value) return false;

    paused = value;
    onPauseChanged?.(paused);
    syncPauseUI({ force: true });
    return true;
  }

  function bindButton() {
    if (buttonBound || !pauseButton) return;
    buttonBound = true;
    pauseButton.addEventListener('click', () => setPaused(!paused));
  }

  function clearPausedBodyClass() {
    document.body.classList.remove(PAUSED_BODY_CLASS);
  }

  return { isPaused, setPaused, syncPauseUI, bindButton, clearPausedBodyClass };
}


// ----- js/pitch-tuning.js -----

/**
 * @module pitch-tuning
 * @description Guitar pitch math for microphone listen mode.
 * @depends config, note, fretboard
 */

const A4_HZ = 440;
const A4_MIDI = 69;

function midiToFreq(midi) {
  return A4_HZ * 2 ** ((midi - A4_MIDI) / 12);
}

function freqToMidi(freq) {
  return A4_MIDI + 12 * Math.log2(freq / A4_HZ);
}

function noteLabel(midi) {
  const rounded = Math.round(midi);
  const octave = Math.floor(rounded / 12) - 1;
  return `${PITCH_CLASSES[((rounded % 12) + 12) % 12]}${octave}`;
}

function pitchClassFromMidi(midi) {
  return PITCH_CLASSES[((Math.round(midi) % 12) + 12) % 12];
}

function openMidiForString(guitar, stringIndex) {
  const openNote = guitar.tuning[getTuningIndex(guitar, stringIndex)];
  const frequency = noteToFrequency(openNote);
  if (!frequency) return null;
  return freqToMidi(frequency);
}

function stringBand(guitar, stringIndex, maxFret = guitar.frets, marginSemitones = 0.7) {
  const openMidi = openMidiForString(guitar, stringIndex);
  if (openMidi === null) {
    return { fMin: 0, fMax: 0 };
  }

  return {
    fMin: midiToFreq(openMidi - marginSemitones),
    fMax: midiToFreq(openMidi + maxFret + marginSemitones),
  };
}

function fretOnString(guitar, stringIndex, freq) {
  const openMidi = openMidiForString(guitar, stringIndex);
  if (openMidi === null) {
    return { fret: null, cents: 0, inRange: false };
  }

  const midi = freqToMidi(freq);
  const exactFret = midi - openMidi;
  const fret = Math.round(exactFret);
  return {
    fret,
    cents: Math.round((exactFret - fret) * 100),
    inRange: fret >= 0 && fret <= guitar.frets,
  };
}


// ----- js/pitch-mic.js -----

/**
 * @module pitch-mic
 * @description Microphone capture: raw time-domain frames plus RMS level.
 * @depends none
 */

function createMicInput({ bufferSize = 4096 } = {}) {
  let audioContext = null;
  let stream = null;
  let analyser = null;
  let source = null;
  const frame = new Float32Array(bufferSize);

  async function start() {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
      },
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    await audioContext.resume();

    analyser = audioContext.createAnalyser();
    analyser.fftSize = bufferSize;
    analyser.smoothingTimeConstant = 0;

    source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);

    return { sampleRate: audioContext.sampleRate, bufferSize };
  }

  function read() {
    if (!analyser) return null;
    analyser.getFloatTimeDomainData(frame);

    let sumSquares = 0;
    for (let i = 0; i < frame.length; i += 1) sumSquares += frame[i] * frame[i];

    return { frame, rms: Math.sqrt(sumSquares / frame.length) };
  }

  function stop() {
    source?.disconnect();
    stream?.getTracks().forEach((track) => track.stop());
    audioContext?.close();
    audioContext = null;
    analyser = null;
    source = null;
    stream = null;
  }

  return { start, stop, read };
}


// ----- js/pitch-yin.js -----

/**
 * @module pitch-yin
 * @description YIN pitch detection restricted to a frequency band.
 * @depends none
 */

const DEFAULT_THRESHOLD = 0.12;
const FALLBACK_THRESHOLD = 0.2;
const MAX_WINDOW = 2048;
const SUBHARMONIC_GAIN = 0.45;
const SUBHARMONIC_CEILING = 0.09;

function createYinDetector({ sampleRate, bufferSize, threshold = DEFAULT_THRESHOLD }) {
  const yin = new Float32Array(Math.floor(bufferSize / 2));

  function computeDifference(buffer, tauMax, window) {
    for (let tau = 1; tau < tauMax; tau += 1) {
      let sum = 0;
      for (let i = 0; i < window; i += 1) {
        const delta = buffer[i] - buffer[i + tau];
        sum += delta * delta;
      }
      yin[tau] = sum;
    }
  }

  function normalize(tauMax) {
    yin[0] = 1;
    let running = 0;
    for (let tau = 1; tau < tauMax; tau += 1) {
      running += yin[tau];
      yin[tau] = running > 0 ? (yin[tau] * tau) / running : 1;
    }
  }

  function findTau(tauMin, tauMax) {
    for (let tau = tauMin; tau < tauMax; tau += 1) {
      if (yin[tau] >= threshold) continue;
      let best = tau;
      while (best + 1 < tauMax && yin[best + 1] < yin[best]) best += 1;
      return best;
    }

    let min = Infinity;
    let bestTau = -1;
    for (let tau = tauMin + 1; tau < tauMax - 1; tau += 1) {
      const isLocalMin = yin[tau] < yin[tau - 1] && yin[tau] <= yin[tau + 1];
      if (isLocalMin && yin[tau] < min) {
        min = yin[tau];
        bestTau = tau;
      }
    }
    return min < FALLBACK_THRESHOLD ? bestTau : -1;
  }

  function correctOctave(tau, tauMax) {
    let corrected = tau;
    for (const multiple of [2, 3, 4]) {
      const candidate = Math.round(tau * multiple);
      if (candidate + 1 >= tauMax) break;

      const span = Math.max(2, Math.round(tau * 0.04));
      let local = candidate;
      for (let probe = candidate - span; probe <= candidate + span; probe += 1) {
        if (probe > 0 && probe < tauMax && yin[probe] < yin[local]) local = probe;
      }

      if (yin[local] < SUBHARMONIC_CEILING && yin[local] < yin[corrected] * SUBHARMONIC_GAIN) {
        corrected = local;
      }
    }
    return corrected;
  }

  function refine(tau, tauMax) {
    if (tau <= 1 || tau + 1 >= tauMax) return tau;
    const prev = yin[tau - 1];
    const current = yin[tau];
    const next = yin[tau + 1];
    const divisor = 2 * (2 * current - next - prev);
    if (divisor === 0) return tau;
    return tau + (next - prev) / divisor;
  }

  function detect(buffer, { fMin, fMax }) {
    const tauMin = Math.max(2, Math.floor(sampleRate / fMax));
    const tauMax = Math.min(yin.length, Math.ceil(sampleRate / fMin) + 2);
    if (tauMax <= tauMin + 2) return null;

    const window = Math.min(MAX_WINDOW, buffer.length - tauMax);
    if (window < tauMin * 2) return null;

    computeDifference(buffer, tauMax, window);
    normalize(tauMax);

    const rawTau = findTau(tauMin, tauMax);
    if (rawTau < 0) return null;

    const tau = correctOctave(rawTau, tauMax);
    const frequency = sampleRate / refine(tau, tauMax);
    if (!Number.isFinite(frequency) || frequency < fMin || frequency > fMax) return null;

    return { frequency, clarity: 1 - Math.min(1, yin[tau]) };
  }

  return { detect };
}


// ----- js/pitch-note-tracker.js -----

/**
 * @module pitch-note-tracker
 * @description Stable note detection per pluck from noisy pitch frames.
 * @depends pitch-tuning
 */

const DEFAULTS = {
  minOnsetRms: 0.004,
  minReleaseRms: 0.0018,
  initialNoiseFloor: 0.002,
  onsetOverFloor: 3.5,
  reattackRatio: 1.8,
  attackSkipMs: 40,
  captureMs: 200,
  minSamples: 4,
  releaseHoldMs: 110,
  outlierCents: 60,
  maxSpreadCents: 80,
};

function medianOf(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 === 0
    ? (sorted[middle - 1] + sorted[middle]) / 2
    : sorted[middle];
}

function createNoteTracker(options = {}) {
  const config = { ...DEFAULTS, ...options };

  let state = 'idle';
  let envelope = 0;
  let noiseFloor = config.initialNoiseFloor;
  let captureStart = 0;
  let quietSince = null;
  let samples = [];
  let result = null;
  let feedback = 'idle';

  function updateLevels(rms) {
    noiseFloor = rms < noiseFloor ? rms : noiseFloor + (rms - noiseFloor) * 0.002;
    envelope = envelope * 0.85 + rms * 0.15;
  }

  function onsetLevel() {
    return Math.max(config.minOnsetRms, noiseFloor * config.onsetOverFloor);
  }

  function releaseLevel() {
    return Math.max(config.minReleaseRms, noiseFloor * 2);
  }

  function beginCapture(now) {
    state = 'capture';
    captureStart = now;
    samples = [];
    feedback = 'capture';
  }

  function finishCapture() {
    state = 'idle';
    if (samples.length < config.minSamples) {
      feedback = 'unclear';
      return;
    }

    const median = medianOf(samples);
    const pool = samples.filter(
      (midi) => Math.abs(midi - median) * 100 <= config.outlierCents
    );
    if (pool.length < config.minSamples) {
      feedback = 'unclear';
      return;
    }

    const spreadCents = (Math.max(...pool) - Math.min(...pool)) * 100;
    if (spreadCents > config.maxSpreadCents) {
      feedback = 'unclear';
      return;
    }

    const mean = pool.reduce((sum, midi) => sum + midi, 0) / pool.length;
    result = { frequency: midiToFreq(mean), midi: mean, samples: pool.length };
    feedback = 'ok';
    state = 'locked';
  }

  function push({ rms, frequency, now }) {
    if ((state === 'idle' || state === 'locked')
      && rms > onsetLevel()
      && rms > envelope * config.reattackRatio) {
      beginCapture(now);
    }

    if (state === 'capture') {
      const elapsed = now - captureStart;
      if (elapsed >= config.attackSkipMs && frequency) {
        samples.push(freqToMidi(frequency));
      }
      if (elapsed >= config.captureMs) finishCapture();
    }

    if (rms < releaseLevel()) {
      quietSince = quietSince ?? now;
      if (state === 'locked' && now - quietSince > config.releaseHoldMs) state = 'idle';
    } else {
      quietSince = null;
    }

    updateLevels(rms);
    return { state, feedback, result };
  }

  function reset() {
    state = 'idle';
    envelope = 0;
    noiseFloor = config.initialNoiseFloor;
    samples = [];
    result = null;
    quietSince = null;
    feedback = 'idle';
  }

  /**
   * Пороги приходят из `pitch-sensitivity` и меняются при смене целевой струны:
   * шестая струна звучит громче первой, поэтому общий порог не подходит обеим.
   */
  function setThresholds(thresholds) {
    if (!thresholds || typeof thresholds !== 'object') return;

    for (const key of ['minOnsetRms', 'minReleaseRms']) {
      const value = thresholds[key];
      if (typeof value === 'number' && Number.isFinite(value) && value > 0) {
        config[key] = value;
      }
    }

    const seed = thresholds.noiseFloor;
    if (typeof seed === 'number' && Number.isFinite(seed) && seed > 0) {
      config.initialNoiseFloor = seed;
      noiseFloor = seed;
    }
  }

  return { push, reset, setThresholds };
}
