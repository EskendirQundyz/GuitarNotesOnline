/**
 * @module find-note-listen-view
 * @description DOM updates for Find Fret listen panel.
 * @depends ui-strings
 */

const STATUS_BY_FEEDBACK = {
  idle: () => UI.listenStatusIdle,
  capture: () => UI.listenStatusCapture,
  unclear: () => UI.listenStatusUnclear,
  ok: () => UI.listenStatusIdle,
};

function createFindNoteListenView(elements) {
  function setPanelVisible(visible) {
    if (elements.findNoteListenPanel) {
      elements.findNoteListenPanel.hidden = !visible;
    }
  }

  function setStatus(text) {
    if (elements.findNoteListenStatus) {
      elements.findNoteListenStatus.textContent = text ?? '';
    }
  }

  function setHeard(text) {
    if (elements.findNoteListenHeard) {
      elements.findNoteListenHeard.textContent = text ?? '';
    }
  }

  function setMeterLevel(level) {
    elements.findNoteListenMeter?.style.setProperty('--level', String(level));
  }

  function clear() {
    setMeterLevel(0);
    setStatus('');
    setHeard('');
  }

  function statusForFeedback(feedback) {
    const resolver = STATUS_BY_FEEDBACK[feedback] ?? STATUS_BY_FEEDBACK.idle;
    return resolver();
  }

  function buildHeardLine({ frequency, midi, fret, cents, inRange, noteLabel }) {
    const centsLabel = `${cents > 0 ? '+' : ''}${cents} cents`;
    if (!inRange) {
      return UI.listenHeardOutOfRange(noteLabel(midi), frequency.toFixed(1), centsLabel);
    }
    return UI.listenHeardLine(noteLabel(midi), fret, frequency.toFixed(1), centsLabel);
  }

  return {
    setPanelVisible,
    setStatus,
    setHeard,
    setMeterLevel,
    clear,
    statusForFeedback,
    buildHeardLine,
  };
}


// ----- js/find-note-listen-sensitivity.js -----

/**
 * @module find-note-listen-sensitivity
 * @description Рантайм-профили чувствительности микрофона по струнам + их сохранение.
 * @depends persistence, pitch-sensitivity
 */

/** Профиль меняется каждый кадр, поэтому в куки он уходит редко и пачкой. */
const SAVE_DEBOUNCE_MS = 4000;

function createListenSensitivity() {
  let profiles = defaultStringSensitivity();
  let saveTimer = null;
  let dirty = false;

  async function load() {
    const { preferences } = await loadAppData();
    profiles = normalizeStringSensitivity(preferences.listen?.stringSensitivity);
  }

  function flush() {
    if (saveTimer !== null) {
      clearTimeout(saveTimer);
      saveTimer = null;
    }
    if (!dirty) return;

    dirty = false;
    void patchAppPreferences({ listen: { stringSensitivity: profiles } });
  }

  function scheduleSave() {
    dirty = true;
    if (saveTimer !== null) return;
    saveTimer = setTimeout(() => {
      saveTimer = null;
      flush();
    }, SAVE_DEBOUNCE_MS);
  }

  function observe(stringIndex, rms) {
    const profile = profiles[stringIndex];
    if (!profile) return;

    profiles[stringIndex] = observeStringLevel(profile, rms);
    scheduleSave();
  }

  return {
    load,
    observe,
    flush,
    profileFor: (stringIndex) => profiles[stringIndex] ?? null,
    thresholdsFor: (stringIndex) => stringThresholds(profiles[stringIndex]),
    meterLevelFor: (stringIndex, rms) => stringMeterLevel(profiles[stringIndex], rms),
    snapshot: () => profiles.map((profile) => ({ ...profile })),
  };
}


// ----- js/mode-find-note-listen.js -----

/**
 * @module mode-find-note-listen
 * @description Microphone input loop for Find Fret listen mode.
 * @depends config, fretboard, find-note-listen-view, find-note-listen-sensitivity, pitch-mic, pitch-yin, pitch-note-tracker, pitch-tuning, ui-strings
 */

const ANALYSIS_INTERVAL_MS = 25;
const MIN_CLARITY = 0.68;
/** Пороги пересчитываются на ходу — профиль струны уточняется прямо во время игры. */
const THRESHOLD_REFRESH_MS = 500;

function createFindNoteListenController({
  elements,
  getFindNote,
  getInputMode,
  isPaused,
  onHeardAttempt,
}) {
  const view = createFindNoteListenView(elements);
  const mic = createMicInput({ bufferSize: 4096 });
  const tracker = createNoteTracker();
  const sensitivity = createListenSensitivity();
  let detector = null;
  let running = false;
  let lastAnalysis = 0;
  let lastThresholdSync = 0;
  let thresholdStringIndex = null;
  let submittedForLock = false;
  let startPromise = null;

  /** При смене струны пороги подменяются сразу, иначе — раз в THRESHOLD_REFRESH_MS. */
  function syncThresholds(stringIndex, now) {
    const stringChanged = stringIndex !== thresholdStringIndex;
    if (!stringChanged && now - lastThresholdSync < THRESHOLD_REFRESH_MS) return;

    thresholdStringIndex = stringIndex;
    lastThresholdSync = now;

    const { minOnsetRms, minReleaseRms, noiseFloor } = sensitivity.thresholdsFor(stringIndex);
    // Шумовой фон трекера сбрасывается только при смене струны: внутри одной он
    // подстраивается сам и перезапись мешала бы этому.
    tracker.setThresholds(
      stringChanged
        ? { minOnsetRms, minReleaseRms, noiseFloor }
        : { minOnsetRms, minReleaseRms }
    );
  }

  function panelVisible() {
    return getInputMode() === FIND_INPUT.LISTEN && !elements.findNoteListenPanel?.hidden;
  }

  function submitHeardResult(result) {
    const findNote = getFindNote();
    const stringIndex = findNote.targetStringIndex;
    if (stringIndex === null || isPaused?.()) return;

    const mapped = fretOnString(GUITAR, stringIndex, result.frequency);
    view.setHeard(
      view.buildHeardLine({
        frequency: result.frequency,
        midi: result.midi,
        fret: mapped.fret,
        cents: mapped.cents,
        inRange: mapped.inRange,
        noteLabel,
      })
    );

    if (!mapped.inRange || mapped.fret === null) {
      return;
    }

    const note = getNoteAtFret(GUITAR, stringIndex, mapped.fret);
    const detail = elements.fretboardContainer.getCellDetail?.(stringIndex, mapped.fret);
    if (!detail) {
      return;
    }

    onHeardAttempt({
      string: stringIndex,
      fret: mapped.fret,
      note,
      cx: detail.cx,
      cy: detail.cy,
      heard: {
        frequency: result.frequency,
        midi: result.midi,
        pitchClass: pitchClassFromMidi(result.midi),
        cents: mapped.cents,
      },
    });
  }

  function loop(now) {
    if (!running) return;
    requestAnimationFrame(loop);

    if (!panelVisible() || isPaused?.()) {
      return;
    }

    const findNote = getFindNote();
    const stringIndex = findNote.targetStringIndex;
    if (stringIndex === null) return;

    const input = mic.read();
    if (!input) return;

    sensitivity.observe(stringIndex, input.rms);
    view.setMeterLevel(sensitivity.meterLevelFor(stringIndex, input.rms).toFixed(3));
    syncThresholds(stringIndex, now);

    if (now - lastAnalysis < ANALYSIS_INTERVAL_MS) return;
    lastAnalysis = now;

    const pitch = detector.detect(input.frame, stringBand(GUITAR, stringIndex));
    const { state, feedback, result } = tracker.push({
      rms: input.rms,
      frequency: pitch && pitch.clarity >= MIN_CLARITY ? pitch.frequency : null,
      now,
    });

    view.setStatus(view.statusForFeedback(state === 'capture' ? 'capture' : feedback));

    if (state === 'locked' && feedback === 'ok' && result && !submittedForLock) {
      submittedForLock = true;
      submitHeardResult(result);
    }

    if (state === 'idle') {
      submittedForLock = false;
    }
  }

  async function start() {
    if (startPromise) return startPromise;

    startPromise = (async () => {
      view.setPanelVisible(true);
      view.setStatus(UI.listenStatusRequesting);
      view.setHeard('');

      try {
        await sensitivity.load();
        const { sampleRate, bufferSize } = await mic.start();
        detector = createYinDetector({ sampleRate, bufferSize });
        tracker.reset();
        submittedForLock = false;
        running = true;
        lastAnalysis = 0;
        lastThresholdSync = 0;
        thresholdStringIndex = null;
        view.setStatus(UI.listenStatusIdle);
        requestAnimationFrame(loop);
      } catch (error) {
        view.setStatus(UI.listenStatusError(error.message || String(error)));
        throw error;
      } finally {
        startPromise = null;
      }
    })();

    return startPromise;
  }

  function stop() {
    running = false;
    mic.stop();
    detector = null;
    tracker.reset();
    sensitivity.flush();
    submittedForLock = false;
    thresholdStringIndex = null;
    view.setPanelVisible(false);
    view.clear();
  }

  function resetTracker() {
    tracker.reset();
    submittedForLock = false;
    if (panelVisible()) {
      view.setStatus(UI.listenStatusIdle);
      view.setHeard('');
    }
  }

  return {
    start,
    stop,
    resetTracker,
    setPanelVisible: view.setPanelVisible,
    getSensitivitySnapshot: sensitivity.snapshot,
  };
}


// ----- js/mode-find-note-ui-history.js -----

/**
 * @module mode-find-note-ui-history
 * @description History fade animation for Find Fret task panel.
 * @depends find-note, find-note-view
 */

function createFindNoteUiHistory({ elements, getFindNote, refreshUI }) {
  let historyFadeFrame = null;

  function stopHistoryFade() {
    if (historyFadeFrame) {
      cancelAnimationFrame(historyFadeFrame);
      historyFadeFrame = null;
    }
  }

  function updateHistoryFadeDom(now) {
    const findNote = getFindNote();
    if (!findNote.targetPitchClass || !elements.findNoteTarget) return;

    const capacity = estimateHistoryCapacity();
    const historyLengthBefore = findNote.history.length;
    pruneExpiredHistory(findNote, now, capacity);
    const historyLengthChanged = findNote.history.length !== historyLengthBefore;

    const historyRoot = elements.findNoteTarget.querySelector('.find-note-history');
    const itemNodes = historyRoot
      ? [...historyRoot.querySelectorAll('.find-note-history-item')]
      : [];
    const total = findNote.history.length;
    const needsRebuild = historyLengthChanged || !historyRoot || itemNodes.length !== total;

    if (needsRebuild) {
      elements.findNoteTarget.innerHTML = buildTaskPanelHtml(findNote, now, { capacity });
      return;
    }

    findNote.history.forEach((item, index) => {
      const opacity = getHistoryItemOpacity(item, now, { index, total, capacity });
      const row = itemNodes[index];
      const chip = row?.querySelector('.note-chip');
      if (!row || !chip) return;
      if (opacity <= 0) {
        row.hidden = true;
        chip.style.opacity = '0';
        return;
      }
      row.hidden = false;
      chip.style.opacity = String(opacity);
    });
  }

  function tickHistoryFade() {
    historyFadeFrame = null;
    const now = performance.now();
    const findNote = getFindNote();
    const capacity = estimateHistoryCapacity();

    updateHistoryFadeDom(now);

    if (hasActiveHistoryFade(findNote, now, capacity)) {
      startHistoryFade();
      return;
    }

    refreshUI({ now, skipLayoutSync: true, skipStatsSync: true });
  }

  function startHistoryFade() {
    if (historyFadeFrame) return;
    historyFadeFrame = requestAnimationFrame(tickHistoryFade);
  }

  return {
    stopHistoryFade,
    startHistoryFade,
  };
}

/**
 * @module mode-find-note-stats
 * @description Статистика и heatmap в режиме «Найди ноту».
 * @depends find-note-stats, trainer-stats-panel, debug-log
 */

function createFindNoteStatsController({
  elements,
  getFindNote,
  getInputMode,
  onHeatmapPaletteChange,
}) {
  let statsLogControls = null;

  function shouldCollectStats() {
    return shouldCollectFindNoteStats(getInputMode(), getFindNote().variant);
  }

  function applyScores(scores) {
    const findNote = getFindNote();
    findNote.positionScores = scores;
    findNote.useStatsWeightedPicking = Boolean(scores?.size);
  }

  const panel = createTrainerStatsPanel({
    elements,
    isVisible: () => shouldCollectStats() && !elements.findNotePanel?.hidden,
    loadScores: async () => {
      if (!shouldCollectStats()) return null;
      const context = await buildFindNoteStatsContext({
        inputMode: getInputMode(),
        variant: getFindNote().variant,
      });
      return context.positionScores;
    },
    applyScores,
    getScores: () => getFindNote().positionScores,
    onSyncControls: () => statsLogControls?.sync(),
    refreshLogIfOpen: () => {
      if (isStatsLogPanelOpen()) {
        void statsLogControls?.refresh();
      }
    },
    onHeatmapPaletteChange,
  });

  function syncStatsTask() {
    const findNote = getFindNote();
    findNote.useStatsWeightedPicking =
      shouldCollectStats() && Boolean(findNote.positionScores?.size);

    beginFindNoteStatsTask(findNote, {
      inputMode: getInputMode(),
      variant: findNote.variant,
    });
  }

  async function prepareStatsForPicking() {
    if (shouldCollectStats()) {
      await panel.refreshStatsCache();
      syncStatsTask();
    } else {
      applyScores(null);
    }
    await panel.syncStatsPanel();
  }

  function initStatsLogControls() {
    panel.initPaletteControls();

    if (statsLogControls) return;

    statsLogControls = initStatsLog({
      logButton: elements.findNoteDebugLogBtn,
      logPanel: elements.findNoteDebugLogPanel,
      isFindNotePanelVisible: () => !elements.findNotePanel?.hidden,
      shouldShowControls: () => !elements.findNotePanel?.hidden && shouldCollectStats(),
      getStatsModeFilter: () =>
        shouldCollectStats()
          ? { inputMode: getInputMode(), variant: getFindNote().variant }
          : null,
      onRecordDeleted: () => panel.refreshStatsPanelAfterSave(),
    });
  }

  async function resetStats() {
    if (!panel.confirmReset()) return;

    await clearFindNoteStatsRecords();
    discardFindNoteStatsTask();
    applyScores(null);
    await prepareStatsForPicking();
    syncStatsTask();
    if (isStatsLogPanelOpen()) {
      void statsLogControls?.refresh();
    }
  }

  function onPauseChanged(paused) {
    if (paused) {
      pauseFindNoteStatsTask();
    } else {
      resumeFindNoteStatsTask();
    }
  }

  function onLeave() {
    discardFindNoteStatsTask();
    closeStatsLogPanel();
    panel.hidePanel();
    statsLogControls?.sync();
  }

  return {
    shouldCollectStats,
    shouldShowStatsPanel: panel.shouldShowStatsPanel,
    syncStatsControls: panel.syncStatsControls,
    syncStatsPanel: panel.syncStatsPanel,
    refreshStatsPanelAfterSave: panel.refreshStatsPanelAfterSave,
    syncStatsTask,
    prepareStatsForPicking,
    initStatsLogControls,
    resetStats,
    onPauseChanged,
    onLeave,
    onEnter: panel.syncStatsControls,
  };
}


// ----- js/mode-find-note-ui.js -----

/**
 * @module mode-find-note-ui
 * @description UI режима «Найди ноту»: пауза, панель задачи, toggles.
 * @depends config, find-note, find-note-view, find-note-stats, mode-find-note-ui-history,
 *          trainer-pause-controller
 */

function createFindNoteUI({
  elements,
  getFindNote,
  getInputMode,
  stats,
  syncLayout,
  onRoundStarted,
}) {
  const pause = createTrainerPauseController({
    pauseButton: elements.findNotePauseBtn,
    progressEl: elements.findNoteProgress,
    isPanelVisible: () => !elements.findNotePanel?.hidden,
    onPauseChanged: (paused) => stats.onPauseChanged(paused),
  });

  const isPaused = pause.isPaused;
  const syncPauseUI = pause.syncPauseUI;

  function syncInputRules() {
    getFindNote().requireTargetString = getFindNote().variant === FIND_VARIANTS.ANY;
  }

  function syncStringHighlight() {
    const findNote = getFindNote();
    const shouldHighlight =
      !findNote.completed &&
      findNote.requireTargetString &&
      findNote.targetStringIndex !== null &&
      isStringEnabled(findNote, findNote.targetStringIndex);

    elements.fretboardContainer.setFindNoteStringVisuals?.({
      targetStringIndex: shouldHighlight ? findNote.targetStringIndex : null,
      enabledStrings: getEnabledStringIndices(findNote),
    });
  }

  function refreshUI({
    now = performance.now(),
    skipLayoutSync = false,
    skipStatsSync = false,
  } = {}) {
    const findNote = getFindNote();
    if (!findNote.targetPitchClass) {
      syncPauseUI();
      return;
    }

    if (!skipLayoutSync) {
      syncInputRules();
      syncLayout?.();
    }

    const capacity = estimateHistoryCapacity();
    pruneExpiredHistory(findNote, now, capacity);
    elements.findNoteTarget.innerHTML = buildTaskPanelHtml(findNote, now, { capacity });
    syncStringHighlight();
    syncPauseUI();
    if (!skipStatsSync) {
      stats.syncStatsControls();
    }

    if (isPaused()) {
      return;
    }

    elements.findNoteProgress.hidden = true;
    elements.findNoteProgress.textContent = '';
  }

  const history = createFindNoteUiHistory({
    elements,
    getFindNote,
    refreshUI,
  });

  function setPaused(paused) {
    if (!pause.setPaused(paused)) return;
    if (!isPaused()) {
      refreshUI();
    }
  }

  function clearBoard() {
    const findNote = getFindNote();
    findNote.foundPositions.clear();
    findNote.wrongPositions.clear();
    elements.fretboardContainer.clearFindNoteMarks?.();
  }

  function syncStringToggleUI() {
    syncStringHighlight();
  }

  function updateInputUI(onListenBlocked) {
    const findNote = getFindNote();
    const listenBlocked = findNote.variant === FIND_VARIANTS.ALL;

    elements.findNoteInputs?.forEach((btn) => {
      const isListen = btn.dataset.findInput === FIND_INPUT.LISTEN;
      const disabled = isListen && listenBlocked;
      if (disabled && btn.dataset.findInput === getInputMode()) {
        onListenBlocked?.();
      }

      const isActive = !disabled && btn.dataset.findInput === getInputMode();
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', String(isActive));
      btn.disabled = disabled;
    });

    if (elements.findNoteRecalibrateBtn) {
      elements.findNoteRecalibrateBtn.hidden = true;
    }

    syncStringToggleUI();
  }

  function updateVariantUI() {
    const findNote = getFindNote();
    elements.findNoteVariants?.forEach((btn) => {
      const isActive = btn.dataset.findVariant === findNote.variant;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });
  }

  function restoreMarks() {
    const findNote = getFindNote();
    if (
      findNote.variant !== FIND_VARIANTS.ALL ||
      !findNote.targetPitchClass ||
      findNote.completed
    ) {
      return;
    }

    for (const key of findNote.foundPositions) {
      const [string, fret] = key.split('-').map(Number);
      elements.fretboardContainer.markFindNotePosition?.(
        string,
        fret,
        true,
        findNote.targetPitchClass
      );
    }

    for (const key of findNote.wrongPositions) {
      if (findNote.foundPositions.has(key)) continue;
      const [string, fret] = key.split('-').map(Number);
      elements.fretboardContainer.markFindNotePosition?.(
        string,
        fret,
        false,
        findNote.targetPitchClass
      );
    }
  }

  function startNewRound({ resetHistory = false } = {}) {
    syncInputRules();
    if (resetHistory) {
      history.stopHistoryFade();
      resetFindNoteHistory(getFindNote());
    }
    discardFindNoteStatsTask();
    startRound(getFindNote());
    clearBoard();
    onRoundStarted?.();
    refreshUI();
    void stats.prepareStatsForPicking().then(() => {
      stats.syncStatsTask();
    });
  }

  return {
    isPaused,
    setPaused,
    stopHistoryFade: history.stopHistoryFade,
    startHistoryFade: history.startHistoryFade,
    clearBoard,
    updateInputUI,
    syncStringToggleUI,
    updateVariantUI,
    refreshUI,
    restoreMarks,
    startNewRound,
    usesMultiPositionTask: () => usesMultiPositionTask(getFindNote()),
  };
}


// ----- js/mode-find-note-attempts.js -----

/**
 * @module mode-find-note-attempts
 * @description Обработка попыток и статистики в режиме «Найди ноту».
 * @depends config, find-note, find-note-stats
 */

function createFindNoteAttempts({
  elements,
  getFindNote,
  getInputMode,
  stats,
  ui,
}) {
  function advanceToNextTarget(result) {
    const findNote = getFindNote();
    if (result.roundComplete) {
      findNote.completed = false;
      findNote.targetStringIndex = null;
    }

    if (result.roundComplete || result.needsNextTarget) {
      pickTarget(findNote);
      stats.syncStatsTask();
    }
  }

  async function afterStatsSaved(result) {
    await stats.refreshStatsPanelAfterSave();
    if (result) {
      advanceToNextTarget(result);
      ui.refreshUI({ skipLayoutSync: true, skipStatsSync: true });
    }
  }

  async function afterPartialStatsSaved() {
    await stats.refreshStatsPanelAfterSave();
    stats.syncStatsTask();
    ui.refreshUI({ skipLayoutSync: true, skipStatsSync: true });
  }

  function usesPositionStats(findNote) {
    return (
      findNote.variant === FIND_VARIANTS.ALL ||
      (findNote.variant === FIND_VARIANTS.ANY && findNote.requireTargetString)
    );
  }

  function savePositionStatsIfNeeded(position, onSaved) {
    const findNote = getFindNote();
    if (
      !shouldCollectFindNoteStats(getInputMode(), findNote.variant) ||
      !usesPositionStats(findNote)
    ) {
      onSaved();
      return;
    }

    void completeFindNoteStatsTask({ position }).then(() => onSaved());
  }

  function finishSuccess(result) {
    const findNote = getFindNote();
    if (shouldCollectFindNoteStats(getInputMode(), findNote.variant)) {
      void completeFindNoteStatsTask().then(() => afterStatsSaved(result));
      return;
    }

    advanceToNextTarget(result);
    ui.refreshUI({ skipLayoutSync: true, skipStatsSync: true });
  }

  function applyResult(result, detail) {
    const findNote = getFindNote();
    const multiPositionTask = ui.usesMultiPositionTask();

    switch (result.kind) {
      case 'ignored':
        return;

      case 'wrong': {
        recordFindNoteStatsError();
        const wrongFade = { fadeMs: FIND_NOTE_FADE_WRONG_MS };
        if (multiPositionTask) {
          const key = positionRoundKey(detail.string, detail.fret);
          elements.fretboardContainer.markFindNotePosition?.(
            detail.string,
            detail.fret,
            false,
            findNote.targetPitchClass,
            {
              ...wrongFade,
              onFadeComplete: () => findNote.wrongPositions.delete(key),
            }
          );
        } else {
          elements.fretboardContainer.showFindNoteResult?.(
            detail.cx,
            detail.cy,
            false,
            findNote.targetPitchClass,
            wrongFade
          );
        }
        break;
      }

      case 'wrong-string': {
        recordFindNoteStatsError();
        elements.fretboardContainer.markFindNotePosition?.(
          detail.string,
          detail.fret,
          false,
          findNote.targetPitchClass,
          { fadeMs: FIND_NOTE_FADE_WRONG_MS }
        );
        break;
      }

      case 'correct':
        elements.fretboardContainer.markFindNotePosition?.(
          detail.string,
          detail.fret,
          true,
          findNote.targetPitchClass
        );
        savePositionStatsIfNeeded(detail, afterPartialStatsSaved);
        break;

      case 'string-complete': {
        const completedPitchClass = result.completedPitchClass ?? findNote.targetPitchClass;
        const correctFade = { fadeMs: FIND_NOTE_FADE_CORRECT_MS };

        if (findNote.variant === FIND_VARIANTS.ALL) {
          elements.fretboardContainer.markFindNotePosition?.(
            detail.string,
            detail.fret,
            true,
            completedPitchClass
          );
          elements.fretboardContainer.fadeOutAllFindNoteMarks?.(FIND_NOTE_FADE_CORRECT_MS);
        } else if (findNote.requireTargetString) {
          elements.fretboardContainer.markFindNotePosition?.(
            detail.string,
            detail.fret,
            true,
            completedPitchClass
          );
          elements.fretboardContainer.fadeOutAllFindNoteMarks?.(FIND_NOTE_FADE_CORRECT_MS);
        } else {
          elements.fretboardContainer.showFindNoteResult?.(
            detail.cx,
            detail.cy,
            true,
            completedPitchClass,
            correctFade
          );
        }

        pushFindNoteHistory(findNote, completedPitchClass, FIND_NOTE_FADE_CORRECT_MS);
        findNote.foundPositions.clear();
        findNote.wrongPositions.clear();
        ui.startHistoryFade();
        if (usesPositionStats(findNote)) {
          savePositionStatsIfNeeded(detail, () => afterStatsSaved(result));
        } else {
          finishSuccess(result);
        }
        break;
      }
    }

    if (result.kind !== 'string-complete') {
      ui.refreshUI({ skipLayoutSync: true, skipStatsSync: true });
    }
  }

  return {
    applyResult,
  };
}

/**
 * @module mode-find-note-fret-range
 * @description Fret range strip controller for Find Fret mode.
 * @depends config, find-note-fret-range, find-note-fret-range-layout, find-note-fret-range-view, find-note-state
 */

function createFindNoteFretRangeController({
  elements,
  getRange,
  getPalette,
  onRangeChange,
  onLayoutAfterRender,
  syncLayout,
}) {
  const view = createFindNoteFretRangeView({
    elements,
    getRange,
    getPalette,
    frets: GUITAR.frets,
  });

  let draggingEdge = null;
  let layoutListener = null;

  function getHitLayout() {
    return elements.fretboardContainer?.getFretboardHitLayout?.() ?? null;
  }

  function pointerXInLayout(event) {
    const stage = elements.fretboardContainer?.querySelector('.fretboard-canvas-stage');
    const svg = stage?.querySelector('svg.fretboard-overlay');
    if (!svg) return 0;

    const rect = svg.getBoundingClientRect();
    const hitLayout = getHitLayout();
    const scale = rect.width ? (hitLayout?.totalWidth ?? svg.viewBox.baseVal.width) / rect.width : 1;
    return (event.clientX - rect.left) * scale;
  }

  function commitRange(nextRange) {
    const normalized = setFindNoteFretRange(nextRange);
    view.render(getHitLayout());
    onRangeChange?.(normalized);
  }

  function onPointerMove(event) {
    if (!draggingEdge) return;
    event.preventDefault();

    const hitLayout = getHitLayout();
    if (!hitLayout) return;

    const nextRange = snapRangeFromDrag({
      hitLayout,
      range: getRange(),
      frets: GUITAR.frets,
      edge: draggingEdge,
      pointerX: pointerXInLayout(event),
    });

    if (
      nextRange.minFret === getRange().minFret &&
      nextRange.maxFret === getRange().maxFret
    ) {
      return;
    }

    commitRange(nextRange);
  }

  function stopDragging() {
    draggingEdge = null;
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', stopDragging);
    window.removeEventListener('pointercancel', stopDragging);
  }

  function startDragging(edge, event) {
    if (event.button != null && event.button !== 0) return;

    draggingEdge = edge;
    event.preventDefault();
    event.stopPropagation();
    event.currentTarget.setPointerCapture?.(event.pointerId);
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', stopDragging);
    window.addEventListener('pointercancel', stopDragging);
  }

  function bindHandles() {
    elements.findNoteFretRangeHandleMin?.addEventListener('pointerdown', (event) => {
      startDragging('min', event);
    });
    elements.findNoteFretRangeHandleMax?.addEventListener('pointerdown', (event) => {
      startDragging('max', event);
    });
  }

  function onLayoutChange() {
    view.render(getHitLayout());
    syncLayout?.();
    onLayoutAfterRender?.();
  }

  function enter() {
    view.setVisible(true);
    view.render(getHitLayout());
    layoutListener = onLayoutChange;
    elements.fretboardContainer.onFretboardLayoutChange = layoutListener;
  }

  function leave() {
    stopDragging();
    view.setVisible(false);
    if (elements.fretboardContainer.onFretboardLayoutChange === layoutListener) {
      elements.fretboardContainer.onFretboardLayoutChange = null;
    }
    layoutListener = null;

    const cells = elements.fretboardContainer?.querySelectorAll('.fret-cell');
    cells?.forEach((cell) => {
      cell.style.pointerEvents = '';
      cell.removeAttribute('aria-hidden');
    });
  }

  function sync() {
    view.syncPalette();
    view.render(getHitLayout());
  }

  return {
    bindHandles,
    enter,
    leave,
    sync,
  };
}


// ----- js/mode-find-note-controls.js -----

/**
 * @module mode-find-note-controls
 * @description Переключатели Find Fret: mouse/listen, any/all, кнопки, сохранение настроек.
 * @depends config, find-note, persistence, stats-fretboard-view
 */

/**
 * Владеет текущим режимом ввода. Зависимые контроллеры приходят ленивыми геттерами,
 * потому что создаются после этого модуля.
 */
function createFindNoteControls({
  elements,
  findNote,
  getHandlers,
  getListen,
  getStats,
}) {
  let inputMode = FIND_INPUT.MOUSE;
  let controlsBound = false;

  const handlers = () => getHandlers();
  const listen = () => getListen();
  const stats = () => getStats();

  function getInputMode() {
    return inputMode;
  }

  function fallbackToMouse() {
    inputMode = FIND_INPUT.MOUSE;
    listen().stop();
  }

  function savePreferences(extra = {}) {
    void patchAppPreferences({
      findNote: {
        variant: findNote.variant,
        inputMode,
        enabledStrings: getEnabledStringIndices(findNote),
        heatmapPalette: getStatsHeatmapPalette(),
        fretRange: getFindNoteFretRange(),
        ...extra,
      },
    });
  }

  function coerceListenMode() {
    if (inputMode === FIND_INPUT.LISTEN && findNote.variant !== FIND_VARIANTS.ANY) {
      fallbackToMouse();
    }
  }

  function applySavedSettings(saved) {
    findNote.variant = saved.variant;
    inputMode = saved.inputMode;
    setEnabledStrings(findNote, saved.enabledStrings);
    setFindNoteFretRange(saved.fretRange);
    setStatsHeatmapPalette(saved.heatmapPalette);

    elements.fretboardContainer.dataset.findVariant = findNote.variant;
    findNote.requireTargetString = findNote.variant === FIND_VARIANTS.ANY;
    coerceListenMode();
    handlers().updateVariantUI();
    handlers().syncStringToggleUI();
    handlers().updateInputUI(fallbackToMouse);
  }

  async function restoreSettings() {
    const { preferences } = await loadAppData();
    applySavedSettings(preferences.findNote);
  }

  async function activateListenMode() {
    try {
      await listen().start();
    } catch {
      fallbackToMouse();
      handlers().updateInputUI();
    }
  }

  async function setInputMode(mode) {
    if (mode === FIND_INPUT.LISTEN && findNote.variant !== FIND_VARIANTS.ANY) return;
    if (inputMode === mode) return;

    if (inputMode === FIND_INPUT.LISTEN) {
      listen().stop();
    }

    inputMode = mode;
    handlers().updateInputUI(fallbackToMouse);

    if (mode === FIND_INPUT.LISTEN) {
      await activateListenMode();
      if (inputMode !== FIND_INPUT.LISTEN) return;
    }

    void stats().syncStatsPanel();
    savePreferences();
    handlers().startNewRound({ resetHistory: true });
  }

  function setVariant(variant) {
    if (findNote.variant === variant) return;

    findNote.variant = variant;
    elements.fretboardContainer.dataset.findVariant = variant;
    if (variant === FIND_VARIANTS.ALL && inputMode === FIND_INPUT.LISTEN) {
      fallbackToMouse();
    }

    handlers().updateVariantUI();
    handlers().updateInputUI(fallbackToMouse);
    void stats().syncStatsPanel();
    savePreferences();
    handlers().startNewRound({ resetHistory: true });
  }

  function bindControls() {
    if (controlsBound) return;
    controlsBound = true;

    elements.findNoteInputs?.forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        void setInputMode(btn.dataset.findInput);
      });
    });

    elements.findNoteVariants?.forEach((btn) => {
      btn.addEventListener('click', () => {
        setVariant(btn.dataset.findVariant);
      });
    });

    elements.findNotePauseBtn?.addEventListener('click', () => {
      handlers().setPaused(!handlers().isPaused());
    });

    elements.findNoteStatsResetBtn?.addEventListener('click', () => {
      if (!elements.findNotePanel || elements.findNotePanel.hidden) return;
      void stats()
        .resetStats()
        .then(() => handlers().refreshUI());
    });
  }

  return {
    getInputMode,
    setInputMode,
    savePreferences,
    restoreSettings,
    activateListenMode,
    bindControls,
    isListenMode: () => inputMode === FIND_INPUT.LISTEN,
    isMouseMode: () => inputMode === FIND_INPUT.MOUSE,
  };
}

/**
 * @module mode-find-note
 * @description Режим «Найди ноту» — mouse/listen, пауза, статистика.
 * @depends find-note, mode-find-note-controls, mode-find-note-stats,
 *          mode-find-note-handlers, mode-find-note-listen, mode-find-note-fret-range
 */

function createFindNoteMode(deps) {
  const { elements, syncLayout } = deps;

  const findNote = createFindNoteState();
  let fretRangeBound = false;
  let fretRange;
  let listen;
  let handlers;

  const controls = createFindNoteControls({
    elements,
    findNote,
    getHandlers: () => handlers,
    getListen: () => listen,
    getStats: () => stats,
  });

  const stats = createFindNoteStatsController({
    elements,
    getFindNote: () => findNote,
    getInputMode: controls.getInputMode,
    onHeatmapPaletteChange: (palette) => {
      controls.savePreferences({ heatmapPalette: palette });
      fretRange?.sync();
    },
  });

  listen = createFindNoteListenController({
    elements,
    getFindNote: () => findNote,
    getInputMode: controls.getInputMode,
    isPaused: () => handlers?.isPaused() ?? false,
    onHeardAttempt(detail) {
      if (!controls.isListenMode() || handlers.isPaused()) return;
      handlers.applyResult(handlers.evaluateAttempt(detail), detail);
    },
  });

  handlers = createFindNoteHandlers({
    elements,
    getFindNote: () => findNote,
    getInputMode: controls.getInputMode,
    stats,
    syncLayout,
    onRoundStarted: () => listen.resetTracker(),
  });

  fretRange = createFindNoteFretRangeController({
    elements,
    getRange: getFindNoteFretRange,
    getPalette: getStatsHeatmapPalette,
    syncLayout,
    onRangeChange: (range) => {
      controls.savePreferences({ fretRange: range });
      handlers.startNewRound({ resetHistory: true });
    },
    onLayoutAfterRender: () => {
      if (elements.findNotePanel?.hidden) return;

      if (!isCurrentTaskPlayable(findNote)) {
        handlers.startNewRound({ resetHistory: false });
        return;
      }

      handlers.restoreMarks();
      handlers.refreshUI({ skipLayoutSync: true, skipStatsSync: true });
    },
  });

  return {
    getState: () => findNote,
    getInputMode: controls.getInputMode,

    async enter() {
      elements.fretboardContainer.clearTrainerTarget?.();
      controls.bindControls();
      if (!fretRangeBound) {
        fretRange.bindHandles();
        fretRangeBound = true;
      }

      stats.initStatsLogControls();
      stats.onEnter();

      elements.findNotePanel.hidden = false;
      await controls.restoreSettings();
      fretRange.enter();
      handlers.setPaused(false);
      if (controls.isListenMode()) {
        await controls.activateListenMode();
      }
      handlers.startNewRound({ resetHistory: true });
    },

    leave() {
      listen.stop();
      fretRange.leave();
      elements.findNotePanel.hidden = true;
      handlers.stopHistoryFade();
      stats.onLeave();
      handlers.setPaused(false);
      findNote.requireTargetString = false;
      resetFindNoteHistory(findNote);
      startRound(findNote);
      handlers.clearBoard();
      elements.fretboardContainer.setFindNoteStringVisuals?.(null);
      document.body.classList.remove('find-note-paused');
    },

    onStringToggle(detail) {
      const stringIndex = detail?.stringIndex;
      if (typeof stringIndex !== 'number') return;
      if (!toggleStringEnabled(findNote, stringIndex)) return;

      handlers.syncStringToggleUI();
      controls.savePreferences();
      handlers.startNewRound({ resetHistory: false });
    },

    onFretClick(detail) {
      if (!controls.isMouseMode() || handlers.isPaused()) return;
      handlers.applyResult(handlers.evaluateAttempt(detail), detail);
    },

    onOutsideClick() {
      if (findNote.variant === FIND_VARIANTS.ANY) {
        elements.fretboardContainer.clearGuess?.();
      }
    },

    restoreMarks: handlers.restoreMarks,

    simulateClick(string, fret) {
      const detail = elements.fretboardContainer.getCellDetail?.(string, fret);
      if (!detail) return { error: 'no-cell', string, fret };

      const result = handlers.evaluateAttempt(detail);
      handlers.applyResult(result, detail);
      return { kind: result.kind, detail };
    },
  };
}

/**
 * @module mode-guess-note-round
 * @description Раунд Find note: палитра нот, белая точка-загадка, разбор ответа.
 * @depends config, note, guess-note, guess-note-stats, note-chip
 */

const GUESS_WRONG_FLASH_MS = 700;

/**
 * @param {object} options
 * @param {object} options.guessNote состояние тренажёра (мутируется на месте)
 * @param {Function} options.isActive активен ли режим прямо сейчас
 * @param {Function} options.isPaused
 * @param {Function} options.onAnswerSaved async () => void — обновить log и heatmap
 */
function createGuessNoteRoundController({
  elements,
  guessNote,
  isActive,
  isPaused,
  onAnswerSaved,
}) {
  let paletteBound = false;
  let wrongFlashTimer = null;

  function clearTimers() {
    if (!wrongFlashTimer) return;
    clearTimeout(wrongFlashTimer);
    wrongFlashTimer = null;
  }

  function hasTarget() {
    return guessNote.targetString !== null && guessNote.targetFret !== null;
  }

  function previousTarget() {
    if (!hasTarget()) return null;
    return { string: guessNote.targetString, fret: guessNote.targetFret };
  }

  function showTargetDot() {
    if (!isActive() || !hasTarget()) return;
    elements.fretboardContainer.showTrainerTarget?.(guessNote.targetString, guessNote.targetFret);
  }

  function clearTargetDot() {
    elements.fretboardContainer.clearTrainerTarget?.();
  }

  function paletteButtons() {
    return elements.guessNotePalette?.querySelectorAll('.note-palette-btn') ?? [];
  }

  function resetPaletteButtons() {
    paletteButtons().forEach((btn) => {
      btn.classList.remove('active', 'dimmed', 'guess-note-wrong');
      btn.setAttribute('aria-pressed', 'false');
      btn.disabled = false;
    });
  }

  function lockPaletteOnAnswer(pitchClass) {
    paletteButtons().forEach((btn) => {
      const isCorrect = btn.dataset.pitch === pitchClass;
      btn.classList.toggle('active', isCorrect);
      btn.classList.toggle('dimmed', !isCorrect);
      btn.setAttribute('aria-pressed', String(isCorrect));
      btn.disabled = true;
    });
  }

  function startRound({ clearMarks = true } = {}) {
    if (!isActive()) return;

    clearTimers();
    resetPaletteButtons();
    if (clearMarks) {
      elements.fretboardContainer.clearFindNoteMarks?.();
    }

    pickGuessNoteTarget(guessNote, previousTarget());
    showTargetDot();
    beginGuessNoteStatsTask(guessNote);
  }

  function flashWrongButton(button) {
    button.classList.add('guess-note-wrong');
    clearTimers();
    wrongFlashTimer = window.setTimeout(() => {
      wrongFlashTimer = null;
      button.classList.remove('guess-note-wrong');
    }, GUESS_WRONG_FLASH_MS);
  }

  function onPaletteClick(pitchClass, button) {
    if (isPaused() || guessNote.completed) return;

    const result = evaluateGuessNoteAttempt(guessNote, pitchClass);
    if (result.kind === 'ignored') return;

    if (result.kind === 'wrong') {
      recordGuessNoteStatsError();
      flashWrongButton(button);
      return;
    }

    lockPaletteOnAnswer(pitchClass);
    clearTargetDot();
    elements.fretboardContainer.markFindNotePosition?.(
      guessNote.targetString,
      guessNote.targetFret,
      true,
      result.pitchClass
    );
    elements.fretboardContainer.fadeOutAllFindNoteMarks?.(FIND_NOTE_FADE_CORRECT_MS);

    void completeGuessNoteStatsTask().then(async () => {
      await onAnswerSaved?.();
      startRound({ clearMarks: false });
    });
  }

  function buildPalette() {
    if (!elements.guessNotePalette) return;

    elements.guessNotePalette.innerHTML = PITCH_CLASSES.map((pitchClass) =>
      buildNoteChipHtml(pitchClass, { interactive: true })
    ).join('');

    if (paletteBound) return;
    paletteBound = true;

    elements.guessNotePalette.addEventListener('click', (event) => {
      const button = event.target.closest('.note-palette-btn');
      if (!button) return;
      onPaletteClick(button.dataset.pitch, button);
    });
  }

  return {
    startRound,
    buildPalette,
    resetPaletteButtons,
    showTargetDot,
    clearTargetDot,
    clearTimers,
    hasTarget,
  };
}

/**
 * @module mode-guess-note-stats
 * @description Статистика и heatmap в режиме Find note.
 * @depends guess-note-stats, trainer-stats-panel, debug-log
 */

function createGuessNoteStatsController({
  elements,
  getGuessNote,
  onHeatmapPaletteChange,
  onRecordDeleted,
}) {
  let positionScores = null;
  let statsControlsBound = false;

  function applyScores(scores) {
    positionScores = scores;

    const guessNote = getGuessNote?.();
    if (!guessNote) return;
    guessNote.positionScores = scores;
    guessNote.useStatsWeightedPicking = Boolean(scores?.size);
  }

  const panel = createTrainerStatsPanel({
    elements,
    isVisible: () => !elements.guessNotePanel?.hidden,
    loadScores: async () => (await buildGuessNoteStatsContext()).positionScores,
    applyScores,
    getScores: () => positionScores,
    renderEmptyScores: true,
    refreshLogIfOpen: async () => {
      if (isGuessNoteLogPanelOpen()) {
        await onRecordDeleted?.();
      }
    },
    onHeatmapPaletteChange,
  });

  function initStatsControls() {
    panel.initPaletteControls();

    if (statsControlsBound) return;
    statsControlsBound = true;

    elements.findNoteStatsResetBtn?.addEventListener('click', () => {
      if (!elements.guessNotePanel || elements.guessNotePanel.hidden) return;
      void resetStats();
    });
  }

  async function resetStats() {
    if (!panel.confirmReset()) return;

    await clearGuessNoteStatsRecords();
    discardGuessNoteStatsTask();
    applyScores(null);
    await panel.syncStatsPanel();
    if (isGuessNoteLogPanelOpen()) {
      await onRecordDeleted?.();
    }
  }

  function onLeave() {
    discardGuessNoteStatsTask();
    applyScores(null);
    panel.hidePanel();
  }

  return {
    initStatsControls,
    syncStatsPanel: panel.syncStatsPanel,
    refreshStatsPanelAfterSave: panel.refreshStatsPanelAfterSave,
    resetStats,
    onLeave,
    onEnter: panel.syncStatsControls,
  };
}

/**
 * @module mode-guess-note
 * @description Trainer «Find note» — white dot on fretboard, guess note from palette.
 * @depends guess-note, guess-note-stats, find-note-state, note-chip,
 *          mode-find-note-fret-range, mode-guess-note-log, mode-guess-note-pause,
 *          mode-guess-note-round, mode-guess-note-stats, persistence, stats-fretboard-view
 */

function createGuessNoteMode(deps) {
  const { elements, syncLayout } = deps;

  const guessNote = createGuessNoteState();
  let fretRangeBound = false;
  let enterSession = 0;
  let fretRange;

  function isActive() {
    return elements.fretboardContainer?.dataset?.mode === 'guess-note';
  }

  const log = createGuessNoteLogController({ elements });

  const stats = createGuessNoteStatsController({
    elements,
    getGuessNote: () => guessNote,
    onHeatmapPaletteChange: (palette) => {
      void patchAppPreferences({ findNote: { heatmapPalette: palette } });
      fretRange?.sync();
      void stats.syncStatsPanel();
    },
    onRecordDeleted: () => log.refreshIfOpen(),
  });

  const pause = createGuessNotePauseController({
    elements,
    onPauseChanged: (isPaused) => {
      if (isPaused) {
        pauseGuessNoteStatsTask();
        return;
      }
      resumeGuessNoteStatsTask();
    },
  });

  const round = createGuessNoteRoundController({
    elements,
    guessNote,
    isActive,
    isPaused: () => pause.isPaused(),
    onAnswerSaved: async () => {
      log.refreshIfOpen();
      await stats.refreshStatsPanelAfterSave();
    },
  });

  function syncStringVisuals() {
    elements.fretboardContainer.setGuessNoteStringVisuals?.({
      enabledStrings: getEnabledStringIndices(guessNote),
    });
  }

  function savePreferences() {
    void patchAppPreferences({
      findNote: { fretRange: getFindNoteFretRange() },
      guessNote: { enabledStrings: getEnabledStringIndices(guessNote) },
    });
  }

  fretRange = createFindNoteFretRangeController({
    elements,
    getRange: getFindNoteFretRange,
    getPalette: getStatsHeatmapPalette,
    syncLayout,
    onRangeChange: (range) => {
      void patchAppPreferences({ findNote: { fretRange: range } });
      round.startRound();
    },
    onLayoutAfterRender: () => {
      if (!isActive() || pause.isPaused()) return;

      if (!isGuessNoteTargetPlayable(guessNote)) {
        round.startRound({ clearMarks: true });
        return;
      }

      round.showTargetDot();
    },
  });

  function bindFretRange() {
    if (fretRangeBound) return;
    fretRangeBound = true;
    fretRange.bindHandles();
  }

  async function restorePreferences() {
    const data = await loadAppData();
    const preferences = data.preferences;

    const range = preferences?.findNote?.fretRange;
    if (range) {
      setFindNoteFretRange(range);
    }

    const enabledStrings = preferences?.guessNote?.enabledStrings;
    if (enabledStrings) {
      setEnabledStrings(guessNote, enabledStrings);
    }

    const palette = preferences?.findNote?.heatmapPalette;
    if (palette) {
      setStatsHeatmapPalette(palette);
    }
  }

  function clearTargetState() {
    guessNote.targetString = null;
    guessNote.targetFret = null;
    guessNote.targetPitchClass = null;
    guessNote.completed = false;
  }

  return {
    async enter() {
      const session = enterSession;
      await restorePreferences();
      if (session !== enterSession || !isActive()) return;

      elements.fretboardContainer.setFindNoteTargetString?.(null);
      elements.guessNotePanel.hidden = false;
      syncNoteChipWidth(elements.fretboardSection);
      round.buildPalette();
      bindFretRange();
      fretRange.enter();
      stats.initStatsControls();
      log.onEnter();
      pause.onEnter();
      stats.onEnter();
      syncStringVisuals();

      if (session !== enterSession || !isActive()) return;
      await stats.syncStatsPanel();
      if (session !== enterSession || !isActive()) return;
      round.startRound();
    },

    leave() {
      enterSession += 1;
      round.clearTimers();
      discardGuessNoteStatsTask();
      stats.onLeave();
      log.onLeave();
      pause.onLeave();
      elements.guessNotePanel.hidden = true;
      round.clearTargetDot();
      elements.fretboardContainer.setGuessNoteStringVisuals?.(null);
      elements.fretboardContainer.clearFindNoteMarks?.();
      round.resetPaletteButtons();
      fretRange.leave();
      clearTargetState();
    },

    restoreTarget() {
      if (!isActive() || !round.hasTarget()) return;
      if (guessNote.completed || pause.isPaused()) return;
      round.showTargetDot();
    },

    isPaused: () => pause.isPaused(),

    getState: () => ({ ...guessNote }),

    onFretClick() {},
    onOutsideClick() {},

    onStringToggle(detail) {
      const stringIndex = detail?.stringIndex;
      if (typeof stringIndex !== 'number') return;
      if (!toggleStringEnabled(guessNote, stringIndex)) return;

      syncStringVisuals();
      savePreferences();
      round.startRound();
    },

    __testExports: {
      createGuessNoteState,
      pickGuessNoteTarget,
      evaluateGuessNoteAttempt,
      listGuessNotePositions,
      isGuessNoteTargetPlayable,
    },
  };
}

/**
 * @module studio-shell
 * @description Studio UI: подпись текущего режима, каталог разделов, отступы рамки грифа.
 * @depends none
 */

function createStudioShell({ onModeSelect, onLayoutSync }) {
  const modeCurrent = document.getElementById('mode-current');
  const catalogBtn = document.getElementById('catalog-btn');
  const catalog = document.getElementById('catalog');
  const catalogItems = catalog
    ? Array.from(catalog.querySelectorAll('.catalog-item'))
    : [];

  function closeCatalog() {
    if (!catalog) return;
    catalog.hidden = true;
    catalogBtn?.setAttribute('aria-expanded', 'false');
  }

  function setModeLabel(label) {
    if (modeCurrent) modeCurrent.textContent = label;
  }

  function syncCatalog(mode) {
    catalogItems.forEach((item) => {
      item.classList.toggle('is-active', item.dataset.mode === mode);
    });
  }

  /**
   * v1.13.0: the gap above/below the fretboard is a static CSS `clamp()`
   * (`--fretboard-frame-gap` in styles.css) — it no longer anchors the
   * strings at 1/3 of the viewport height, so no JS measurement/resize
   * wiring is needed. Kept as a callable no-op so existing call sites in
   * app.js don't need to change; it still notifies the edge-inset sync.
   */
  function syncFretboardFrameSpacing() {
    onLayoutSync?.();
  }

  function init() {
    catalogBtn?.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = catalog.hidden;
      catalog.hidden = !open;
      catalogBtn.setAttribute('aria-expanded', String(open));
    });

    catalog?.addEventListener('click', (event) => {
      event.stopPropagation();
    });

    catalogItems.forEach((item) => {
      item.addEventListener('click', () => {
        onModeSelect(item.dataset.mode);
        closeCatalog();
      });
    });

    document.addEventListener('click', closeCatalog);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeCatalog();
    });
  }

  return { init, setModeLabel, syncCatalog, closeCatalog, syncFretboardFrameSpacing };
}

/**
 * @module ui-strings-apply
 * @description Apply static UI copy from ui-strings.js to the DOM.
 * @depends config, ui-strings, fretboard

function applyStaticUiStrings(elements) {
  document.title = UI.pageTitle;
  elements.catalogBtn?.setAttribute('aria-label', UI.catalogButtonLabel);

  const selectionLabels = document.querySelectorAll('.selection-details .selection-label');
  const [noteLabel, octaveLabel, positionLabel] = selectionLabels;
  if (noteLabel) noteLabel.textContent = UI.selectionNote;
  if (octaveLabel) octaveLabel.textContent = UI.selectionOctave;
  if (positionLabel) positionLabel.textContent = UI.selectionPosition;

  elements.fretboardContainer?.setAttribute('aria-label', UI.fretboardAriaLabel);
  elements.staffContainer?.setAttribute('aria-label', UI.staffAriaLabel);
  elements.notePalette?.setAttribute('aria-label', UI.notePaletteAriaLabel);

  if (elements.showAllNotesBtn) {
    elements.showAllNotesBtn.textContent = UI.showAllNotes;
  }
  if (elements.showAllOctavesBtn) {
    elements.showAllOctavesBtn.textContent = UI.showAllOctaves;
  }

  const catalogLabels = {
    [MODES.FRET_NOTE]: UI.modeFretNote,
    [MODES.NOTE_FRETS]: UI.modeNoteFrets,
    [MODES.FIND_NOTE]: UI.modeFindNote,
    [MODES.GUESS_NOTE]: UI.modeGuessNote,
  };
  document.querySelectorAll('.catalog-item[data-mode]').forEach((item) => {
    const label = catalogLabels[item.dataset.mode];
    if (label) item.textContent = label;
  });

  const referenceLabel = document.querySelector('[data-catalog-section="reference"]');
  const trainersLabel = document.querySelector('[data-catalog-section="trainers"]');
  const comingSoonLabel = document.querySelector('[data-catalog-section="coming-soon"]');
  const soonList = document.querySelector('[data-catalog-section="soon-list"]');
  if (referenceLabel) referenceLabel.textContent = UI.catalogReference;
  if (trainersLabel) trainersLabel.textContent = UI.catalogTrainers;
  if (comingSoonLabel) comingSoonLabel.textContent = UI.catalogComingSoon;
  if (soonList) soonList.textContent = UI.catalogSoonList;

  const inputBar = document.querySelector('.find-note-input-bar');
  inputBar?.setAttribute('aria-label', UI.findNoteInputBarLabel);
  const variantBar = document.querySelector('.find-note-variant-bar');
  variantBar?.setAttribute('aria-label', UI.findNoteVariantBarLabel);

  elements.findNoteInputs?.forEach((btn) => {
    const mode = btn.dataset.findInput;
    if (mode === 'mouse') btn.textContent = UI.findNoteInputMouse;
    if (mode === 'listen') {
      btn.textContent = UI.findNoteInputListen;
      btn.title = UI.findNoteInputListen;
    }
  });

  elements.findNoteVariants?.forEach((btn) => {
    const variant = btn.dataset.findVariant;
    if (variant === 'any') {
      btn.textContent = UI.findNoteVariantAny;
      btn.title = UI.findNoteVariantAnyTitle;
    }
    if (variant === 'all') {
      btn.textContent = UI.findNoteVariantAll;
      btn.title = UI.findNoteVariantAllTitle;
    }
  });

  if (elements.findNotePauseBtn) {
    elements.findNotePauseBtn.setAttribute('aria-label', UI.pauseLabel);
    elements.findNotePauseBtn.title = UI.pauseLabel;
  }

  if (elements.guessNotePauseBtn) {
    elements.guessNotePauseBtn.setAttribute('aria-label', UI.pauseLabel);
    elements.guessNotePauseBtn.title = UI.pauseLabel;
  }

  elements.guessNoteDebugLogBtn?.setAttribute('title', UI.guessHistoryTitle);
  elements.findNoteRecalibrateBtn?.setAttribute('aria-label', UI.calibrateMicLabel);

  elements.findNoteFretRangeHandleMin?.setAttribute('aria-label', UI.findNoteFretRangeHandleMin);
  elements.findNoteFretRangeHandleMax?.setAttribute('aria-label', UI.findNoteFretRangeHandleMax);

  const statsTitle = document.querySelector('.find-note-stats-title');
  if (statsTitle) statsTitle.textContent = UI.statsTitle;
  if (elements.findNoteStatsResetBtn) {
    elements.findNoteStatsResetBtn.textContent = UI.statsReset;
  }
  elements.findNoteStatsFretboard?.setAttribute('aria-label', UI.statsFretboardLabel);

  elements.findNoteStatsPalettes?.setAttribute('aria-label', UI.statsHeatmapPaletteLabel);
  elements.findNoteStatsPalettes?.querySelectorAll('[data-palette]').forEach((btn) => {
    const key = btn.dataset.palette;
    if (key === 'mint') btn.textContent = UI.statsHeatmapPaletteMint;
    if (key === 'amber') btn.textContent = UI.statsHeatmapPaletteAmber;
    if (key === 'violet') btn.textContent = UI.statsHeatmapPaletteViolet;
  });

  const legendLabels = document.querySelectorAll('.find-note-stats-legend-label');
  const [weakLabel, masteredLabel] = legendLabels;
  if (weakLabel) weakLabel.textContent = UI.statsHeatmapLegendWeak;
  if (masteredLabel) masteredLabel.textContent = UI.statsHeatmapLegendMastered;
  const legendEmpty = document.querySelector('.find-note-stats-legend-empty');
  if (legendEmpty) {
    let marker = legendEmpty.querySelector('i');
    if (!marker) {
      marker = document.createElement('i');
      marker.setAttribute('aria-hidden', 'true');
    }
    legendEmpty.replaceChildren(
      marker,
      document.createTextNode(` ${UI.statsHeatmapLegendNeverPlayed}`)
    );
  }
}

/**
 * @module app
 * @description Тонкий оркестратор: boot, mode bar, wiring.
 * @depends config, version, ui-strings, fretboard-view, note-chip, persistence, mode-fret-note, mode-note-frets, mode-find-note, mode-guess-note, studio-shell, ui-strings-apply, test-hooks
 */

const state = {
  activeMode: MODES.FRET_NOTE,
};

const MODE_LABELS = {
  [MODES.FRET_NOTE]: UI.modeFretNote,
  [MODES.NOTE_FRETS]: UI.modeNoteFrets,
  [MODES.FIND_NOTE]: UI.modeFindNote,
  [MODES.GUESS_NOTE]: UI.modeGuessNote,
};

const elements = {
  catalogBtn: document.getElementById('catalog-btn'),
  fretboardContainer: document.getElementById('fretboard-container'),
  findNoteFretRange: document.getElementById('find-note-fret-range'),
  findNoteFretRangeTrack: document.getElementById('find-note-fret-range-track'),
  findNoteFretRangeInactiveLeft: document.getElementById('find-note-fret-range-inactive-left'),
  findNoteFretRangeActive: document.getElementById('find-note-fret-range-active'),
  findNoteFretRangeInactiveRight: document.getElementById('find-note-fret-range-inactive-right'),
  findNoteFretRangeHandleMin: document.getElementById('find-note-fret-range-handle-min'),
  findNoteFretRangeHandleMax: document.getElementById('find-note-fret-range-handle-max'),
  findNoteFretRangeDim: document.getElementById('find-note-fret-range-dim'),
  findNoteFretRangeDimLeft: document.getElementById('find-note-fret-range-dim-left'),
  findNoteFretRangeDimRight: document.getElementById('find-note-fret-range-dim-right'),
  selectionPanel: document.getElementById('selection-panel'),
  notePalettePanel: document.getElementById('note-palette-panel'),
  findNotePanel: document.getElementById('find-note-panel'),
  findNoteTarget: document.getElementById('find-note-target'),
  findNoteProgress: document.getElementById('find-note-progress'),
  findNotePauseBtn: document.getElementById('find-note-pause-btn'),
  findNoteInputs: document.querySelectorAll('.find-note-input'),
  findNoteVariants: document.querySelectorAll('.find-note-variant'),
  findNoteStatsResetBtn: document.getElementById('find-note-stats-reset-btn'),
  findNoteStatsPanel: document.getElementById('find-note-stats-panel'),
  findNoteStatsFretboard: document.getElementById('find-note-stats-fretboard'),
  findNoteStatsPalettes: document.getElementById('find-note-stats-palettes'),
  findNoteStatsLegendBar: document.getElementById('find-note-stats-legend-bar'),
  findNoteDebugLogBtn: document.getElementById('find-note-debug-log-btn'),
  findNoteDebugLogPanel: document.getElementById('find-note-debug-log-panel'),
  findNoteMicStatus: document.getElementById('find-note-mic-status'),
  findNoteListenPanel: document.getElementById('find-note-listen-panel'),
  findNoteListenMeter: document.getElementById('find-note-listen-meter'),
  findNoteListenStatus: document.getElementById('find-note-listen-status'),
  findNoteListenHeard: document.getElementById('find-note-listen-heard'),
  findNoteRecalibrateBtn: document.getElementById('find-note-recalibrate-btn'),
  detailNote: document.getElementById('detail-note'),
  detailOctave: document.getElementById('detail-octave'),
  detailPosition: document.getElementById('detail-position'),
  staffContainer: document.getElementById('staff-container'),
  showAllNotesBtn: document.getElementById('show-all-notes-btn'),
  showAllOctavesBtn: document.getElementById('show-all-octaves-btn'),
  notePalette: document.getElementById('note-palette'),
  guessNotePanel: document.getElementById('guess-note-panel'),
  guessNotePalette: document.getElementById('guess-note-palette'),
  guessNotePauseBtn: document.getElementById('guess-note-pause-btn'),
  guessNoteProgress: document.getElementById('guess-note-progress'),
  guessNoteDebugLogBtn: document.getElementById('guess-note-debug-log-btn'),
  guessNoteDebugLogPanel: document.getElementById('guess-note-debug-log-panel'),
  appVersion: document.getElementById('app-version'),
  fretboardSection: document.querySelector('.fretboard-section'),
};

let modes;
let studioShell;

function syncFretboardEdgeInsets() {
  const width = elements.fretboardContainer?.clientWidth;
  if (!width || !elements.fretboardSection) return;

  const { right } = fretboardContentInsetsPx(GUITAR, width);
  elements.fretboardSection.style.setProperty(
    '--fretboard-edge-inset-right',
    `${Math.round(right)}px`
  );
}

function renderFretboardView() {
  const interactive = state.activeMode !== MODES.GUESS_NOTE;
  renderFretboard(GUITAR, elements.fretboardContainer, { interactive });
  elements.fretboardContainer.dataset.mode = state.activeMode;
  modes?.[MODES.FIND_NOTE]?.restoreMarks?.();
  if (state.activeMode === MODES.GUESS_NOTE) {
    modes?.[MODES.GUESS_NOTE]?.restoreTarget?.();
  }
  studioShell?.syncFretboardFrameSpacing();
  syncFretboardEdgeInsets();
}

modes = {
  [MODES.FRET_NOTE]: createFretNoteMode({ elements }),
  [MODES.NOTE_FRETS]: createNoteFretsMode({ elements }),
  [MODES.FIND_NOTE]: createFindNoteMode({
    elements,
    renderFretboardView,
    syncLayout: () => {
      syncNoteChipWidth(elements.fretboardSection);
      studioShell?.syncFretboardFrameSpacing();
      syncFretboardEdgeInsets();
    },
  }),
  [MODES.GUESS_NOTE]: createGuessNoteMode({
    elements,
    syncLayout: () => {
      syncNoteChipWidth(elements.fretboardSection);
      studioShell?.syncFretboardFrameSpacing();
      syncFretboardEdgeInsets();
    },
  }),
};

let bootPreferences = null;
let currentMode = modes[MODES.FRET_NOTE];

function updateModeDisplay(mode) {
  const label = MODE_LABELS[mode] ?? MODE_LABELS[MODES.FRET_NOTE];
  studioShell?.setModeLabel(label);
  studioShell?.syncCatalog(mode);
}

function applyMode(mode) {
  if (currentMode?.leave) {
    currentMode.leave();
  }

  state.activeMode = mode;
  currentMode = modes[mode] ?? modes[MODES.FRET_NOTE];

  elements.selectionPanel.hidden = true;
  elements.notePalettePanel.hidden = true;
  elements.findNotePanel.hidden = true;
  elements.guessNotePanel.hidden = true;
  elements.fretboardContainer.dataset.mode = mode;
  elements.fretboardContainer.setFindNoteStringVisuals?.(null);
  elements.fretboardContainer.setGuessNoteStringVisuals?.(null);

  updateModeDisplay(mode);
  renderFretboardView();
  syncNoteChipWidth(elements.fretboardSection);
  void currentMode.enter?.();
  void patchAppPreferences({ activeMode: mode });
}

function setMode(mode) {
  applyMode(mode);
}

function initModeBar() {
  studioShell = createStudioShell({
    onModeSelect: setMode,
    onLayoutSync: syncFretboardEdgeInsets,
  });
  studioShell.init();

  const savedMode = bootPreferences?.activeMode;
  const initialMode = Object.values(MODES).includes(savedMode) ? savedMode : MODES.FRET_NOTE;
  applyMode(initialMode);
}

function showBootError(message) {
  if (!elements.fretboardContainer) return;
  elements.fretboardContainer.innerHTML = `
    <div class="boot-error">
      <p><strong>${UI.bootErrorTitle}</strong></p>
      <p>${message}</p>
    </div>
  `;
}

function initOutsideClick() {
  document.addEventListener('pointerdown', (event) => {
    if (elements.fretboardSection?.contains(event.target)) return;
    if (event.target.closest('.bar')) return;
    currentMode.onOutsideClick?.();
  });
}

function initFretboardEvents() {
  elements.fretboardContainer.addEventListener('fret-click', (event) => {
    currentMode.onFretClick?.(event.detail);
  });

  elements.fretboardContainer.addEventListener('string-toggle', (event) => {
    currentMode.onStringToggle?.(event.detail);
  });
}

async function init() {
  if (!elements.fretboardContainer) {
    console.error('Missing #fretboard-container');
    return;
  }

  try {
    if (elements.appVersion) {
      elements.appVersion.textContent = `v${APP_VERSION}`;
    }

    applyStaticUiStrings(elements);

    const data = await loadAppData();
    bootPreferences = data.preferences;

    initModeBar();
    initOutsideClick();
    initFretboardEvents();

    window.addEventListener('resize', () => {
      syncNoteChipWidth(elements.fretboardSection);
      studioShell?.syncFretboardFrameSpacing();
      syncFretboardEdgeInsets();
      elements.fretboardContainer.onFretboardLayoutChange?.();
    });

    elements.showAllNotesBtn?.addEventListener('click', () => {
      modes[MODES.NOTE_FRETS].toggleShowAll?.();
    });

    elements.showAllOctavesBtn?.addEventListener('click', () => {
      modes[MODES.NOTE_FRETS].toggleShowAllOctaves?.();
    });

    installTestHooks(state, {
      findNote: modes[MODES.FIND_NOTE],
      guessNote: modes[MODES.GUESS_NOTE],
    });
    window.__MMA_BOOT = { ok: true, version: APP_VERSION };
  } catch (err) {
    console.error(err);
    showBootError(err.message || UI.bootErrorGeneric);
    window.__MMA_BOOT = { ok: false, error: String(err) };
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  void init();
}

})();
  </script>
